<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b1e">
<meta name="color-scheme" content="dark">
<title>넘버 드롭 · 매스 블록</title>
<style>
@font-face{
  font-family:'NexonLv2Gothic';
  src:url('./NexonLv2Gothic.ttf') format('truetype');
  font-weight:100 900;
  font-style:normal;
  font-display:swap;
}
:root{
  --bg:#070b1e;
  --card:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.14);
  --sub:#a4b0d8;
  --ac:#7c5cff;
  --ac2:#38bdf8;
  --cyan:#22e3dc;
  --mint:#2de2b0;
  --gold:#ffd54f;
  --pink:#ff6b9d;
  --pb:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{
  margin:0;height:100%;overflow:hidden;overscroll-behavior:none;
  background:var(--bg);color:#f4f7ff;
  font-family:'NexonLv2Gothic',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-weight:700;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
svg{display:block}
.hidden{display:none!important}

/* 우주 배경 */
#bg{
  position:fixed;inset:0;
  background:
    radial-gradient(560px 420px at 85% -6%,rgba(56,189,248,.24),transparent 70%),
    radial-gradient(560px 440px at 10% 106%,rgba(124,92,255,.32),transparent 70%),
    radial-gradient(360px 360px at 50% 24%,rgba(34,227,220,.12),transparent 70%),
    linear-gradient(180deg,#0b102c 0%,#060919 100%);
}
#bg::before{
  content:"";position:absolute;inset:0;opacity:.45;
  background-image:
    radial-gradient(1.5px 1.5px at 14% 18%,#fff,transparent),
    radial-gradient(2px 2px at 78% 12%,#bfefff,transparent),
    radial-gradient(1.5px 1.5px at 32% 44%,#fff,transparent),
    radial-gradient(2px 2px at 88% 38%,#ffd54f,transparent),
    radial-gradient(1.5px 1.5px at 18% 74%,#c9b8ff,transparent),
    radial-gradient(2px 2px at 66% 78%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 48% 88%,#9ef5e8,transparent);
}

/* 메인 화면 (이전 게임들과 통일된 중앙 집중형 아케이드 UI) */
.screen{
  position:fixed;inset:0;overflow-y:auto;display:flex;justify-content:center;
  padding:max(14px,env(safe-area-inset-top)) 20px max(22px,env(safe-area-inset-bottom));
  -webkit-overflow-scrolling:touch;
}
.col{
  width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;
  min-height:100%;text-align:center;position:relative;
}
.top{
  width:100%;display:flex;justify-content:flex-end;align-items:center;min-height:44px;
}
.icon{
  width:42px;height:42px;border-radius:14px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
  display:grid;place-items:center;flex:none;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:transform .12s,background .15s;
}
.icon:active{transform:scale(.93);background:rgba(255,255,255,.18)}
.icon svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.hero-wrap{
  margin:clamp(4px,1.8vh,18px) 0 12px;
  position:relative;display:grid;place-items:center;
}
.hero-glow{
  position:absolute;width:118px;height:118px;border-radius:50%;
  background:radial-gradient(circle,rgba(34,227,220,.38) 0%,rgba(124,92,255,.18) 50%,transparent 72%);
  filter:blur(8px);animation:pulseGlow 3s ease-in-out infinite;
}
.hero-emblem{
  position:relative;width:88px;height:88px;border-radius:26px;
  background:linear-gradient(145deg,#38bdf8 0%,#7c5cff 55%,#ec4899 100%);
  box-shadow:0 12px 28px rgba(56,189,248,.35),inset 0 2px 6px rgba(255,255,255,.55);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  animation:floatHero 3.2s ease-in-out infinite;
  border:2px solid rgba(255,255,255,.35);
}
.hero-emblem .h-ico{font-size:40px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.hero-emblem .h-ops{
  margin-top:2px;font-size:11px;letter-spacing:2px;font-weight:900;
  color:#fff8c5;text-shadow:0 1px 3px rgba(0,0,0,.4);
}
@keyframes floatHero{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulseGlow{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}

.brand{margin:4px 0 clamp(14px,2.4vh,20px)}
h1{
  margin:0;font-size:clamp(32px,9vw,40px);line-height:1.18;letter-spacing:-.8px;font-weight:900;
  background:linear-gradient(180deg,#ffffff 0%,#7df9ff 58%,#38bdf8 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 16px rgba(56,189,248,.35));
}
h1 em{
  display:block;font-style:normal;font-size:clamp(18px,5vw,22px);margin-top:4px;letter-spacing:.04em;
  background:linear-gradient(90deg,#ffe066,#ff9f43);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand p{margin:10px 0 0;color:#dce6ff;font-size:14.5px;font-weight:600;line-height:1.45}

/* 게임 안내 박스 */
.info-card{
  width:100%;border-radius:20px;padding:15px 16px;
  background:rgba(28,18,58,.62);
  border:1.5px solid rgba(167,139,250,.48);
  box-shadow:0 10px 26px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12);
  margin-bottom:clamp(16px,2.8vh,22px);
}
.info-main{font-size:14.5px;line-height:1.55;color:#f4f6ff;font-weight:700;margin:0 0 10px}
.info-main b{color:#7df9ff}
.info-keys{
  display:flex;justify-content:center;flex-wrap:wrap;gap:6px;
  padding-top:10px;border-top:1px solid rgba(255,255,255,.1);
}
.kchip{
  font-size:12px;font-weight:700;color:#d6e0ff;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);
  padding:4px 9px;border-radius:999px;
}
.kchip i{font-style:normal;color:#ffd54f;margin-right:3px;font-weight:900}

/* 중앙 알약형 시작 버튼 */
.cta{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  width:min(240px,78%);height:54px;border-radius:999px;
  font-size:19px;font-weight:900;color:#052236;letter-spacing:.03em;
  background:linear-gradient(180deg,#52f3ea 0%,#26c6f9 100%);
  box-shadow:0 6px 0 #1084b5,0 12px 28px rgba(38,198,249,.45);
  transition:transform .1s,box-shadow .1s;
}
.cta:active{transform:translateY(3px);box-shadow:0 3px 0 #1084b5,0 6px 14px rgba(38,198,249,.35)}
.sheet .cta{
  width:100%;height:52px;border-radius:16px;color:#fff;margin-top:16px;
  background:linear-gradient(135deg,#8b6cff,#38bdf8);
  box-shadow:0 8px 22px rgba(90,115,255,.4);
}
.sheet .cta:active{transform:scale(.97);box-shadow:0 4px 12px rgba(90,115,255,.35)}

.ghost{
  display:block;width:100%;height:50px;border-radius:16px;font-size:16px;font-weight:700;
  background:var(--card);border:1px solid var(--line);margin-top:10px;color:#e6ebff;
}
.ghost:active{background:rgba(255,255,255,.14)}

/* 하단 학년 선택 영역 (이전 게임 단계 선택 버튼 스타일) */
.grade-sec{width:100%;margin-top:clamp(18px,3vh,26px)}
.grade-hint{margin:0 0 12px;font-size:13.5px;color:#b8c4ea;font-weight:600}
.seg6{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%}
.gb{
  height:44px;border-radius:12px;
  background:rgba(16,25,58,.75);
  border:1.5px solid rgba(56,189,248,.45);
  font-size:15px;font-weight:800;color:#dce9ff;
  transition:.15s;
}
.gb:active{transform:scale(.96)}
.gb.on{
  color:#041e30;
  background:linear-gradient(180deg,#7df9ff 0%,#38bdf8 100%);
  border-color:#b8fbff;
  box-shadow:0 0 16px rgba(56,189,248,.5);
}
#gdesc{
  margin:13px 0 0;font-size:13.5px;color:#93e5ff;font-weight:700;min-height:20px;
}
.bestl{
  margin:6px 0 0;font-size:13.5px;color:var(--gold);font-weight:800;min-height:20px;
}
.kbd{margin:10px 0 0;font-size:11.5px;color:rgba(164,176,216,.7);font-weight:600}
.grow{flex:1;min-height:8px}

/* 게임 화면 */
#game{
  position:fixed;inset:0;display:flex;flex-direction:column;
  background:radial-gradient(circle at 50% 0%,#19225c 0%,#080c24 65%,#050716 100%);
}
#gbar{
  height:calc(46px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 12px 0 12px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none;
  background:linear-gradient(180deg,rgba(15,21,60,.85),rgba(10,14,42,.35));
  border-bottom:1px solid rgba(255,255,255,.08);
}
#gbarL{display:flex;align-items:center;gap:8px;min-width:0}
#gTitle{
  font-size:13.5px;color:#dce8ff;font-weight:800;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  padding:6px 12px;border-radius:999px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#gbar .icon{width:36px;height:36px;border-radius:11px}
#gbar .icon svg{width:19px;height:19px}

#stage{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) auto}
#cvw{grid-column:1/3;grid-row:1;position:relative;min-height:0}
#cv{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  border-radius:18px;touch-action:none;background:#080c24;display:block;
  box-shadow:0 12px 34px rgba(0,0,0,.55);
}

/* 입체 아케이드 터치 패드 */
#padL,#padR{display:none;gap:12px;align-items:center;padding:8px 0 max(14px,env(safe-area-inset-bottom))}
#padL{grid-column:1;grid-row:2;padding-left:16px;padding-right:6px;justify-content:flex-start}
#padR{grid-column:2;grid-row:2;padding-left:6px;padding-right:16px;justify-content:flex-end}
.padon #padL,.padon #padR{display:flex}
.pb{
  width:var(--pb);height:var(--pb);border-radius:20px;
  background:linear-gradient(180deg,rgba(78,108,215,.48) 0%,rgba(40,56,132,.68) 100%);
  border:1.5px solid rgba(154,188,255,.35);
  box-shadow:0 5px 0 rgba(16,24,68,.9),0 8px 18px rgba(0,0,0,.35),inset 0 2px 4px rgba(255,255,255,.22);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  touch-action:none;flex:none;transition:transform .07s,box-shadow .07s,filter .08s;
}
.pb svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.pb small{font-size:10.5px;font-weight:800;color:rgba(255,255,255,.92);line-height:1}
.pb.on{transform:translateY(3px) scale(.96);box-shadow:0 2px 0 rgba(16,24,68,.9),0 4px 10px rgba(0,0,0,.3);filter:brightness(1.22)}
.pb.dn{
  background:linear-gradient(180deg,#2dd4bf 0%,#0ea5a4 100%);
  border-color:rgba(167,243,208,.6);
  box-shadow:0 5px 0 #0a6366,0 8px 18px rgba(20,184,166,.35),inset 0 2px 4px rgba(255,255,255,.35);
}
.pb.up{
  background:linear-gradient(180deg,#a78bfa 0%,#6366f1 100%);
  border-color:rgba(221,214,254,.65);
  box-shadow:0 5px 0 #3730a3,0 8px 22px rgba(99,102,241,.45),inset 0 2px 4px rgba(255,255,255,.35);
}
@media (orientation:landscape) and (max-height:520px){
  :root{--pb:56px}
  #stage{grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr)}
  #cvw{grid-column:2;grid-row:1}
  #padL{grid-column:1;grid-row:1;align-self:end;padding:10px 6px 14px 16px}
  #padR{grid-column:3;grid-row:1;align-self:end;padding:10px 16px 14px 6px}
}

/* 팝업 오버레이 */
.ov{
  position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(4,7,22,.68);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:20;
}
.ov.c{align-items:center;padding:18px}
.sheet{
  width:100%;max-width:440px;
  background:linear-gradient(180deg,#1a2154 0%,#12173d 100%);
  border:1.5px solid rgba(139,165,255,.26);
  border-radius:28px 28px 0 0;
  padding:24px 22px max(22px,env(safe-area-inset-bottom));
  box-shadow:0 -10px 40px rgba(0,0,0,.5);
  animation:up .24s ease;
}
.sheet.card{border-radius:28px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet h2{margin:0 0 10px;font-size:22px;font-weight:900;color:#fff}
.sw{
  display:flex;justify-content:space-between;align-items:center;width:100%;height:54px;
  font-size:16px;border-bottom:1px solid var(--line);text-align:left;color:#edf2ff;
}
.sw i{width:50px;height:30px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;transition:.2s;flex:none}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.sw.on i{background:linear-gradient(90deg,#2de2b0,#38bdf8)}
.sw.on i::after{transform:translateX(20px)}
.rt{text-align:center;font-size:26px;font-weight:900;color:#fff}
.stars{text-align:center;font-size:48px;letter-spacing:6px;margin:10px 0 6px}
.stars span{display:inline-block;animation:star .5s both;filter:drop-shadow(0 4px 10px rgba(255,213,79,.45))}
@keyframes star{from{transform:scale(0) rotate(-90deg)}}
.new{text-align:center;color:var(--gold);font-weight:900;font-size:16px;margin-bottom:4px}
.rows{margin:12px 0 4px}
.rows div{display:flex;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--line);font-size:16px}
.rows span{color:var(--sub);font-weight:600}
.rows b{color:#fff}
#toast{
  position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);
  background:rgba(20,26,70,.96);border:1px solid rgba(139,165,255,.35);color:#fff;
  padding:11px 20px;border-radius:999px;font-size:14.5px;opacity:0;pointer-events:none;
  transition:.3s;z-index:50;white-space:nowrap;max-width:92vw;
}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="bg"></div>

<div id="menu" class="screen"><div class="col">
  <div class="top">
    <button class="icon" id="btnSet" aria-label="설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>

  <div class="hero-wrap">
    <div class="hero-glow"></div>
    <div class="hero-emblem" aria-hidden="true">
      <div class="h-ico">🧩</div>
      <div class="h-ops">+ − × ÷</div>
    </div>
  </div>

  <div class="brand">
    <h1>아이니의 넘버 드롭<em>매스 블록</em></h1>
    <p>떨어지는 숫자 블록으로 목표를 만들고 보스를 물리쳐요!</p>
  </div>

  <div class="info-card">
    <p class="info-main">목표에 맞게 블록을 붙이면 <b>펑! 폭발!</b><br>보스의 HP를 모두 줄이면 스테이지 클리어!</p>
    <div class="info-keys">
      <span class="kchip"><i>◀ ▶</i>좌우 이동</span>
      <span class="kchip"><i>▲</i>기호·숫자 변환</span>
      <span class="kchip"><i>▼</i>빠른 낙하</span>
    </div>
  </div>

  <button class="cta" id="btnStart">게임 시작</button>

  <div class="grade-sec">
    <p class="grade-hint">학년을 선택해서 바로 도전해 보세요!</p>
    <div class="seg6" id="gradeBtns"></div>
    <p id="gdesc"></p>
    <p class="bestl" id="best"></p>
  </div>

  <div class="grow"></div>
  <p class="kbd" id="kbd">← → 이동 · ↑ 변환 · ↓ 빠른 낙하 · Space 즉시 낙하 · P 일시정지</p>
</div></div>

<div id="game" class="hidden">
  <div id="gbar">
    <div id="gbarL">
      <button class="icon" id="gBack" aria-label="메인으로"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <span id="gTitle"></span>
    </div>
    <button class="icon" id="gPause" aria-label="일시정지"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
  </div>
  <div id="stage">
    <div id="cvw"><canvas id="cv"></canvas></div>
    <div id="padL">
      <button class="pb" data-k="left" aria-label="왼쪽"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="pb" data-k="right" aria-label="오른쪽"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div id="padR">
      <button class="pb dn" data-k="down" aria-label="내리기"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg><small>드롭</small></button>
      <button class="pb up" data-k="up" aria-label="변환"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg><small>변환</small></button>
    </div>
  </div>
</div>

<div id="sheet" class="ov hidden"><div class="sheet">
  <h2>설정</h2>
  <button class="sw" data-t="sfx"><span>효과음</span><i></i></button>
  <button class="sw" data-t="bgm"><span>배경음</span><i></i></button>
  <button class="sw" data-t="voice"><span>음성 읽어주기</span><i></i></button>
  <button class="sw" data-t="pad"><span>터치 패드</span><i></i></button>
  <button class="cta" id="sheetClose">닫기</button>
</div></div>

<div id="pause" class="ov hidden"><div class="sheet">
  <h2>일시정지</h2>
  <button class="sw" data-t="sfx"><span>효과음</span><i></i></button>
  <button class="sw" data-t="bgm"><span>배경음</span><i></i></button>
  <button class="sw" data-t="voice"><span>음성 읽어주기</span><i></i></button>
  <button class="cta" id="pResume">계속하기</button>
  <button class="ghost" id="pQuit">메인으로</button>
</div></div>

<div id="result" class="ov c hidden"><div class="sheet card" id="resBox"></div></div>
<div id="toast"></div>

<script>
'use strict';
//#GEN_START
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

let koVoiceCache=null;
function pickKoVoice(){
  if(!('speechSynthesis' in window))return null;
  const list=speechSynthesis.getVoices()||[];
  const kos=list.filter(v=>v.lang&&v.lang.toLowerCase().indexOf('ko')===0);
  if(!kos.length)return null;
  const prefer=['natural','neural','sunhi','yuna','sora','google','heami','samsung'];
  let best=kos[0],bestScore=-1;
  for(const v of kos){
    const nm=(v.name+' '+v.voiceURI).toLowerCase();
    let sc=v.localService?1:2;
    prefer.forEach((p,idx)=>{if(nm.indexOf(p)>=0)sc+=(prefer.length-idx)*10;});
    if(sc>bestScore){bestScore=sc;best=v;}
  }
  koVoiceCache=best;
  return best;
}
if('speechSynthesis' in window){
  try{
    pickKoVoice();
    speechSynthesis.onvoiceschanged=()=>pickKoVoice();
  }catch(e){}
}
function speak(t){
  if(!S.voice||!('speechSynthesis' in window)||!t)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang='ko-KR';
    u.rate=1.02;
    u.pitch=1.0;
    u.volume=0.96;
    const v=koVoiceCache||pickKoVoice();
    if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

const navStack=[];
let skipPop=0;
try{history.replaceState({nav:'menu',len:0},'');}catch(e){}
function pushNav(tag){
  navStack.push(tag);
  try{history.pushState({nav:tag,len:navStack.length},'');}catch(e){}
}
function popNav(count){
  count=count||1;
  let n=0;
  for(let i=0;i<count&&navStack.length;i++){navStack.pop();n++;}
  if(n>0){
    skipPop++;
    try{history.go(-n);}catch(e){skipPop=Math.max(0,skipPop-1);}
  }
}
window.addEventListener('popstate',()=>{
  if(skipPop>0){skipPop--;return;}
  if(!$('#sheet').classList.contains('hidden')){
    if(navStack[navStack.length-1]==='sheet')navStack.pop();
    closeSheet(true);
    return;
  }
  if(!$('#result').classList.contains('hidden')){
    if(navStack[navStack.length-1]==='result')navStack.pop();
    setTimeout(()=>quitToMenu(false),0);
    return;
  }
  if(!$('#pause').classList.contains('hidden')){
    if(navStack[navStack.length-1]==='pause')navStack.pop();
    togglePause(true);
    return;
  }
  if(G){
    if(navStack[navStack.length-1]==='game')navStack.pop();
    quitToMenu(true);
    return;
  }
});

function calc(op,x,y){switch(op){case '+':return x+y;case '−':return Math.abs(x-y);case '×':return x*y;case '÷':{const hi=Math.max(x,y),lo=Math.min(x,y);return lo?hi/lo:NaN;}}return NaN;}
function pairOp(a,b,gl){if(gl.eq)return(Math.abs(a.val-b.val)<1e-6&&a.label!==b.label)?'=':null;
 const ops=a.op===b.op?[a.op]:[a.op,b.op];for(const op of ops){if(Math.abs(calc(op,a.val,b.val)-gl.target)<1e-6)return op;}return null;}
function makeGoal(g,k){
 const ints=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push({label:String(i),val:i});return r;};
 const frs=d=>{const r=[];for(let i=1;i<d;i++)r.push({label:i+'/'+d,val:r2(i/d)});return r;};
 const decs=()=>{const r=[];for(let i=1;i<=9;i++)r.push({label:(i/10).toFixed(1),val:i/10});return r;};
 if(g===1){const t=[10,12,8][k%3];return{text:'합해서 '+t+' 만들기',spoken:'합해서 '+koInt(t)+' 만들기',ops:['+'],pool:ints(1,9),target:t};}
 if(g===2){const t=[12,18,24][k%3];return{text:'더하거나 곱해서 '+t+' 만들기',spoken:'더하거나 곱해서 '+koInt(t)+' 만들기',ops:['+','×'],pool:ints(2,9),target:t};}
 if(g===3){if(k%2===0){const d=[4,6,8][Math.floor(k/2)%3];return{text:'합해서 1 만들기 (분모 '+d+')',spoken:'합해서 일 만들기',ops:['+'],pool:frs(d),target:1};}
  const t=[3,2,4][k%3];return{text:'나누어서 몫이 '+t+' 되게',spoken:'나누어서 몫이 '+koInt(t)+' 되게',ops:['÷'],pool:ints(2,16),target:t};}
 if(g===4){if(k===0)return{text:'합해서 1.0 만들기',spoken:'합해서 일 점 영 만들기',ops:['+'],pool:decs(),target:1};
  if(k===1)return{text:'합해서 1 만들기 (분모 5)',spoken:'합해서 일 만들기',ops:['+'],pool:frs(5),target:1};
  return{text:'더하거나 빼서 0.5 만들기',spoken:'더하거나 빼서 영 점 오 만들기',ops:['+','−'],pool:decs(),target:.5};}
 if(g===5){const t=[12,24,36][k%3];return{text:'더하거나 곱해서 '+t+' 만들기',spoken:'더하거나 곱해서 '+koInt(t)+' 만들기',ops:['+','×'],pool:ints(2,12),target:t};}
 const pool=[];FAM.forEach(F=>['f','d','p'].forEach(x=>pool.push({label:F[x],val:F.v})));
 return{text:'같은 크기끼리 붙이기!',spoken:'같은 크기끼리 붙여요',ops:['='],pool:pool,eq:true,target:0};}
function genBlock(){
 const gl=G.goal;let item=null;
 if(Math.random()<.6){const ex=[];G.grid.forEach(r=>r.forEach(c=>{if(c&&!c.flash)ex.push(c);}));
  if(ex.length){const e=pick(ex),cands=gl.pool.filter(p=>gl.eq?(Math.abs(p.val-e.val)<1e-6&&p.label!==e.label):gl.ops.some(op=>Math.abs(calc(op,p.val,e.val)-gl.target)<1e-6));if(cands.length)item=pick(cands);}}
 if(!item)item=pick(gl.pool);
 return{label:item.label,val:item.val,op:pick(gl.ops),opts:[item].concat(shuffle(gl.pool.filter(p=>p!==item)).slice(0,2)),oi:0};}
function startDrop(grade){
 G={mode:'drop',grade:grade,dungeon:false,score:0,combo:0,fever:false,feverT:0,defeated:0,pairsTotal:0,coinsGot:0,grid:Array.from({length:ROWS},()=>Array(COLS).fill(null)),cur:null,next:null,phase:'countdown',cd:3.4,lastCd:4,timer:0,clearT:0,pairs:[],chain:0,parts:[],floats:[],shake:0,bossHit:0,t:0,rep:0,paused:false,over:false,speed:.85,bannerT:0,bannerText:'',goalFlash:0};
 setupBoss();G.next=genBlock();}
function setupBoss(){G.bossMax=100+25*G.defeated;G.bossHp=G.bossMax;G.goal=makeGoal(G.grade,G.defeated);G.goalFlash=2;}
function spawn(){const blk=G.next;G.next=genBlock();if(G.grid[0][2]){finish(false);return;}G.cur={c:2,r:0,blk:blk};G.timer=0;G.phase='fall';G.speed=Math.max(.26,.85-.1*G.defeated-.012*Math.min(20,G.pairsTotal));}
const canDown=()=>G.cur.r+1<ROWS&&!G.grid[G.cur.r+1][G.cur.c];
function toggleBlk(){const b=G.cur.blk,gl=G.goal;
 if(gl.ops.length>1){b.op=gl.ops[(gl.ops.indexOf(b.op)+1)%gl.ops.length];}
 else{b.oi=(b.oi+1)%b.opts.length;const o=b.opts[b.oi];b.label=o.label;b.val=o.val;}
 Snd.tone(760,.07,'square',.08,300);b.pop=1;}
function lockBlk(){const c=G.cur;G.grid[c.r][c.c]=c.blk;c.blk.pop=1;G.cur=null;Snd.land();afterLock(false);}
function findPairs(){const used={},res=[],gl=G.goal;
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const a=G.grid[r][c];if(!a||used[r+','+c])continue;
  for(const d of [[0,1],[1,0]]){const nr=r+d[0],nc=c+d[1];if(nr>=ROWS||nc>=COLS)continue;const b=G.grid[nr][nc];if(!b||used[nr+','+nc])continue;
   const op=pairOp(a,b,gl);if(op){used[r+','+c]=used[nr+','+nc]=1;let x=a,y=b;if((op==='−'||op==='÷')&&y.val>x.val){x=b;y=a;}
    res.push({a:a,b:b,ar:r,ac:c,br:nr,bc:nc,op:op,eq:op==='='?a.label+' = '+b.label:x.label+' '+op+' '+y.label+' = '+fmt(calc(op,x.val,y.val))});break;}}}
 return res;}
function afterLock(isChain){
 const pairs=findPairs();
 if(pairs.length){
  G.pairs=pairs;G.phase='clear';G.clearT=.45;pairs.forEach(p=>{p.a.flash=true;p.b.flash=true;});
  let triggerFever=false;
  if(!isChain){G.chain=0;G.combo++;if(G.combo>=3&&!G.fever){G.fever=true;G.feverT=10;triggerFever=true;Snd.fever();G.floats.push({x:W/2,y:260,text:'🔥 FEVER! 점수 2배',c:'#ffe066',size:34,life:2});}}
  if(triggerFever){
    speak(pickFresh(VOICE_LINES.fever,'fever'));
  }else if(isChain){
    speak(eqSpeech(pairs[0].eq)+'. '+pickFresh(VOICE_LINES.chain,'chain'));
  }else{
    speak(eqSpeech(pairs[0].eq)+'. '+pickFresh(VOICE_LINES.praise,'praise'));
  }
  Snd.ok();
 }
 else{if(!isChain)G.combo=0;G.chain=0;if(G.bossHp<=0)bossDefeated();else spawn();}}
function gravity(){for(let c=0;c<COLS;c++){let w=ROWS-1;for(let r=ROWS-1;r>=0;r--){if(G.grid[r][c]){if(r!==w){G.grid[w][c]=G.grid[r][c];G.grid[r][c]=null;}w--;}}}}
function clearDone(){
 const n=G.pairs.length;G.chain++;const mul=G.fever?2:1,dmg=Math.round(25*n*(1+.5*(G.chain-1)));
 G.bossHp-=dmg;G.score+=100*n*G.chain*mul;addCoins(n*mul);G.pairsTotal+=n;
 G.pairs.forEach(p=>{[[p.ar,p.ac],[p.br,p.bc]].forEach(q=>{G.grid[q[0]][q[1]]=null;burst(BX+q[1]*CELL+CELL/2,BY+q[0]*CELL+CELL/2,18,null,7.5);});});
 G.floats.push({x:BX+CELL*COLS/2,y:BY+190,text:(G.chain>1?G.chain+'연쇄! ':'')+'-'+dmg+' HP',c:'#ff8fab',size:32,life:1.3});
 Snd.boom();Snd.boss();G.bossHit=.5;G.shake=.4;gravity();G.pairs=[];afterLock(true);}
function bossDefeated(){
 G.defeated++;addCoins(10);G.score+=500;Snd.win();speak(pickFresh(VOICE_LINES.bossDown,'bossDown'));
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(G.grid[r][c]){burst(BX+c*CELL+CELL/2,BY+r*CELL+CELL/2,8,null,7);G.grid[r][c]=null;}
 for(let i=0;i<50;i++)G.parts.push({x:165+(Math.random()-.5)*200,y:140+(Math.random()-.5)*100,vx:(Math.random()-.5)*10,vy:-Math.random()*6,life:1.5,c:pick(COL),r:6,star:i%2===0});
 if(G.defeated>=3){const g0=G;G.phase='end';setTimeout(()=>{if(G===g0)finish(true);},1200);return;}
 setupBoss();G.next=genBlock();G.phase='banner';G.bannerT=2.2;G.bannerText='보스 격파! 🎉';}
function updDrop(dt){
 updParts(dt);G.shake=Math.max(0,G.shake-dt*3);G.bossHit=Math.max(0,G.bossHit-dt);G.goalFlash=Math.max(0,G.goalFlash-dt);
 G.grid.forEach(r=>r.forEach(b=>{if(b&&b.pop>0)b.pop=Math.max(0,b.pop-dt*5);}));
 if(G.fever){G.feverT-=dt;if(G.feverT<=0){G.fever=false;G.combo=0;}}
 if(G.phase==='countdown'){G.cd-=dt;const n=Math.ceil(G.cd-.4);if(n!==G.lastCd){G.lastCd=n;if(n>0)Snd.tone(440,.12,'square',.1);else Snd.tone(880,.3,'square',.12);}if(G.cd<=0){speak(pickFresh(VOICE_LINES.startGoal,'startGoal')(G.goal.spoken));spawn();}return;}
 if(G.phase==='banner'){G.bannerT-=dt;if(G.bannerT<=0){speak(pickFresh(VOICE_LINES.nextGoal,'nextGoal')(G.goal.spoken));spawn();}return;}
 if(G.phase==='clear'){G.clearT-=dt;if(G.clearT<=0)clearDone();return;}
 if(G.phase!=='fall'||!G.cur)return;
 const cur=G.cur,mv=d=>{const nc=cur.c+d;if(nc>=0&&nc<COLS&&!G.grid[cur.r][nc]){cur.c=nc;Snd.tick();}};
 if(just.left)mv(-1);if(just.right)mv(1);
 if(keys.left||keys.right){G.rep+=dt;if(G.rep>.2){G.rep=.11;mv(keys.left?-1:1);}}else G.rep=0;
 if(just.up)toggleBlk();
 if(just.action){while(canDown())cur.r++;lockBlk();return;}
 const iv=keys.down?.045:G.speed;G.timer+=dt;
 if(G.timer>=iv){G.timer=0;if(canDown())cur.r++;else lockBlk();}}

function wrapFit(s,maxW,maxSize,minSize,maxLines){
 s=String(s);
 const tryF=(fs,L)=>{ctx.font='900 '+fs+'px '+FONT;const words=s.split(' '),lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(!cur||ctx.measureText(t).width<=maxW)cur=t;else{lines.push(cur);cur=w;}}lines.push(cur);return(lines.length<=L&&lines.every(l=>ctx.measureText(l).width<=maxW))?lines:null;};
 for(const q of [[1,Math.max(minSize,Math.round(maxSize*.8))],[2,minSize],[3,minSize]]){if(q[0]>maxLines)break;for(let fs=maxSize;fs>=q[1];fs-=2){const r=tryF(fs,q[0]);if(r)return{fs:fs,lines:r};}}
 return{fs:minSize,lines:[s]};}

/* ===================== 업그레이드된 게임 화면 렌더링 ===================== */
function drawBlk(x,y,b,fall,cs){
 cs=cs||CELL;
 const idx=Math.abs(Math.round(b.val*100)*7+b.label.charCodeAt(0))%GEM_PAL.length;
 const pal=GEM_PAL[idx];
 const pop=b.pop>0?1+Math.sin(b.pop*Math.PI)*.14:1;
 const r=cs*.24;

 ctx.save();
 ctx.translate(x+cs/2,y+cs/2);
 ctx.scale(pop,pop);
 ctx.translate(-cs/2,-cs/2);

 // 그림자 및 발광
 if(fall){
   ctx.shadowColor='rgba(125,249,255,.78)';
   ctx.shadowBlur=16;
 }else{
   ctx.shadowColor='rgba(0,0,0,.38)';
   ctx.shadowBlur=6;
   ctx.shadowOffsetY=3;
 }

 // 하단 입체 받침
 rr(2,3,cs-4,cs-4,r);
 ctx.fillStyle=pal.sh;
 ctx.fill();
 ctx.shadowBlur=0;ctx.shadowOffsetY=0;

 // 3D 젤리/보석 그라데이션 본체
 const g=ctx.createLinearGradient(0,2,0,cs-3);
 g.addColorStop(0,pal.top);
 g.addColorStop(.52,pal.mid);
 g.addColorStop(1,pal.bot);
 rr(2,2,cs-4,cs-6,r);
 ctx.fillStyle=g;
 ctx.fill();

 // 테두리 광택
 ctx.lineWidth=1.8;
 ctx.strokeStyle=pal.rim;
 ctx.stroke();

 // 상단 젤리 하이라이트 (아이들이 좋아하는 반짝임)
 const hg=ctx.createLinearGradient(0,5,0,cs*.38);
 hg.addColorStop(0,'rgba(255,255,255,.55)');
 hg.addColorStop(1,'rgba(255,255,255,.04)');
 rr(6,5,cs-12,cs*.28,r*.65);
 ctx.fillStyle=hg;
 ctx.fill();

 // 작은 반짝이 점
 ctx.beginPath();ctx.arc(cs*.22,cs*.18,cs*.045,0,7);ctx.fillStyle='rgba(255,255,255,.75)';ctx.fill();

 // 숫자 라벨
 label(b.label,cs/2,cs/2+1,cs*.47,'#fff',cs-14,[pal.sh,4.5]);

 // 연산 기호 뱃지
 if(G.goal.ops.length>1&&!G.goal.eq){
   const br=cs*.185;
   ctx.beginPath();ctx.arc(cs*.22,cs*.21,br,0,7);
   ctx.fillStyle='#131942';ctx.fill();
   ctx.strokeStyle='#ffe066';ctx.lineWidth=1.8;ctx.stroke();
   txt(b.op,cs*.22,cs*.21+1,br*1.38,'#ffe066');
 }

 // 정답 매칭 반짝임 효과
 if(b.flash){
   ctx.globalAlpha=.45+Math.sin(T*30)*.4;
   rr(2,2,cs-4,cs-5,r);ctx.fillStyle='#fff';ctx.fill();
   ctx.globalAlpha=1;
 }
 ctx.restore();
}

function bgDrop(){
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#171f5e');
 g.addColorStop(.52,'#0d123c');
 g.addColorStop(1,'#070a24');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 // 은은한 우주 성운 빛무리
 const o1=ctx.createRadialGradient(W*.18,H*.24+Math.sin(T*.7)*14,10,W*.18,H*.24,210);
 o1.addColorStop(0,'rgba(56,189,248,.16)');o1.addColorStop(1,'rgba(56,189,248,0)');
 ctx.fillStyle=o1;ctx.fillRect(0,0,W,H);

 const o2=ctx.createRadialGradient(W*.86,H*.72+Math.cos(T*.6)*16,10,W*.86,H*.72,220);
 o2.addColorStop(0,'rgba(167,139,250,.18)');o2.addColorStop(1,'rgba(167,139,250,0)');
 ctx.fillStyle=o2;ctx.fillRect(0,0,W,H);

 // 반짝이는 별빛
 for(let i=0;i<54;i++){
   const x=(i*173+29)%W,y=(i*97+T*(6+(i%5)*3.5))%H;
   const tw=.25+.55*(.5+.5*Math.sin(T*(2+i%4)+i));
   ctx.fillStyle=i%7===0?'rgba(125,249,255,'+tw+')':i%9===0?'rgba(255,224,102,'+tw+')':'rgba(255,255,255,'+tw+')';
   const sz=1.5+(i%3)*.8;
   ctx.beginPath();ctx.arc(x,y,sz*.7,0,7);ctx.fill();
 }
}

function pn(x,y,w,h,fill,stroke){

 ctx.strokeStyle=stroke||'rgba(165,190,255,.22)';

}

 txt('HP '+Math.max(0,Math.ceil(G.bossHp)),64,95,11,'#e8eeff','center','800');

 // 2) 목표 미션 카드
 pn(126,8,228,96,'rgba(56,38,128,.65)','rgba(125,249,255,.48)');
 if(G.goalFlash>0){ctx.globalAlpha=.28+Math.sin(T*14)*.22;rr(126,8,228,96,18);ctx.fillStyle='#7df9ff';ctx.fill();ctx.globalAlpha=1;}
 rr(204,14,72,18,9);ctx.fillStyle='rgba(56,189,248,.24)';ctx.fill();
 txt('🎯 목표',240,23,11,'#7df9ff','center','900');

 const gf=wrapFit(G.goal.text,208,22,13,2),gl=gf.fs*1.22,gy=57-(gf.lines.length-1)*gl/2;
 gf.lines.forEach((l,i)=>txt(l,240,gy+i*gl,gf.fs,'#fff','center','900',['rgba(16,18,58,.7)',4]));
 txt(G.goal.ops.length>1?'▲ 버튼으로 연산 바꾸기':'▲ 버튼으로 숫자 바꾸기',240,93,10.5,'#c7d2fe','center','700');

 // 3) 다음 블록 카드
 pn(360,8,112,96,'rgba(22,26,72,.76)','rgba(167,139,250,.36)');
 rr(386,14,60,17,9);ctx.fillStyle='rgba(167,139,250,.24)';ctx.fill();
 txt('NEXT',416,22.5,10.5,'#d8ccff','center','900');
 if(G.next){
   const na=ctx.createRadialGradient(416,64,4,416,64,34);
   na.addColorStop(0,'rgba(125,249,255,.2)');na.addColorStop(1,'rgba(125,249,255,0)');
   ctx.fillStyle=na;ctx.beginPath();ctx.arc(416,64,34,0,7);ctx.fill();
   const cs=Math.min(CELL,56);drawBlk(416-cs/2,65-cs/2,G.next,false,cs);
 }

 // ===================== 상태 바 (점수 & 콤보/피버) =====================
 // 점수 뱃지
 rr(10,111,148,24,12);ctx.fillStyle='rgba(255,255,255,.09)';ctx.fill();
 ctx.strokeStyle='rgba(255,213,79,.35)';ctx.lineWidth=1.2;ctx.stroke();
 txt('⭐ '+G.score.toLocaleString(),84,123,14,'#ffe066','center','900');

 // 콤보 / 피버 뱃지
 if(G.fever){
   const pl=1+Math.sin(T*10)*.04;
   ctx.save();ctx.translate(W-100,123);ctx.scale(pl,pl);
   rr(-90,-12,180,24,12);
   const fg=ctx.createLinearGradient(-90,0,90,0);
   fg.addColorStop(0,'#ff6b6b');fg.addColorStop(.5,'#ffa94d');fg.addColorStop(1,'#ffd54f');
   ctx.fillStyle=fg;ctx.fill();
   txt('🔥 FEVER ×2 · '+Math.ceil(G.feverT)+'초',0,0.5,13.5,'#1b1038','center','900');
   ctx.restore();
 }else{
   rr(W-176,111,166,24,12);ctx.fillStyle='rgba(255,255,255,.09)';ctx.fill();
   ctx.strokeStyle='rgba(45,226,176,.35)';ctx.lineWidth=1.2;ctx.stroke();
   txt('연속 성공',W-132,123,12,'#aef7e4','center','800');
   for(let i=0;i<3;i++){
     const px=W-76+i*22,py=123;
     ctx.beginPath();ctx.arc(px,py,6.5,0,7);
     ctx.fillStyle=i<G.combo?'#ffd54f':'rgba(255,255,255,.16)';
     ctx.fill();
     if(i<G.combo){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();}
   }
 }

 drawParts();
 if(G.phase==='banner')banner(G.bannerText,'새 목표: '+G.goal.text);
 if(G.phase==='countdown')drawCountdown();
 if(G.fever){ctx.strokeStyle='rgba(255,213,79,'+(.45+Math.sin(T*8)*.25)+')';ctx.lineWidth=6;ctx.strokeRect(3,3,W-6,H-6);}
 ctx.restore();
}

/* ===================== 종료 / 결과 ===================== */
function finish(win){
 if(!G||G.fover)return;const g0=G;G.fover=true;G.over=true;Snd.stopBgm();for(const k in keys)keys[k]=false;
 if(win)Snd.win();else Snd.lose();
 setTimeout(()=>{if(G===g0)showResult(win);},900);}
function showResult(win){
 const g=G;if(!g)return;
 const st=win?3:clamp(g.defeated,0,2)+(g.score>=300&&g.defeated===0?1:0);
 const key='drop_g'+g.grade,prev=S.best[key]||0,isNew=g.score>prev;if(isNew)S.best[key]=g.score;persist();
 const rows='<div><span>점수</span><b>'+g.score.toLocaleString()+'점</b></div><div><span>물리친 보스</span><b>'+g.defeated+' / 3</b></div><div><span>최고 점수</span><b>'+Math.max(prev,g.score).toLocaleString()+'점</b></div>';
 $('#resBox').innerHTML='<div class="rt">'+(win?'🎉 클리어!':'💪 조금만 더 힘내요!')+'</div><div class="stars">'+[0,1,2].map(i=>'<span style="animation-delay:'+(.15+i*.2)+'s">'+(i<st?'⭐':'☆')+'</span>').join('')+'</div>'+(isNew&&g.score>0?'<div class="new">✨ 신기록 달성!</div>':'')+'<div class="rows">'+rows+'</div>'
  +'<button class="cta" id="rAgain" style="margin-top:16px">다시 하기</button><button class="ghost" id="rMenu">메인으로</button>';
 $('#result').classList.remove('hidden');
 if(navStack[navStack.length-1]!=='result')pushNav('result');
 $('#rAgain').onclick=()=>{Snd.click();$('#result').classList.add('hidden');if(navStack[navStack.length-1]==='result')popNav(1);startGame(lastGrade);};
 $('#rMenu').onclick=()=>{Snd.click();quitToMenu(false);};
 speak(pickFresh(win?VOICE_LINES.win:VOICE_LINES.lose,win?'win':'lose'));}

/* ===================== 메인 루프 ===================== */
let last=0;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;T=ts/1000;
 if(G){if(!G.paused&&!G.over){G.t+=dt;updDrop(dt);}else if(!G.paused){updParts(dt);}
  if(G)drawDrop();}
 just={};}
requestAnimationFrame(loop);
renderMenu();screenTo('menu');
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(()=>{if(G)drawDrop();});}
</script>
