<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff3e0">
<title>Word Guardians - 워드 가디언즈</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- 1. 타이틀 & 프로필 -->
  <section id="title" class="screen active">
    <button class="icon-btn mute" id="btn-mute" aria-label="소리 켜기/끄기">🔊</button>
    <div class="logo">🛡️<span>Word Guardians</span><small>워드 가디언즈 · 영어 단어 모험</small></div>
    <div class="pet-card">
      <div id="pet-emoji" class="pet">🥚</div>
      <div class="pet-info">
        <div id="greet"></div>
        <div><b id="pet-name"></b> · <span id="lv"></span></div>
        <div class="xpbar"><div id="xp-fill"></div></div>
        <div class="stats"><span>🪙 <b id="coins">0</b></span><span>🔥 연속 <b id="streak">0</b>일</span></div>
      </div>
    </div>
    <input id="name-input" maxlength="10" placeholder="내 이름 (닉네임)">
    <div class="menu">
      <button class="btn pink" id="btn-play">▶ 게임 시작</button>
      <button class="btn blue" id="btn-dex">📖 단어 도감 &amp; 오답노트</button>
      <button class="btn purple" id="btn-temple">🏛️ 기억의 신전 (오답 복습)</button>
      <button class="btn yellow" id="btn-manage">📒 단어장 관리</button>
    </div>
  </section>

  <!-- 2. 학년 & 스테이지 선택 -->
  <section id="stages" class="screen">
    <div class="head">
      <button class="icon-btn" id="btn-stages-back">⬅️</button>
      <h2>스테이지 선택</h2>
      <div class="coin-pill">🪙 <b id="stage-coins">0</b></div>
    </div>
    <div class="tabs" id="grade-tabs"></div>
    <div id="grade-desc"></div>
    <div id="stage-grid"></div>
  </section>

  <!-- 4. 인게임 -->
  <section id="game" class="screen">
    <div class="topbar">
      <button class="icon-btn" id="btn-quit">⬅️</button>
      <div class="progress"><div id="hud-fill"></div></div>
      <div id="hearts" class="hearts"></div>
    </div>
    <div class="subbar"><span id="combo">콤보 0</span><span id="score">점수 0</span><span id="hud-coins">🪙 0</span></div>
    <div id="stage-area"></div>
    <div id="answer-area"></div>
    <div id="feedback" class="feedback"></div>
  </section>

  <!-- 5. 결과 -->
  <section id="result" class="screen"><div id="result-body"></div></section>

  <!-- 3. 사전 학습 모달 -->
  <div class="modal" id="modal-pre">
    <div class="sheet">
      <h2 id="pre-title">사전 학습</h2>
      <div class="scroll"><div class="pre-list" id="pre-list"></div></div>
      <div class="row-btns">
        <button class="btn sm" id="pre-replay">🔁 다시 듣기</button>
        <button class="btn sm" id="pre-cancel">닫기</button>
      </div>
      <button class="btn pink" id="pre-go">준비 완료! 출격! ⚔️</button>
    </div>
  </div>

  <!-- 단어 도감 & 오답노트 모달 -->
  <div class="modal" id="modal-col">
    <div class="sheet">
      <h2>📖 단어 도감 &amp; 오답노트</h2>
      <div class="tabs" id="col-tabs"></div>
      <div class="scroll" id="col-body"></div>
      <button class="btn" id="col-close">닫기</button>
    </div>
  </div>

  <!-- 단어장 관리 모달 -->
  <div class="modal" id="modal-manage">
    <div class="sheet">
      <h2>📒 단어장 관리 (부모님용)</h2>
      <div class="scroll">
        <form id="add-form" autocomplete="off">
          <input id="f-en" placeholder="영어 (예: umbrella)" required>
          <input id="f-ko" placeholder="한글 뜻 (예: 우산)" required>
          <input id="f-emoji" placeholder="이모지 (예: ☂️)" maxlength="8">
          <select id="f-grade">
            <option value="1">1학년</option><option value="2" selected>2학년</option><option value="3">3학년</option>
            <option value="4">4학년</option><option value="5">5학년</option><option value="6">6학년</option>
          </select>
          <input id="f-sent" class="full" placeholder="예문 (선택, 예: I have an umbrella.)">
          <button class="btn green sm full" type="submit">➕ 단어 추가</button>
        </form>
        <div class="learned" style="margin:12px 0 6px">내가 추가한 단어 <span id="custom-count"></span></div>
        <div id="custom-list"></div>
        <textarea id="json-box" placeholder="JSON 내보내기 결과가 여기에 표시됩니다. 불러올 JSON을 붙여넣을 수도 있어요."></textarea>
        <div class="row-btns">
          <button class="btn sm blue" id="btn-export">⬇️ 내보내기</button>
          <button class="btn sm" id="btn-import-file">📂 파일 불러오기</button>
          <button class="btn sm" id="btn-import-text">📋 붙여넣은 JSON 불러오기</button>
          <input type="file" id="file-import" accept=".json,application/json" hidden>
        </div>
      </div>
      <button class="btn" id="manage-close">닫기</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
