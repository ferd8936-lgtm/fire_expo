<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>타보까 롤러 클럽 1주년 축하 방명록</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- SheetJS (엑셀 .xlsx 다운로드용) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- JSZip (이미지 일괄 다운로드용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- Firebase SDK (v9 compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @font-face {
            font-family: 'NexonLv2Gothic';
            src: url('NexonLv2Gothic.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: 'NexonLv2Gothic', sans-serif;
            background-color: #ffffff;
            color: #1f2937;
            -webkit-text-size-adjust: 100%;
        }
    </style>
</head>
<body class="bg-white text-gray-800 min-h-screen py-6 px-3.5 sm:py-10 sm:px-4">

    <div class="max-w-xl mx-auto space-y-5 sm:space-y-6">
        
        <!-- 1. 상단 이미지 (111.jpg - 테두리 제거) 및 1주년 인사말 영역 -->
        <div class="space-y-4 text-center">
            <div class="overflow-hidden rounded-2xl">
                <img src="111.jpg" alt="타보까 1주년 메인 이미지" class="w-full h-auto object-cover block" onerror="this.src='https://via.placeholder.com/600x400/f3f4f6/9ca3af?text=111.jpg';">
            </div>

            <div class="px-1 pt-1 text-gray-800 leading-snug text-[14px] sm:text-base break-keep space-y-2">
                <p class="text-xl sm:text-2xl font-bold text-gray-900 pb-1">타보까 롤러클럽이 벌써 1주년!</p>
                <p>미끄러지듯 달려온 한 해, 덕분에 우리는 오늘도 바퀴 위에서 제일 멋진 사람들입니다.</p>
                <p>여러분의 따뜻한 축하, 이번에는 정중히 사양하지 않겠습니다^^</p>
                <p class="font-semibold text-gray-900 pt-0.5">앞으로도 함께 미끄러지고, 함께 성장하는 타보까 롤러클럽이 되겠습니다!</p>
            </div>
        </div>

        <!-- 2. 서브 안내 멘트 영역 (세로 간격 축소) -->
        <div class="bg-gray-50 border border-gray-200 py-3.5 px-4 rounded-2xl text-center shadow-xs break-keep space-y-1 leading-snug">
            <p class="text-gray-800 font-semibold text-[14px] sm:text-base">본인 사진과 함께 축하메세지를 작성해주세요!</p>
            <p class="text-gray-800 font-semibold text-[14px] sm:text-base">우리 타보까 아이들이 정말 좋아할겁니다!</p>
        </div>

        <!-- 3. 입력 폼 영역 (모바일 터치 및 화면 최적화) -->
        <div class="bg-white p-5 sm:p-7 rounded-2xl shadow-sm border border-gray-200 space-y-4">
            
            <!-- ① 소속 입력칸 -->
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">소속</label>
                <input type="text" id="clubName" placeholder="클럽명 또는 지역을 입력해주세요 (예: 타보까)" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:bg-white focus:outline-none focus:border-gray-900 transition text-base sm:text-sm">
            </div>

            <!-- ② 이름 입력칸 -->
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">이름</label>
                <input type="text" id="authorName" placeholder="이름 또는 닉네임을 입력해주세요" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:bg-white focus:outline-none focus:border-gray-900 transition text-base sm:text-sm">
            </div>

            <!-- ③ 축하 메세지 입력칸 -->
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">축하메세지</label>
                <textarea id="message" rows="3" placeholder="따뜻한 축하 메시지를 남겨주세요!" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:bg-white focus:outline-none focus:border-gray-900 transition text-base sm:text-sm"></textarea>
            </div>

            <!-- ④ 이미지 첨부 영역 -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-bold text-gray-600">사진 첨부</label>
                    <button type="button" id="posChangeBtn" onclick="cyclePosition()" class="text-xs font-semibold text-blue-600 hover:text-blue-500 hidden cursor-pointer">🔄 글씨 위치 변경</button>
                </div>
                <input type="file" id="imageInput" accept="image/*" class="w-full text-xs sm:text-sm text-gray-500 file:mr-3 file:py-2.5 file:px-3.5 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-gray-900 file:text-white hover:file:bg-gray-700 file:cursor-pointer cursor-pointer bg-gray-50 border border-gray-200 rounded-xl">
            </div>

            <!-- 미리보기 영역 -->
            <div id="previewContainer" class="hidden space-y-2 pt-1">
                <span class="block text-xs font-bold text-gray-500 text-center">이미지 카드 미리보기</span>
                <div class="relative rounded-xl overflow-hidden border border-gray-200 max-w-xs mx-auto shadow-xs">
                    <canvas id="previewCanvas" class="w-full h-auto block"></canvas>
                </div>
            </div>

            <!-- 등록하기 버튼 -->
            <div class="pt-1">
                <button onclick="submitCard()" id="submitBtn" class="w-full py-3.5 bg-gray-900 hover:bg-gray-800 text-white font-bold rounded-xl shadow-xs transition active:scale-[0.99] cursor-pointer text-sm sm:text-base">
                    축하메세지 등록하기
                </button>
            </div>
        </div>

        <!-- 4. 실시간 방명록 리스트 -->
        <div class="space-y-3.5 pt-2">
            <div class="flex items-center justify-between border-b border-gray-200 pb-2.5 px-1">
                <h3 class="text-sm sm:text-base font-bold text-gray-900">축하 메시지 모음</h3>
                <span class="text-xs font-semibold text-gray-500">총 <strong id="totalCount" class="text-gray-900">0</strong>건</span>
            </div>
            <div id="cardList" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <!-- 동적 카드 삽입 -->
            </div>
        </div>

        <!-- 5. 관리자 다운로드 영역 -->
        <div class="pt-6 border-t border-gray-100 text-center">
            <button onclick="toggleAdmin()" class="text-xs text-gray-400 hover:text-gray-600 underline cursor-pointer">관리자 모드</button>
            <div id="adminPanel" class="hidden mt-3 p-4 bg-gray-50 border border-gray-200 rounded-2xl space-y-3">
                <p class="text-xs font-bold text-gray-700">관리자 전용 다운로드</p>
                <div class="flex flex-wrap gap-2 justify-center">
                    <button onclick="downloadExcel()" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-lg shadow-xs transition cursor-pointer">엑셀(.xlsx) 다운로드</button>
                    <button onclick="downloadAllImages()" class="px-3.5 py-2 bg-gray-800 hover:bg-gray-700 text-white text-xs font-semibold rounded-lg shadow-xs transition cursor-pointer">합성 이미지 일괄 다운로드(ZIP)</button>
                    <button onclick="downloadAllOriginals()" class="px-3.5 py-2 bg-white hover:bg-gray-100 text-gray-700 border border-gray-300 text-xs font-semibold rounded-lg shadow-xs transition cursor-pointer">원본 사진 일괄 다운로드(ZIP)</button>
                </div>
            </div>
        </div>

    </div>

    <!-- 스크립트 로직 -->
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCvbDYGN9c3u1EDljYG0f0PX-xcPHDs_Jg",
          authDomain: "fireexpo-5fee2.firebaseapp.com",
          projectId: "fireexpo-5fee2",
          storageBucket: "fireexpo-5fee2.firebasestorage.app",
          messagingSenderId: "1054718901785",
          appId: "1:1054718901785:web:a13a0a70d3a225870f3488"
        };

        // Firebase 초기화
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentImageBase64 = "";
        let currentOriginalBase64 = "";
        let currentPositionType = 0; // 0: 좌측상단 대각선, 1: 우측상단 대각선, 2: 하단중앙
        let allCardsData = [];

        const imageInput = document.getElementById('imageInput');
        const previewContainer = document.getElementById('previewContainer');
        const posChangeBtn = document.getElementById('posChangeBtn');

        // 이미지 선택 시 처리 및 랜덤 위치 지정
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // 고화질 원본 보관 (리사이즈 없이)
                    currentOriginalBase64 = event.target.result;

                    // 동영상 제작에 적합한 표준 규격(가로 800px 기준)으로 리사이즈 및 합성 준비
                    currentPositionType = Math.floor(Math.random() * 3); // 0, 1, 2 랜덤
                    previewContainer.classList.remove('hidden');
                    posChangeBtn.classList.remove('hidden');
                    updatePreviewCanvas(img);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // 위치 순환 변경 버튼
        function cyclePosition() {
            currentPositionType = (currentPositionType + 1) % 3;
            const file = imageInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() { updatePreviewCanvas(img); };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // 캔버스에 이미지 카드 합성 그리기
        function updatePreviewCanvas(img) {
            const canvas = document.getElementById('previewCanvas');
            const ctx = canvas.getContext('2d');

            // 캔버스 기본 규격 설정 (정사각형 비율 800x800)
            const size = 800;
            canvas.width = size;
            canvas.height = size;

            // 1. 이미지 중앙 크롭(Square) 맞춤
            let w = img.width;
            let h = img.height;
            let sourceX = 0, sourceY = 0, sourceW = w, sourceH = h;

            if (w > h) {
                sourceW = h;
                sourceX = (w - h) / 2;
            } else {
                sourceH = w;
                sourceY = (h - w) / 2;
            }
            ctx.drawImage(img, sourceX, sourceY, sourceW, sourceH, 0, 0, size, size);

            const club = document.getElementById('clubName').value || "소속";
            const author = document.getElementById('authorName').value || "이름";
            const msg = document.getElementById('message').value || "축하 메시지입니다!";

            // 2. 선택된 위치 타입에 따른 디자인 렌더링
            ctx.save();
            if (currentPositionType === 2) {
                // [타입 2] 하단 중앙 수평형
                const grad = ctx.createLinearGradient(0, size - 220, 0, size);
                grad.addColorStop(0, 'rgba(0,0,0,0)');
                grad.addColorStop(1, 'rgba(0,0,0,0.85)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, size - 220, size, 220);

                ctx.fillStyle = '#f472b6';
                ctx.font = 'bold 32px NexonLv2Gothic, sans-serif';
                ctx.fillText(`[${club}] ${author}`, 40, size - 130);

                ctx.fillStyle = '#ffffff';
                ctx.font = '28px NexonLv2Gothic, sans-serif';
                wrapText(ctx, msg, 40, size - 80, size - 80, 36);
            } else {
                // [타입 0 또는 1] 모서리 대각선 스타일 (얼굴 가림 방지)
                const isRight = (currentPositionType === 1);
                const boxW = 450, boxH = 180;
                const boxX = isRight ? size - boxW - 30 : 30;
                const boxY = 30;

                // 반투명 배경 박스
                ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
                ctx.roundRect(boxX, boxY, boxW, boxH, 20);
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 텍스트 내용 작성
                ctx.fillStyle = '#f472b6';
                ctx.font = 'bold 28px NexonLv2Gothic, sans-serif';
                ctx.fillText(`[${club}] ${author}`, boxX + 25, boxY + 50);

                ctx.fillStyle = '#ffffff';
                ctx.font = '24px NexonLv2Gothic, sans-serif';
                wrapText(ctx, msg, boxX + 25, boxY + 95, boxW - 50, 30);
            }
            ctx.restore();

            // 최종 합성본 Base64 저장
            currentImageBase64 = canvas.toDataURL('image/jpeg', 0.9);
        }

        // 줄바꿈 헬퍼 함수
        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            let words = text.split('');
            let line = '';
            let lineCount = 0;

            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n];
                let metrics = ctx.measureText(testLine);
                let testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    ctx.fillText(line, x, y);
                    line = words[n];
                    y += lineHeight;
                    lineCount++;
                    if (lineCount >= 2) {
                        line += '...';
                        break;
                    }
                } else {
                    line = testLine;
                }
            }
            ctx.fillText(line, x, y);
        }

        // 입력 폼 변경 시 실시간 미리보기 갱신
        document.getElementById('clubName').addEventListener('input', refreshCanvas);
        document.getElementById('authorName').addEventListener('input', refreshCanvas);
        document.getElementById('message').addEventListener('input', refreshCanvas);

        function refreshCanvas() {
            const file = imageInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() { updatePreviewCanvas(img); };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // 메시지 등록 함수
        function submitCard() {
            const club = document.getElementById('clubName').value.trim();
            const author = document.getElementById('authorName').value.trim();
            const message = document.getElementById('message').value.trim();

            if (!club || !author || !message) {
                alert('소속, 이름, 축하 메시지를 모두 입력해주세요!');
                return;
            }
            if (!currentImageBase64) {
                alert('본인 사진을 첨부해주세요!');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = '등록 중입니다...';

            const newPostRef = db.ref('anniversary_cards').push();
            newPostRef.set({
                club: club,
                author: author,
                message: message,
                image: currentImageBase64,
                originalImage: currentOriginalBase64,
                timestamp: Date.now()
            }, function(error) {
                if (error) {
                    alert('등록 중 오류가 발생했습니다. 다시 시도해주세요.');
                    submitBtn.disabled = false;
                    submitBtn.innerText = '축하메세지 등록하기';
                } else {
                    alert('🎉 타보까 1주년 축하 메시지가 성공적으로 등록되었습니다!');
                    // 입력창 초기화
                    document.getElementById('clubName').value = '';
                    document.getElementById('authorName').value = '';
                    document.getElementById('message').value = '';
                    imageInput.value = '';
                    previewContainer.classList.add('hidden');
                    posChangeBtn.classList.add('hidden');
                    currentImageBase64 = '';
                    currentOriginalBase64 = '';
                    submitBtn.disabled = false;
                    submitBtn.innerText = '축하메세지 등록하기';
                }
            });
        }

        // 실시간 데이터 불러오기 및 리스트 렌더링
        db.ref('anniversary_cards').on('value', function(snapshot) {
            const cardList = document.getElementById('cardList');
            cardList.innerHTML = '';
            allCardsData = [];

            let count = 0;
            snapshot.forEach(function(childSnapshot) {
                const data = childSnapshot.val();
                data.id = childSnapshot.key;
                allCardsData.push(data);
                count++;
            });

            // 최신순 정렬
            allCardsData.sort((a, b) => b.timestamp - a.timestamp);
            document.getElementById('totalCount').innerText = count;

            if (allCardsData.length === 0) {
                cardList.innerHTML = '<p class="col-span-2 text-center text-gray-400 py-10 text-sm">아직 등록된 축하 메시지가 없습니다. 첫 주인공이 되어주세요!</p>';
                return;
            }

            allCardsData.forEach((item, index) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-xs flex flex-col';
                cardDiv.innerHTML = `
                    <div class="relative">
                        <img src="${item.image}" alt="축하카드" class="w-full h-auto object-cover">
                    </div>
                    <div class="p-3.5 flex-1 flex flex-col justify-between space-y-1.5">
                        <div>
                            <span class="text-xs font-bold text-gray-900">[${escapeHtml(item.club)}] ${escapeHtml(item.author)}</span>
                            <p class="text-sm text-gray-700 mt-1 leading-snug break-keep">${escapeHtml(item.message)}</p>
                        </div>
                        <span class="text-[11px] text-gray-400 text-right">${new Date(item.timestamp).toLocaleString()}</span>
                    </div>
                `;
                cardList.appendChild(cardDiv);
            });
        });

        // HTML Escape 헬퍼
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // 관리자 모드 토글
        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            if (panel.classList.contains('hidden')) {
                const pw = prompt('관리자 비밀번호를 입력하세요:');
                if (pw === '1234') {
                    panel.classList.remove('hidden');
                } else if (pw !== null) {
                    alert('비밀번호가 틀렸습니다.');
                }
            } else {
                panel.classList.add('hidden');
            }
        }

        // 1. 엑셀(.xlsx) 다운로드
        function downloadExcel() {
            if (allCardsData.length === 0) {
                alert('다운로드할 데이터가 없습니다.');
                return;
            }
            const excelData = allCardsData.map((item, idx) => ({
                "번호": idx + 1,
                "작성시간": new Date(item.timestamp).toLocaleString(),
                "소속": item.club,
                "이름": item.author,
                "축하메세지": item.message
            }));

            const worksheet = XLSX.utils.json_to_sheet(excelData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "타보까1주년방명록");
            XLSX.writeFile(workbook, "Tabogga_1st_Anniversary_List.xlsx");
        }

        // 2. 완성된 이미지 카드 일괄 다운로드 (ZIP)
        function downloadAllImages() {
            if (allCardsData.length === 0) {
                alert('다운로드할 이미지가 없습니다.');
                return;
            }
            const zip = new JSZip();
            const imgFolder = zip.folder("Tabogga_Anniversary_Cards");

            allCardsData.forEach((item, idx) => {
                const paddedNum = String(idx + 1).padStart(3, '0');
                const cleanClub = item.club.replace(/[/\\?%*:|"<>]/g, '');
                const cleanAuthor = item.author.replace(/[/\\?%*:|"<>]/g, '');
                const fileName = `${paddedNum}_${cleanClub}_${cleanAuthor}.jpg`;
                
                const base64Data = item.image.split(';base64,')[1];
                imgFolder.file(fileName, base64Data, { base64: true });
            });

            zip.generateAsync({ type: "blob" }).then(function(content) {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = "Tabogga_Anniversary_Cards.zip";
                link.click();
            });
        }

        // 3. 원본 사진 일괄 다운로드 (ZIP)
        function downloadAllOriginals() {
            if (allCardsData.length === 0) {
                alert('다운로드할 원본 사진이 없습니다.');
                return;
            }
            const zip = new JSZip();
            const imgFolder = zip.folder("Tabogga_Original_Photos");

            allCardsData.forEach((item, idx) => {
                if (!item.originalImage) return;
                const paddedNum = String(idx + 1).padStart(3, '0');
                const cleanClub = item.club.replace(/[/\\?%*:|"<>]/g, '');
                const cleanAuthor = item.author.replace(/[/\\?%*:|"<>]/g, '');
                const fileName = `${paddedNum}_${cleanClub}_${cleanAuthor}_original.jpg`;
                
                const base64Data = item.originalImage.split(';base64,')[1];
                if (base64Data) {
                    imgFolder.file(fileName, base64Data, { base64: true });
                }
            });

            zip.generateAsync({ type: "blob" }).then(function(content) {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = "Tabogga_Original_Photos.zip";
                link.click();
            });
        }
    </script>
</body>
</html>
