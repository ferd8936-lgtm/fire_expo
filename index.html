<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>신나는 수학 어드벤처 - 초등 1~6학년 액션 수학 게임</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      font-family: 'Jua', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      color: #0f172a;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    /* 전체 게임 프레임 (화면 꽉 차게 확대) */
    .game-shell {
      width: 100%;
      max-width: 1120px;
      height: 96vh;
      max-height: 820px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      border: 5px solid #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* ==========================================
       1. 시작 메뉴 (홈 화면) - 직관적인 카드형 UI
       ========================================== */
    .start-screen {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #e0f2fe 0%, #bae6fd 100%);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 28px;
      overflow-y: auto;
    }

    .start-screen.hidden {
      display: none;
    }

    .title-banner {
      text-align: center;
    }

    .title-banner h1 {
      font-size: 2.6rem;
      color: #0369a1;
      text-shadow: 0 3px 0 #ffffff;
      margin-bottom: 4px;
    }

    .title-banner p {
      font-size: 1.15rem;
      color: #334155;
    }

    .section-box {
      width: 100%;
      max-width: 860px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 22px;
      padding: 16px 20px;
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.12);
    }

    .section-title {
      font-size: 1.25rem;
      color: #0f172a;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 학년 선택 그리드 */
    .grade-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .grade-card {
      font-family: 'Jua', sans-serif;
      background: #f8fafc;
      border: 3px solid #cbd5e1;
      border-radius: 16px;
      padding: 12px 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .grade-card:hover {
      border-color: #38bdf8;
      background: #f0f9ff;
    }

    .grade-card.selected {
      background: #fef08a;
      border-color: #eab308;
      box-shadow: 0 5px 0 #ca8a04;
      transform: translateY(-2px);
    }

    .grade-card .g-num {
      font-size: 1.35rem;
      color: #0f172a;
      display: block;
    }

    .grade-card .g-desc {
      font-size: 0.9rem;
      color: #475569;
      margin-top: 2px;
      display: block;
    }

    /* 게임 모드 & 캐릭터 선택 */
    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .mode-card {
      font-family: 'Jua', sans-serif;
      background: #f8fafc;
      border: 3px solid #cbd5e1;
      border-radius: 18px;
      padding: 14px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      transition: all 0.15s;
    }

    .mode-card.selected {
      background: #dcfce7;
      border-color: #22c55e;
      box-shadow: 0 5px 0 #16a34a;
      transform: translateY(-2px);
    }

    .mode-icon {
      font-size: 2.6rem;
      flex-shrink: 0;
    }

    .mode-info h3 {
      font-size: 1.35rem;
      color: #0f172a;
      margin-bottom: 3px;
    }

    .mode-info p {
      font-size: 0.92rem;
      color: #475569;
      line-height: 1.3;
    }

    /* 캐릭터 선택 바 */
    .char-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .char-list {
      display: flex;
      gap: 8px;
    }

    .char-btn {
      font-size: 1.9rem;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      border: 3px solid #cbd5e1;
      background: #f8fafc;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .char-btn.selected {
      border-color: #f43f5e;
      background: #ffe4e6;
      transform: scale(1.1);
    }

    .start-play-btn {
      font-family: 'Jua', sans-serif;
      background: linear-gradient(180deg, #f43f5e 0%, #e11d48 100%);
      color: #ffffff;
      border: none;
      border-radius: 20px;
      padding: 16px 48px;
      font-size: 1.7rem;
      cursor: pointer;
      box-shadow: 0 7px 0 #9f1239;
      transition: transform 0.1s;
    }

    .start-play-btn:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 #9f1239;
    }

    /* ==========================================
       2. 인게임 상단 바 (단순·명확한 정보만 표시)
       ========================================== */
    .hud-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      background: #0f172a;
      color: #ffffff;
      height: 62px;
      flex-shrink: 0;
    }

    .hud-left, .hud-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .home-btn, .sound-btn {
      font-family: 'Jua', sans-serif;
      background: #334155;
      color: #ffffff;
      border: 2px solid #64748b;
      border-radius: 12px;
      padding: 7px 14px;
      font-size: 1.05rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .home-btn:hover, .sound-btn:hover {
      background: #475569;
    }

    .badge-info {
      background: #1e293b;
      border: 2px solid #38bdf8;
      color: #7dd3fc;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 1.05rem;
    }

    .score-pill {
      background: #1e293b;
      border: 2px solid #facc15;
      color: #fde047;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 1.15rem;
    }

    /* ==========================================
       3. 대화면 게임 캔버스 영역
       ========================================== */
    .canvas-stage {
      flex: 1;
      width: 100%;
      background: #7dd3fc;
      position: relative;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ==========================================
       4. 하단 조작 패드 (누구나 한눈에 아는 버튼)
       ========================================== */
    .control-pad {
      height: 86px;
      background: #1e293b;
      padding: 10px 18px;
      display: grid;
      grid-template-columns: 1fr 1fr 1.6fr;
      gap: 14px;
      flex-shrink: 0;
    }

    .pad-btn {
      font-family: 'Jua', sans-serif;
      border: none;
      border-radius: 18px;
      font-size: 1.45rem;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      touch-action: manipulation;
      transition: transform 0.06s;
    }

    .pad-btn:active {
      transform: translateY(4px);
    }

    .pad-move {
      background: linear-gradient(180deg, #475569 0%, #334155 100%);
      border-bottom: 5px solid #0f172a;
    }

    .pad-action {
      background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
      border-bottom: 5px solid #92400e;
      font-size: 1.55rem;
    }

    @media (max-width: 720px) {
      .game-shell { height: 98vh; border-radius: 18px; }
      .title-banner h1 { font-size: 1.9rem; }
      .grade-grid { grid-template-columns: repeat(2, 1fr); }
      .mode-grid { grid-template-columns: 1fr; }
      .pad-btn { font-size: 1.2rem; }
      .control-pad { height: 76px; padding: 8px 12px; gap: 8px; }
    }
  </style>
</head>
<body>

<div class="game-shell">

  <!-- ========================================================
       [화면 1] 깔끔한 시작 메뉴 (학년 & 게임 모드 선택)
       ======================================================== -->
  <div class="start-screen" id="startScreen">
    <div class="title-banner">
      <h1>🌟 신나는 수학 어드벤처</h1>
      <p>학년과 게임을 고르고 재미있게 수학을 정복해 보세요!</p>
    </div>

    <!-- 1단계: 학년 선택 -->
    <div class="section-box">
      <div class="section-title">1️⃣ 학년을 선택하세요</div>
      <div class="grade-grid" id="gradeSelector">
        <button class="grade-card" data-grade="1">
          <span class="g-num">🌱 1학년</span>
          <span class="g-desc">10 만들기 · 한 자리 덧뺄셈</span>
        </button>
        <button class="grade-card selected" data-grade="2">
          <span class="g-num">⭐ 2학년 (추천)</span>
          <span class="g-desc">구구단(2~9단) · 두 자리 덧뺄셈</span>
        </button>
        <button class="grade-card" data-grade="3">
          <span class="g-num">🐬 3학년</span>
          <span class="g-desc">나눗셈 기초 · 분수 더하기</span>
        </button>
        <button class="grade-card" data-grade="4">
          <span class="g-num">🌋 4학년</span>
          <span class="g-desc">소수 덧뺄셈 · 큰 수 연산</span>
        </button>
        <button class="grade-card" data-grade="5">
          <span class="g-num">🚀 5학년</span>
          <span class="g-desc">약수와 배수 · 혼합 계산</span>
        </button>
        <button class="grade-card" data-grade="6">
          <span class="g-num">👑 6학년</span>
          <span class="g-desc">분수·소수·백분율(%) 변환</span>
        </button>
      </div>
    </div>

    <!-- 2단계: 게임 모드 선택 -->
    <div class="section-box">
      <div class="section-title">2️⃣ 어떤 게임을 할까요?</div>
      <div class="mode-grid" id="modeSelector">
        <button class="mode-card selected" data-mode="mario">
          <div class="mode-icon">🍄</div>
          <div class="mode-info">
            <h3>점프점프 수학 (마리오)</h3>
            <p>달리고 점프해서 <b>정답이 적힌 황금 벽돌</b>을 머리로 쾅! 치세요.</p>
          </div>
        </button>
        <button class="mode-card" data-mode="tetris">
          <div class="mode-icon">🧱</div>
          <div class="mode-info">
            <h3>블록 맞추기 퍼즐 (테트리스)</h3>
            <p>내려오는 <b>문제 블록</b>을 움직여 바닥의 <b>정답 숫자 블록</b> 위에 떨어뜨리세요.</p>
          </div>
        </button>
      </div>
    </div>

    <!-- 3단계: 캐릭터 선택 및 시작 버튼 -->
    <div class="section-box char-row">
      <div>
        <div class="section-title" style="margin-bottom: 6px;">3️⃣ 내 캐릭터 고르기</div>
        <div class="char-list" id="charSelector">
          <button class="char-btn selected" data-char="🧚">🧚</button>
          <button class="char-btn" data-char="🐰">🐰</button>
          <button class="char-btn" data-char="🦖">🦖</button>
          <button class="char-btn" data-char="🐱">🐱</button>
          <button class="char-btn" data-char="🧑‍🚀">🧑‍🚀</button>
          <button class="char-btn" data-char="🦄">🦄</button>
        </div>
      </div>

      <button class="start-play-btn" id="startGameBtn">🎮 게임 시작하기!</button>
    </div>
  </div>

  <!-- ========================================================
       [화면 2] 본 게임 플레이 화면 (대화면 캔버스 + 심플 조작부)
       ======================================================== -->
  <div class="hud-bar">
    <div class="hud-left">
      <button class="home-btn" id="backHomeBtn">🏠 메뉴로</button>
      <div class="badge-info" id="currentInfoBadge">2학년 · 점프점프 수학</div>
    </div>

    <div class="hud-right">
      <div class="score-pill">⭐ 점수 <span id="scoreText">0</span>점</div>
      <div class="score-pill" style="border-color:#fb923c; color:#fdba74;">🔥 연속 <span id="comboText">0</span></div>
      <button class="sound-btn" id="soundToggleBtn">🔊 소리 켜짐</button>
    </div>
  </div>

  <div class="canvas-stage">
    <canvas id="gameCanvas" width="1000" height="600"></canvas>
  </div>

  <div class="control-pad">
    <button class="pad-btn pad-move" id="btnLeft">◀ 왼쪽 이동</button>
    <button class="pad-btn pad-move" id="btnRight">오른쪽 이동 ▶</button>
    <button class="pad-btn pad-action" id="btnAction">⏫ 점프하기! (스페이스바)</button>
  </div>

</div>

<script>
/**
 * ============================================================================
 * 1. 효과음 & 음성 읽어주기 엔진 (Web Audio & Speech API)
 * ============================================================================
 */
const Sound = {
  ctx: null,
  enabled: true,

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  },

  tone(freq, type = 'triangle', duration = 0.12, vol = 0.15, slide = null) {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;

    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slide) osc.frequency.exponentialRampToValueAtTime(slide, now + duration);

    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + duration);
  },

  jump() { this.tone(300, 'sine', 0.15, 0.15, 650); },
  move() { this.tone(440, 'sine', 0.04, 0.07); },
  wrong() { this.tone(240, 'sawtooth', 0.22, 0.12, 160); },
  correct() {
    [523.25, 659.25, 783.99, 1046.5].forEach((n, i) => {
      setTimeout(() => this.tone(n, 'triangle', 0.14, 0.18), i * 70);
    });
  },

  speak(text) {
    if (!this.enabled || !('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      u.rate = 1.1;
      u.pitch = 1.15;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
};

/**
 * ============================================================================
 * 2. 초등 1~6학년 수학 문제 생성기 (문제 + 시각적 힌트 포함)
 * ============================================================================
 */
function rand(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function createMathQuestion(grade) {
  let q = {
    question: '',      // 큰 문제 텍스트
    shortQ: '',        // 테트리스 떨어지는 블록용 짧은 식
    answer: '',        // 정답 (숫자 또는 문자열)
    numAnswer: 0,      // 크기 비교용 숫자값
    speech: '',        // 정답 음성 안내
    hintText: '',      // 친절한 풀이 힌트
    visualType: 'none',
    visualData: {},
    options: []
  };

  if (grade === 1) {
    // 1학년: 10 만들기 & 기초 덧뺄셈
    if (Math.random() < 0.5) {
      const a = rand(1, 9);
      const ans = 10 - a;
      q.question = `${a} + [ ? ] = 10`;
      q.shortQ = `10 - ${a}`;
      q.answer = `${ans}`;
      q.numAnswer = ans;
      q.speech = `${a} 더하기 ${ans}은 10! 정답!`;
      q.hintText = `구슬 10개 중 ${a}개가 있어요. 남은 빈칸은 몇 개일까요?`;
      q.visualType = 'tenframe';
      q.visualData = { filled: a };
    } else {
      const a = rand(2, 9);
      const b = rand(2, 8);
      const ans = a + b;
      q.question = `${a} + ${b} = ?`;
      q.shortQ = `${a} + ${b}`;
      q.answer = `${ans}`;
      q.numAnswer = ans;
      q.speech = `${a} 더하기 ${b}은 ${ans}!`;
      q.hintText = `${a}에서 ${b}만큼 더 세어 보세요!`;
    }
  } else if (grade === 2) {
    // 2학년: 구구단(2~9단) & 두 자리 덧뺄셈
    if (Math.random() < 0.7) {
      const dan = rand(2, 9);
      const m = rand(2, 9);
      const ans = dan * m;
      q.question = `${dan} × ${m} = ?`;
      q.shortQ = `${dan} × ${m}`;
      q.answer = `${ans}`;
      q.numAnswer = ans;
      q.speech = `${dan} 곱하기 ${m}은 ${ans}!`;
      q.hintText = `${dan}씩 ${m}묶음입니다. (${dan}단 구구단)`;
      q.visualType = 'groups';
      q.visualData = { dan, m };
    } else {
      const a = rand(12, 45);
      const b = rand(11, 38);
      const ans = a + b;
      q.question = `${a} + ${b} = ?`;
      q.shortQ = `${a} + ${b}`;
      q.answer = `${ans}`;
      q.numAnswer = ans;
      q.speech = `${a} 더하기 ${b}은 ${ans}!`;
      q.hintText = `십의 자리끼리, 일의 자리끼리 더해 보세요!`;
    }
  } else if (grade === 3) {
    // 3학년: 나눗셈 & 기초 분수
    if (Math.random() < 0.55) {
      const b = rand(2, 9);
      const ans = rand(2, 9);
      const a = b * ans;
      q.question = `${a} ÷ ${b} = ?`;
      q.shortQ = `${a} ÷ ${b}`;
      q.answer = `${ans}`;
      q.numAnswer = ans;
      q.speech = `${a} 나누기 ${b}는 ${ans}!`;
      q.hintText = `${b}에 얼마를 곱하면 ${a}가 될까요? (${b} × ? = ${a})`;
    } else {
      const denom = [4, 5, 6, 8][rand(0, 3)];
      const n1 = rand(1, denom - 2);
      const n2 = rand(1, denom - n1);
      const ans = n1 + n2;
      q.question = `${n1}/${denom} + ${n2}/${denom} = [ ? ]/${denom}`;
      q.shortQ = `${n1}+${n2} (분자)`;
      q.answer = `${ans}`;
      q.numAnswer = ans;
      q.speech = `${denom}분의 ${n1} 더하기 ${denom}분의 ${n2}는 ${denom}분의 ${ans}!`;
      q.hintText = `분모(${denom})는 그대로 두고, 위의 분자(${n1} + ${n2})만 더해요!`;
      q.visualType = 'pizza';
      q.visualData = { denom, n1, n2 };
    }
  } else if (grade === 4) {
    // 4학년: 소수 한 자리 덧뺄셈 & 큰 수 곱셈
    const a = rand(2, 15);
    const b = rand(2, 15);
    const ans = a + b;
    q.question = `0.${a < 10 ? a : a} → ${(a / 10).toFixed(1)} + ${(b / 10).toFixed(1)} = ?`;
    q.question = `${(a / 10).toFixed(1)} + ${(b / 10).toFixed(1)} = ?`;
    q.shortQ = `${(a / 10).toFixed(1)}+${(b / 10).toFixed(1)}`;
    q.answer = `${(ans / 10).toFixed(1)}`;
    q.numAnswer = ans / 10;
    q.speech = `정답은 ${(ans / 10).toFixed(1)} 입니다!`;
    q.hintText = `소수점 자리를 맞춰 자연수처럼 더한 뒤 소수점을 찍어요!`;
  } else if (grade === 5) {
    // 5학년: 약수와 배수 & 혼합 계산
    if (Math.random() < 0.5) {
      const a = rand(10, 25);
      const b = rand(2, 6);
      const c = rand(2, 5);
      const ans = a + b * c;
      q.question = `${a} + (${b} × ${c}) = ?`;
      q.shortQ = `${a}+${b}×${c}`;
      q.answer = `${ans}`;
      q.numAnswer = ans;
      q.speech = `${b} 곱하기 ${c}를 먼저 계산하면 정답은 ${ans}!`;
      q.hintText = `곱셈(${b} × ${c} = ${b * c})을 먼저 계산한 뒤 ${a}를 더하세요!`;
    } else {
      const pairs = [
        { a: 12, b: 18, gcd: 6 },
        { a: 8, b: 12, gcd: 4 },
        { a: 15, b: 20, gcd: 5 },
        { a: 16, b: 24, gcd: 8 },
        { a: 14, b: 21, gcd: 7 },
        { a: 18, b: 27, gcd: 9 }
      ];
      const p = pairs[rand(0, pairs.length - 1)];
      q.question = `${p.a}와 ${p.b}의 최대공약수는?`;
      q.shortQ = `최대공약수(${p.a},${p.b})`;
      q.answer = `${p.gcd}`;
      q.numAnswer = p.gcd;
      q.speech = `${p.a}와 ${p.b}의 최대공약수는 ${p.gcd}!`;
      q.hintText = `${p.a}와 ${p.b}를 동시에 나눌 수 있는 가장 큰 수를 찾으세요!`;
    }
  } else {
    // 6학년: 분수·소수·백분율(%) 변환
    const list = [
      { f: '1/2', d: '0.5', p: 50 },
      { f: '1/4', d: '0.25', p: 25 },
      { f: '3/4', d: '0.75', p: 75 },
      { f: '1/5', d: '0.2', p: 20 },
      { f: '2/5', d: '0.4', p: 40 },
      { f: '3/5', d: '0.6', p: 60 },
      { f: '4/5', d: '0.8', p: 80 },
      { f: '3/10', d: '0.3', p: 30 }
    ];
    const item = list[rand(0, list.length - 1)];
    q.question = `분수 ${item.f} (소수 ${item.d})를 백분율로 바꾸면 몇 %?`;
    q.shortQ = `${item.f} = ?%`;
    q.answer = `${item.p}`;
    q.numAnswer = item.p;
    q.speech = `${item.f}은 백분율로 ${item.p} 퍼센트!`;
    q.hintText = `소수(${item.d})에 100을 곱하면 백분율(%)이 됩니다!`;
  }

  // 보기 4개 생성
  const set = new Set([q.answer]);
  while (set.size < 4) {
    if (grade === 4) {
      let cand = (q.numAnswer + rand(-5, 5) * 0.1).toFixed(1);
      if (parseFloat(cand) > 0) set.add(cand);
    } else {
      let diff = rand(-7, 7);
      if (diff === 0) diff = 3;
      let cand = Math.round(q.numAnswer + diff);
      if (cand > 0) set.add(`${cand}`);
    }
  }
  q.options = Array.from(set).sort((a, b) => parseFloat(a) - parseFloat(b));
  return q;
}

/**
 * ============================================================================
 * 3. 메인 게임 컨트롤러 (마리오 점프 모드 & 테트리스 블록 맞추기 모드)
 * ============================================================================
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const State = {
  playing: false,
  grade: 2,
  mode: 'mario', // 'mario' | 'tetris'
  charEmoji: '🧚',
  score: 0,
  combo: 0,
  question: null,
  feedbackBubble: null, // { text, color, timer }
  particles: [],
  keys: { left: false, right: false },

  // 마리오 모드 데이터
  player: { x: 470, y: 450, vx: 0, vy: 0, w: 62, h: 62, onGround: true },
  blocks: [],
  slime: { x: 180, y: 472, vx: 2.2, w: 50, h: 42 },
  clouds: [
    { x: 120, y: 170, s: 1.0 },
    { x: 520, y: 145, s: 1.25 },
    { x: 840, y: 185, s: 0.9 }
  ],

  // 테트리스 모드 데이터 (5열 직관적 정답 매칭 퍼즐)
  tetris: {
    cols: 5,
    bottomAnswers: [], // 각 열 바닥에 놓인 숫자 블록들 [{ val, qRef }]
    falling: null,     // 현재 떨어지는 문제 블록 { col, y, speed, questionObj }
    fastDrop: false
  }
};

function startGame() {
  State.score = 0;
  State.combo = 0;
  State.playing = true;
  updateHudText();

  const modeName = State.mode === 'mario' ? '🍄 점프점프 수학' : '🧱 블록 맞추기 퍼즐';
  document.getElementById('currentInfoBadge').textContent = `${State.grade}학년 · ${modeName}`;

  const actionBtn = document.getElementById('btnAction');
  if (State.mode === 'mario') {
    actionBtn.textContent = '⏫ 점프하기! (스페이스바 / ▲)';
    setupMarioRound();
  } else {
    actionBtn.textContent = '⬇️ 바로 내리기! (스페이스바 / ▼)';
    setupTetrisBoard();
  }
}

function updateHudText() {
  document.getElementById('scoreText').textContent = State.score;
  document.getElementById('comboText').textContent = State.combo;
}

/* ---------------- 마리오 모드 세팅 ---------------- */
function setupMarioRound() {
  State.question = createMathQuestion(State.grade);
  State.feedbackBubble = null;

  const opts = State.question.options;
  const startX = 135;
  const gap = 210;

  State.blocks = opts.map((opt, i) => ({
    x: startX + i * gap,
    y: 280,
    w: 115,
    h: 78,
    val: opt,
    bounce: 0,
    status: 'normal' // 'normal' | 'correct' | 'wrong'
  }));
}

/* ---------------- 테트리스 모드 세팅 ---------------- */
function setupTetrisBoard() {
  State.feedbackBubble = null;
  const cols = State.tetris.cols;
  State.tetris.bottomAnswers = [];

  // 5개 열에 서로 다른 수학 문제의 정답 5개를 배치
  const usedAnswers = new Set();
  for (let c = 0; c < cols; c++) {
    let q = createMathQuestion(State.grade);
    let guard = 0;
    while (usedAnswers.has(q.answer) && guard < 15) {
      q = createMathQuestion(State.grade);
      guard++;
    }
    usedAnswers.add(q.answer);
    State.tetris.bottomAnswers.push({
      val: q.answer,
      qObj: q,
      flash: 0
    });
  }
  spawnTetrisFallingBlock();
}

function spawnTetrisFallingBlock() {
  // 바닥에 있는 5개 정답 중 하나를 타겟으로 선택해 그 문제를 위에서 떨어뜨림
  const targetCol = rand(0, State.tetris.cols - 1);
  const targetSlot = State.tetris.bottomAnswers[targetCol];
  State.question = targetSlot.qObj;

  State.tetris.falling = {
    col: 2, // 가운데(3번째) 열에서 시작
    y: 155,
    speed: 1.45,
    qObj: targetSlot.qObj
  };
  State.tetris.fastDrop = false;
}

/* ---------------- 액션 입력 처리 ---------------- */
function onMoveInput(dir) {
  if (!State.playing) return;
  if (State.mode === 'tetris' && State.tetris.falling) {
    const nextCol = State.tetris.falling.col + dir;
    if (nextCol >= 0 && nextCol < State.tetris.cols) {
      State.tetris.falling.col = nextCol;
      Sound.move();
    }
  }
}

function onActionInput() {
  if (!State.playing) return;
  if (State.mode === 'mario') {
    if (State.player.onGround) {
      State.player.vy = -16.5;
      State.player.onGround = false;
      Sound.jump();
    }
  } else if (State.mode === 'tetris') {
    State.tetris.fastDrop = true;
    Sound.move();
  }
}

/* ---------------- 매 프레임 물리 및 충돌 업데이트 ---------------- */
function updateGame() {
  if (!State.playing) return;

  // 구름 이동
  State.clouds.forEach(c => {
    c.x -= 0.35 * c.s;
    if (c.x < -120) c.x = canvas.width + 100;
  });

  // 파티클 업데이트
  State.particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.35;
    p.life--;
  });
  State.particles = State.particles.filter(p => p.life > 0);

  if (State.feedbackBubble) {
    State.feedbackBubble.timer--;
    if (State.feedbackBubble.timer <= 0) State.feedbackBubble = null;
  }

  if (State.mode === 'mario') {
    updateMarioMode();
  } else {
    updateTetrisMode();
  }
}

function updateMarioMode() {
  const p = State.player;
  if (State.keys.left) p.vx = -6.8;
  else if (State.keys.right) p.vx = 6.8;
  else p.vx *= 0.78;

  p.x += p.vx;
  p.vy += 0.75; // 중력
  p.y += p.vy;

  if (p.x < 30) p.x = 30;
  if (p.x > canvas.width - p.w - 30) p.x = canvas.width - p.w - 30;

  const groundY = 452;
  if (p.y >= groundY) {
    p.y = groundY;
    p.vy = 0;
    p.onGround = true;
  }

  // 벽돌 타격 판정
  State.blocks.forEach(b => {
    if (b.bounce < 0) b.bounce += 1.8;
    if (b.bounce > 0) b.bounce = 0;

    if (
      p.vy < 0 &&
      p.x + p.w * 0.78 > b.x &&
      p.x + p.w * 0.22 < b.x + b.w &&
      p.y <= b.y + b.h &&
      p.y >= b.y + b.h - 28
    ) {
      p.vy = 4.5;
      b.bounce = -16;
      checkMarioBlockHit(b);
    }
  });

  // 귀여운 슬라임 이동 및 점프 밟기
  const s = State.slime;
  s.x += s.vx;
  if (s.x < 70 || s.x > canvas.width - 120) s.vx *= -1;

  if (
    p.vy > 0 &&
    p.x + p.w * 0.8 > s.x &&
    p.x + p.w * 0.2 < s.x + s.w &&
    p.y + p.h >= s.y &&
    p.y + p.h <= s.y + 30
  ) {
    p.vy = -14;
    Sound.jump();
    State.score += 5;
    updateHudText();
    spawnBurst(s.x + s.w / 2, s.y, '#38bdf8', 14);
    State.feedbackBubble = { text: '💧 슬라임 점프 보너스! +5점', color: '#0284c7', timer: 70 };
  }
}

function checkMarioBlockHit(block) {
  if (block.status === 'correct') return; // 이미 정답 처리 중이면 무시

  if (block.val === State.question.answer) {
    block.status = 'correct';
    Sound.correct();
    Sound.speak(State.question.speech);
    State.score += 20;
    State.combo++;
    updateHudText();
    spawnBurst(block.x + block.w / 2, block.y + 30, '#facc15', 35);
    State.feedbackBubble = {
      text: `🎉 정답입니다! (${State.question.answer}) +20점!`,
      color: '#16a34a',
      timer: 90
    };
    setTimeout(() => {
      if (State.playing && State.mode === 'mario') setupMarioRound();
    }, 800);
  } else {
    block.status = 'wrong';
    Sound.wrong();
    State.combo = 0;
    updateHudText();

    const chosenNum = parseFloat(block.val);
    const ansNum = State.question.numAnswer;
    const compareHint = chosenNum < ansNum
      ? `💡 ${block.val}보다 더 큰 수를 쳐보세요!`
      : `💡 ${block.val}보다 더 작은 수를 쳐보세요!`;

    State.feedbackBubble = {
      text: compareHint,
      color: '#e11d48',
      timer: 140
    };
  }
}

function updateTetrisMode() {
  const f = State.tetris.falling;
  if (!f) return;

  const dropSpeed = State.tetris.fastDrop ? 16 : f.speed;
  f.y += dropSpeed;

  const targetY = 415; // 바닥 정답 블록 바로 위 높이
  if (f.y >= targetY) {
    const landedSlot = State.tetris.bottomAnswers[f.col];
    if (landedSlot.val === f.qObj.answer) {
      // 정답 매칭 폭발!
      Sound.correct();
      Sound.speak(f.qObj.speech);
      State.score += 20;
      State.combo++;
      updateHudText();

      const colCenterX = 150 + f.col * 145 + 62;
      spawnBurst(colCenterX, 450, '#facc15', 38);
      State.feedbackBubble = {
        text: `💥 합체 성공! ${f.qObj.shortQ} = ${landedSlot.val}! (+20점)`,
        color: '#16a34a',
        timer: 90
      };

      // 해당 열에 새로운 문제/정답 블록 리필
      let newQ = createMathQuestion(State.grade);
      const existing = new Set(State.tetris.bottomAnswers.map(s => s.val));
      let guard = 0;
      while (existing.has(newQ.answer) && guard < 15) {
        newQ = createMathQuestion(State.grade);
        guard++;
      }
      State.tetris.bottomAnswers[f.col] = {
        val: newQ.answer,
        qObj: newQ,
        flash: 20
      };

      spawnTetrisFallingBlock();
    } else {
      // 다른 숫자 위에 떨어뜨렸을 때: 친절한 힌트와 함께 다시 위에서 내려옴
      Sound.wrong();
      State.combo = 0;
      updateHudText();
      State.feedbackBubble = {
        text: `💡 아까워요! [${f.qObj.shortQ}]의 정답 블록을 찾아 다시 내려보세요!`,
        color: '#e11d48',
        timer: 140
      };
      f.y = 155;
      State.tetris.fastDrop = false;
    }
  }
}

function spawnBurst(x, y, color, count = 25) {
  for (let i = 0; i < count; i++) {
    State.particles.push({
      x,
      y,
      vx: (Math.random() - 0.5) * 12,
      vy: (Math.random() - 0.8) * 10,
      color,
      r: rand(5, 9),
      life: rand(25, 45)
    });
  }
}

/**
 * ============================================================================
 * 4. 화면 렌더링 (크고 선명한 고가독성 UI)
 * ============================================================================
 */
function drawGame() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. 밝고 화사한 하늘 배경
  const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
  sky.addColorStop(0, '#38bdf8');
  sky.addColorStop(0.75, '#bae6fd');
  sky.addColorStop(1, '#e0f2fe');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 구름 그리기
  ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
  State.clouds.forEach(c => {
    ctx.beginPath();
    ctx.arc(c.x, c.y, 26 * c.s, 0, Math.PI * 2);
    ctx.arc(c.x + 22 * c.s, c.y - 10 * c.s, 32 * c.s, 0, Math.PI * 2);
    ctx.arc(c.x + 48 * c.s, c.y, 24 * c.s, 0, Math.PI * 2);
    ctx.fill();
  });

  // 뒷배경 동산
  ctx.fillStyle = '#86efac';
  ctx.beginPath();
  ctx.arc(220, 540, 220, Math.PI, 0);
  ctx.arc(760, 540, 260, Math.PI, 0);
  ctx.fill();

  // 2. 상단 고대비 문제 보드 (누구나 한눈에 보이는 화이트 카드)
  drawTopQuestionCard();

  // 3. 모드별 메인 게임 월드 렌더링
  if (State.mode === 'mario') {
    drawMarioWorld();
  } else {
    drawTetrisWorld();
  }

  // 4. 피드백 토스트 배너 (정답/힌트 알림)
  if (State.feedbackBubble) {
    drawFeedbackBanner();
  }

  // 5. 폭죽 파티클
  State.particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawTopQuestionCard() {
  if (!State.question) return;

  ctx.save();
  // 그림자 있는 밝은 화이트 보드
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#0284c7';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.roundRect(50, 14, 900, 112, 22);
  ctx.fill();
  ctx.stroke();

  // 좌측 안내 태그
  ctx.fillStyle = '#0284c7';
  ctx.beginPath();
  ctx.roundRect(68, 30, 120, 36, 12);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = '20px Jua';
  ctx.textAlign = 'center';
  ctx.fillText('오늘의 문제', 128, 55);

  // 문제 본문 (초대형 고대비 폰트)
  ctx.fillStyle = '#0f172a';
  ctx.font = '40px Jua';
  ctx.textAlign = 'left';
  ctx.fillText(State.question.question, 210, 62);

  // 하단 친절한 학습 힌트 텍스트
  ctx.fillStyle = '#475569';
  ctx.font = '19px Jua';
  ctx.fillText(`💡 힌트: ${State.question.hintText}`, 72, 104);

  // 우측 시각적 수학 교구 미니 그림 (10칸 구슬 / 분수 피자)
  const vType = State.question.visualType;
  const vData = State.question.visualData;
  if (vType === 'tenframe') {
    const sx = 680, sy = 30;
    for (let i = 0; i < 10; i++) {
      const cx = sx + (i % 5) * 36;
      const cy = sy + Math.floor(i / 5) * 36;
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 2;
      ctx.strokeRect(cx, cy, 32, 32);
      if (i < vData.filled) {
        ctx.fillStyle = '#f43f5e';
        ctx.beginPath();
        ctx.arc(cx + 16, cy + 16, 11, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  } else if (vType === 'pizza') {
    const cx = 875, cy = 70, r = 36;
    const denom = vData.denom;
    for (let i = 0; i < denom; i++) {
      const a1 = (i / denom) * Math.PI * 2 - Math.PI / 2;
      const a2 = ((i + 1) / denom) * Math.PI * 2 - Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, a1, a2);
      ctx.closePath();
      if (i < vData.n1) ctx.fillStyle = '#f59e0b';
      else if (i < vData.n1 + vData.n2) ctx.fillStyle = '#22c55e';
      else ctx.fillStyle = '#e2e8f0';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  ctx.restore();
}

function drawMarioWorld() {
  // 잔디 바닥 타일
  ctx.fillStyle = '#16a34a';
  ctx.fillRect(0, 514, canvas.width, 16);
  ctx.fillStyle = '#854d0e';
  ctx.fillRect(0, 530, canvas.width, 70);

  // 4개의 정답 보기 벽돌
  State.blocks.forEach(b => {
    const by = b.y + b.bounce;
    ctx.save();

    if (b.status === 'correct') {
      ctx.fillStyle = '#22c55e';
      ctx.strokeStyle = '#14532d';
    } else if (b.status === 'wrong') {
      ctx.fillStyle = '#cbd5e1';
      ctx.strokeStyle = '#64748b';
    } else {
      ctx.fillStyle = '#facc15';
      ctx.strokeStyle = '#b45309';
    }

    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.roundRect(b.x, by, b.w, b.h, 16);
    ctx.fill();
    ctx.stroke();

    // 벽돌 상단 하이라이트
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath();
    ctx.roundRect(b.x + 8, by + 6, b.w - 16, 10, 5);
    ctx.fill();

    // 벽돌 안 숫자
    ctx.fillStyle = b.status === 'correct' ? '#ffffff' : '#0f172a';
    ctx.font = '36px Jua';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.val, b.x + b.w / 2, by + b.h / 2 + 3);
    ctx.restore();
  });

  // 슬라임 친구
  const s = State.slime;
  ctx.save();
  ctx.font = '40px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('💧', s.x + s.w / 2, s.y + 34);
  ctx.restore();

  // 플레이어 캐릭터
  const p = State.player;
  ctx.save();
  // 발밑 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath();
  ctx.ellipse(p.x + p.w / 2, 514, 24, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.font = '56px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(State.charEmoji, p.x + p.w / 2, p.y + p.h / 2);
  ctx.restore();
}

function drawTetrisWorld() {
  // 잔디 바닥
  ctx.fillStyle = '#16a34a';
  ctx.fillRect(0, 540, canvas.width, 60);

  const cols = State.tetris.cols;
  const startX = 150;
  const colW = 140;
  const gap = 5;

  // 5개 열 가이드 레일 그리기
  for (let c = 0; c < cols; c++) {
    const x = startX + c * (colW + gap);
    ctx.fillStyle = (State.tetris.falling && State.tetris.falling.col === c)
      ? 'rgba(250, 204, 21, 0.28)'
      : 'rgba(255, 255, 255, 0.35)';
    ctx.strokeStyle = 'rgba(2, 132, 199, 0.3)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(x, 145, colW, 385, 16);
    ctx.fill();
    ctx.stroke();

    // 바닥에 놓인 정답 블록 그리기
    const slot = State.tetris.bottomAnswers[c];
    const by = 455;
    ctx.fillStyle = '#0284c7';
    ctx.strokeStyle = '#0369a1';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.roundRect(x + 8, by, colW - 16, 68, 16);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = '34px Jua';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(slot.val, x + colW / 2, by + 36);
  }

  // 위에서 내려오는 문제 블록 그리기
  const f = State.tetris.falling;
  if (f) {
    const fx = startX + f.col * (colW + gap) + 8;
    const fy = f.y;

    ctx.save();
    ctx.fillStyle = '#facc15';
    ctx.strokeStyle = '#b45309';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.roundRect(fx, fy, colW - 16, 68, 16);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#0f172a';
    ctx.font = '26px Jua';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(f.qObj.shortQ, fx + (colW - 16) / 2, fy + 36);

    // 블록 위에 탄 내 캐릭터
    ctx.font = '38px sans-serif';
    ctx.fillText(State.charEmoji, fx + (colW - 16) / 2, fy - 18);
    ctx.restore();
  }
}

function drawFeedbackBanner() {
  const fb = State.feedbackBubble;
  if (!fb) return;

  ctx.save();
  ctx.fillStyle = fb.color;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.roundRect(220, 138, 560, 48, 24);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.font = '23px Jua';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(fb.text, 500, 163);
  ctx.restore();
}

/**
 * ============================================================================
 * 5. UI 이벤트 연결 (학년·모드·캐릭터 선택 및 키보드/터치 조작)
 * ============================================================================
 */
// 학년 카드 선택
document.querySelectorAll('#gradeSelector .grade-card').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('#gradeSelector .grade-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    State.grade = parseInt(card.dataset.grade, 10);
    Sound.move();
  });
});

// 게임 모드 카드 선택
document.querySelectorAll('#modeSelector .mode-card').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('#modeSelector .mode-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    State.mode = card.dataset.mode;
    Sound.move();
  });
});

// 캐릭터 선택
document.querySelectorAll('#charSelector .char-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#charSelector .char-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    State.charEmoji = btn.dataset.char;
    Sound.move();
  });
});

// 게임 시작 버튼
document.getElementById('startGameBtn').addEventListener('click', () => {
  Sound.init();
  Sound.correct();
  document.getElementById('startScreen').classList.add('hidden');
  startGame();
});

// 홈(메뉴)으로 돌아가기 버튼
document.getElementById('backHomeBtn').addEventListener('click', () => {
  State.playing = false;
  Sound.move();
  document.getElementById('startScreen').classList.remove('hidden');
});

// 소리 켜기/끄기 버튼
document.getElementById('soundToggleBtn').addEventListener('click', e => {
  Sound.enabled = !Sound.enabled;
  e.currentTarget.textContent = Sound.enabled ? '🔊 소리 켜짐' : '🔇 소리 꺼짐';
});

// 키보드 조작
window.addEventListener('keydown', e => {
  if (!State.playing) return;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) {
    e.preventDefault();
  }
  if (e.code === 'ArrowLeft') {
    State.keys.left = true;
    onMoveInput(-1);
  }
  if (e.code === 'ArrowRight') {
    State.keys.right = true;
    onMoveInput(1);
  }
  if (e.code === 'ArrowUp' || e.code === 'Space' || e.code === 'ArrowDown') {
    onActionInput();
  }
});

window.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft') State.keys.left = false;
  if (e.code === 'ArrowRight') State.keys.right = false;
});

// 하단 터치/마우스 버튼 조작
function bindPad(id, downFn, upFn) {
  const el = document.getElementById(id);
  const onDown = e => { e.preventDefault(); downFn(); };
  const onUp = e => { e.preventDefault(); if (upFn) upFn(); };
  el.addEventListener('mousedown', onDown);
  el.addEventListener('mouseup', onUp);
  el.addEventListener('mouseleave', onUp);
  el.addEventListener('touchstart', onDown, { passive: false });
  el.addEventListener('touchend', onUp, { passive: false });
}

bindPad(
  'btnLeft',
  () => { State.keys.left = true; onMoveInput(-1); },
  () => { State.keys.left = false; }
);

bindPad(
  'btnRight',
  () => { State.keys.right = true; onMoveInput(1); },
  () => { State.keys.right = false; }
);

bindPad('btnAction', () => onActionInput());

// 메인 루프 시작
function loop() {
  updateGame();
  drawGame();
  requestAnimationFrame(loop);
}
loop();
</script>
