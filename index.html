<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>타보까 롤러 클럽 1주년 축하 방명록</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- SheetJS (엑셀 .xlsx 다운로드용) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- JSZip (이미지 일괄 다운로드용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- Firebase SDK (v9 compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @font-face {
            font-family: 'NexonLv2Gothic';
            src: url('NexonLv2Gothic.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            font-family: 'NexonLv2Gothic', sans-serif;
            background-color: #ffffff;
            color: #1f2937;
            -webkit-text-size-adjust: 100%;
        }
    </style>
</head>
<body class="bg-white text-gray-800 min-h-screen py-6 px-3.5 sm:py-10 sm:px-4">

    <!-- 초기 접속 로딩 화면 -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center space-y-3">
        <div class="w-10 h-10 border-4 border-gray-200 border-t-slate-600 rounded-full animate-spin"></div>
        <p class="text-base sm:text-sm font-bold text-gray-700">페이지에 접속 중입니다...</p>
    </div>

    <div class="max-w-xl mx-auto space-y-5 sm:space-y-6">
        
        <!-- 1. 상단 이미지 (111.jpg - 테두리 제거) 및 1주년 인사말 영역 -->
        <div class="space-y-4 text-center">
            <div class="overflow-hidden rounded-2xl">
                <img src="111.jpg" alt="타보까 1주년 메인 이미지" class="w-full h-auto object-cover block" onerror="this.src='https://via.placeholder.com/600x400/f3f4f6/9ca3af?text=111.jpg';">
            </div>

            <div class="px-1 pt-1 text-gray-800 leading-snug text-base sm:text-sm break-keep space-y-2">
                <p class="text-xl sm:text-2xl font-bold text-gray-900 pb-1">타보까 롤러클럽이 벌써 1주년!</p>
                <p>미끄러지듯 달려온 한 해, 여러분의 따뜻한 축하만큼은 정중히 사양하지 않겠습니다^^</p>
                <p>앞으로도 함께 미끄러지고, 함께 성장하는 타보까 롤러클럽이 되겠습니다!</p>
            </div>
        </div>

        <!-- 2. 서브 안내 멘트 영역 (222.jpg 캐릭터 이미지 + 2줄 문장 가로 배치) -->
        <div class="bg-gray-50 border border-gray-200 py-3.5 px-4 rounded-2xl shadow-xs flex items-center justify-center gap-3 sm:gap-4">
            <img src="222.jpg" alt="타보까 캐릭터" class="w-12 h-12 sm:w-14 sm:h-14 object-contain rounded-xl shrink-0" onerror="this.src='https://via.placeholder.com/80x80/e5e7eb/9ca3af?text=222.jpg';">
            <div class="text-left break-keep space-y-1 leading-snug">
                <p class="text-gray-800 font-semibold text-base sm:text-sm">사진과 함께 축하메세지를 작성해주세요!</p>
                <p class="text-gray-800 font-semibold text-base sm:text-sm">타보까 아이들이 정말 좋아할 겁니다!</p>
            </div>
        </div>

        <!-- 3. 입력 폼 영역 -->
        <div class="bg-white p-5 sm:p-7 rounded-2xl shadow-sm border border-gray-200 space-y-4">
            
            <!-- ① 소속 입력칸 -->
            <div>
                <label class="block text-base sm:text-sm font-bold text-gray-700 mb-1">소속</label>
                <input type="text" id="clubName" placeholder="클럽명 또는 지역을 입력해주세요 (예: 타보까)" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:bg-white focus:outline-none focus:border-slate-600 transition text-base sm:text-sm">
            </div>

            <!-- ② 이름 입력칸 -->
            <div>
                <label class="block text-base sm:text-sm font-bold text-gray-700 mb-1">이름</label>
                <input type="text" id="authorName" placeholder="이름 또는 닉네임을 입력해주세요" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:bg-white focus:outline-none focus:border-slate-600 transition text-base sm:text-sm">
            </div>

            <!-- ③ 축하 메세지 입력칸 -->
            <div>
                <label class="block text-base sm:text-sm font-bold text-gray-700 mb-1">축하메세지</label>
                <textarea id="message" rows="3" placeholder="따뜻한 축하 메시지를 남겨주세요!" class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 placeholder-gray-400 focus:bg-white focus:outline-none focus:border-slate-600 transition text-base sm:text-sm"></textarea>
            </div>

            <!-- ④ 이미지 첨부 영역 (세련된 회색 버튼 및 세로 사이즈 축소 적용) -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-base sm:text-sm font-bold text-gray-700">사진 첨부</label>
                </div>
                <input type="file" id="imageInput" accept="image/*" class="w-full text-base sm:text-sm text-gray-500 file:mr-3 file:py-2 file:px-3.5 file:rounded-xl file:border-0 file:text-base sm:file:text-sm file:font-semibold file:bg-slate-600 file:text-white hover:file:bg-slate-700 file:cursor-pointer cursor-pointer bg-gray-50 border border-gray-200 rounded-xl">
            </div>

            <!-- 미리보기 영역 -->
            <div id="previewContainer" class="hidden space-y-2 pt-1">
                <span class="block text-base sm:text-sm font-bold text-gray-500 text-center">이미지 카드 미리보기</span>
                <div class="relative rounded-xl overflow-hidden border border-gray-200 max-w-xs mx-auto shadow-xs">
                    <canvas id="previewCanvas" class="w-full h-auto block"></canvas>
                </div>
            </div>

            <!-- 등록하기 버튼 (세련된 회색 버튼 및 세로 사이즈 축소 적용) -->
            <div class="pt-1">
                <button onclick="submitCard()" id="submitBtn" class="w-full py-2.5 bg-slate-600 hover:bg-slate-700 text-white font-bold rounded-xl shadow-xs transition active:scale-[0.99] cursor-pointer text-base sm:text-sm">
                    축하메세지 등록하기
                </button>
            </div>
        </div>

        <!-- 4. 실시간 방명록 리스트 -->
        <div class="space-y-3.5 pt-2">
            <div class="flex items-center justify-between border-b border-gray-200 pb-2.5 px-1">
                <h3 class="text-base sm:text-sm font-bold text-gray-900">축하 메시지 모음</h3>
                <span class="text-base sm:text-sm font-semibold text-gray-500">총 <strong id="totalCount" class="text-gray-900">0</strong>건</span>
            </div>
            <div id="cardList" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                <!-- 백그라운드 카드 로딩 중 표시 -->
                <div class="col-span-1 sm:col-span-2 flex flex-col items-center justify-center py-10 space-y-2.5 text-gray-400">
                    <div class="w-7 h-7 border-3 border-gray-200 border-t-slate-600 rounded-full animate-spin"></div>
                    <p class="text-base sm:text-sm">축하 메시지 카드를 불러오는 중입니다...</p>
                </div>
            </div>
        </div>

        <!-- 5. 관리자 다운로드 영역 -->
        <div class="pt-6 border-t border-gray-100 text-center">
            <button onclick="toggleAdmin()" class="text-base sm:text-sm text-gray-400 hover:text-gray-600 underline cursor-pointer">관리자 모드</button>
            <div id="adminPanel" class="hidden mt-3 p-4 bg-gray-50 border border-gray-200 rounded-2xl space-y-3">
                <p class="text-base sm:text-sm font-bold text-gray-700">관리자 전용 다운로드 및 관리 (개별 카드 삭제 활성화됨)</p>
                <div class="flex flex-wrap gap-2 justify-center">
                    <button onclick="downloadExcel()" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-base sm:text-sm font-semibold rounded-lg shadow-xs transition cursor-pointer">엑셀(.xlsx) 다운로드</button>
                    <button onclick="downloadAllImages()" class="px-3.5 py-2 bg-gray-800 hover:bg-gray-700 text-white text-base sm:text-sm font-semibold rounded-lg shadow-xs transition cursor-pointer">합성 이미지 일괄 다운로드(ZIP)</button>
                    <button onclick="downloadAllOriginals()" class="px-3.5 py-2 bg-white hover:bg-gray-100 text-gray-700 border border-gray-300 text-base sm:text-sm font-semibold rounded-lg shadow-xs transition cursor-pointer">원본 사진 일괄 다운로드(ZIP)</button>
                </div>
            </div>
        </div>

    </div>

    <!-- 스크립트 로직 -->
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCvbDYGN9c3u1EDljYG0f0PX-xcPHDs_Jg",
          authDomain: "fireexpo-5fee2.firebaseapp.com",
          databaseURL: "https://fireexpo-5fee2-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "fireexpo-5fee2",
          storageBucket: "fireexpo-5fee2.firebasestorage.app",
          messagingSenderId: "1054718901785",
          appId: "1:1054718901785:web:a13a0a70d3a225870f3488"
        };

        // Firebase 초기화
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentImageBase64 = "";
        let currentOriginalBase64 = "";
        let allCardsData = [];
        let isAdminMode = false;

        const imageInput = document.getElementById('imageInput');
        const previewContainer = document.getElementById('previewContainer');

        // 페이지 기본 요소 준비 및 이미지 카드 로딩 시작 시 즉시 화면 진입
        window.addEventListener('DOMContentLoaded', function() {
            const loader = document.getElementById('loadingOverlay');
            if (loader) {
                loader.classList.add('hidden');
            }
        });

        // 이미지 선택 시 처리
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // 원본 보관용 이미지 생성 (선명도 향상을 위해 최대 폭 1600px 및 품질 0.9 적용)
                    const origCanvas = document.createElement('canvas');
                    const maxOrigSize = 1600;
                    let ow = img.width;
                    let oh = img.height;
                    if (ow > maxOrigSize || oh > maxOrigSize) {
                        if (ow > oh) {
                            oh = Math.round((oh * maxOrigSize) / ow);
                            ow = maxOrigSize;
                        } else {
                            ow = Math.round((ow * maxOrigSize) / oh);
                            oh = maxOrigSize;
                        }
                    }
                    origCanvas.width = ow;
                    origCanvas.height = oh;
                    origCanvas.getContext('2d').drawImage(img, 0, 0, ow, oh);
                    currentOriginalBase64 = origCanvas.toDataURL('image/jpeg', 0.9);

                    previewContainer.classList.remove('hidden');
                    updatePreviewCanvas(img);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // 문장이 끝날 때('습니다, 했어요, 드려요, 합니다' 등) 다음 문장을 가로 한 줄 띄워서 줄바꿈 처리하는 함수
        function formatMessageSentences(text) {
            const endingRegex = /(습니다|합니다|입니다|됩니다|봅니다|갑니다|옵니다|줍니다|랍니다|했어요|드려요|해요|예요|이에요|네요|어요|아요|여요|게요|봐요|가요|와요|줘요|군요|바랍니다|기원합니다|되세요|하세요|화이팅|파이팅)((?:[.!?~^ㅎㅋ]+|\s+[.!?~^ㅎㅋ]+)*)(?:\r?\n|\s+)(?=\S)/g;
            let formatted = text.replace(endingRegex, '$1$2\n\n');
            formatted = formatted.replace(/\n{3,}/g, '\n\n');
            return formatted;
        }

        // 캔버스에 이미지 카드 합성 그리기 (1080x1080 고해상도 적용 & 줄간격 절반 축소)
        function updatePreviewCanvas(img) {
            const canvas = document.getElementById('previewCanvas');
            const ctx = canvas.getContext('2d');

            // 캔버스 기본 규격 설정 (선명한 정사각형 비율 1080x1080)
            const size = 1080;
            canvas.width = size;
            canvas.height = size;

            // 1. 이미지 중앙 크롭(Square) 맞춤
            let w = img.width;
            let h = img.height;
            let sourceX = 0, sourceY = 0, sourceW = w, sourceH = h;

            if (w > h) {
                sourceW = h;
                sourceX = (w - h) / 2;
            } else {
                sourceH = w;
                sourceY = (h - w) / 2;
            }
            ctx.drawImage(img, sourceX, sourceY, sourceW, sourceH, 0, 0, size, size);

            const club = document.getElementById('clubName').value || "소속";
            const author = document.getElementById('authorName').value || "이름";
            const rawMsg = document.getElementById('message').value || "축하 메시지입니다!";
            const msg = formatMessageSentences(rawMsg);

            // 2. 왼쪽 상부 배치 및 가로 길이 사진 절반 제한 (1080 해상도 비례 적용)
            ctx.save();
            ctx.textAlign = 'left';
            const startX = 40;
            const startY = 115;
            const halfMaxWidth = (size / 2) - startX; // 사진 절반(540px)까지만 텍스트 배치

            // [소속] 이름: 볼드 처리 + 노란색 글씨 + 얇은 검정색 테두리
            ctx.font = 'bold 38px NexonLv2Gothic, sans-serif';
            ctx.fillStyle = '#ffff00';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 4;
            ctx.lineJoin = 'round';
            const nextY = wrapText(ctx, `[${club}] ${author}`, startX, startY, halfMaxWidth, 44, true);

            // 축하메세지: 볼드 처리 + 순수 흰색 글씨 + 얇은 검정색 테두리 (줄간격 여백을 절반으로 촘촘하게 축소)
            ctx.font = 'bold 32px NexonLv2Gothic, sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3.5;
            ctx.lineJoin = 'round';
            wrapText(ctx, msg, startX, nextY + 8, halfMaxWidth, 36, true);

            ctx.restore();

            // 최종 합성본 Base64 저장 (선명도 및 용량 균형 최적화 0.88)
            currentImageBase64 = canvas.toDataURL('image/jpeg', 0.88);
        }

        // 줄바꿈 헬퍼 함수 (모든 가로줄의 왼쪽 시작점 동일 정렬 & 줄간격 절반 축소 반영)
        function wrapText(ctx, text, x, y, maxWidth, lineHeight, isStroked) {
            let chars = text.replace(/\r/g, '').split('');
            let line = '';

            for (let n = 0; n < chars.length; n++) {
                if (chars[n] === '\n') {
                    if (line.length > 0) {
                        if (isStroked) ctx.strokeText(line, x, y);
                        ctx.fillText(line, x, y);
                        line = '';
                        y += lineHeight;
                    } else {
                        y += (lineHeight * 0.5);
                    }
                    continue;
                }

                // 각 가로줄의 시작 부분에 공백이 오면 무조건 건너뛰어 왼쪽 끝 정렬을 동일하게 유지
                if (line.length === 0 && chars[n].trim() === '') {
                    continue;
                }

                let testLine = line + chars[n];
                let metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && line.length > 0) {
                    if (isStroked) ctx.strokeText(line, x, y);
                    ctx.fillText(line, x, y);
                    line = chars[n].trim() === '' ? '' : chars[n];
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            if (line.length > 0) {
                if (isStroked) ctx.strokeText(line, x, y);
                ctx.fillText(line, x, y);
                y += lineHeight;
            }
            return y;
        }

        // 입력 폼 변경 시 실시간 미리보기 갱신
        document.getElementById('clubName').addEventListener('input', refreshCanvas);
        document.getElementById('authorName').addEventListener('input', refreshCanvas);
        document.getElementById('message').addEventListener('input', refreshCanvas);

        function refreshCanvas() {
            const file = imageInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() { updatePreviewCanvas(img); };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // 메시지 등록 함수 (원본 사진은 별도 경로에 분리 저장하여 방문자 다운로드 용량 절감)
        function submitCard() {
            const club = document.getElementById('clubName').value.trim();
            const author = document.getElementById('authorName').value.trim();
            const message = document.getElementById('message').value.trim();

            if (!club || !author || !message) {
                alert('소속, 이름, 축하 메시지를 모두 입력해주세요!');
                return;
            }
            if (!currentImageBase64) {
                alert('어떤 사진이든 첨부해주세요!');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = '등록 중입니다...';

            const newPostRef = db.ref('anniversary_cards').push();
            const postKey = newPostRef.key;

            // 1) 화면 리스트용 데이터 저장 (합성 이미지 카드만 포함)
            newPostRef.set({
                club: club,
                author: author,
                message: message,
                image: currentImageBase64,
                timestamp: Date.now()
            }, function(error) {
                if (error) {
                    alert('등록 중 오류가 발생했습니다: ' + error.message);
                    submitBtn.disabled = false;
                    submitBtn.innerText = '축하메세지 등록하기';
                } else {
                    // 2) 관리자 백업용 원본 이미지는 별도 경로(anniversary_originals)에 저장
                    if (currentOriginalBase64) {
                        db.ref('anniversary_originals/' + postKey).set({
                            originalImage: currentOriginalBase64
                        });
                    }

                    alert('축하 메시지가 성공적으로 등록되었습니다!');
                    // 입력창 초기화
                    document.getElementById('clubName').value = '';
                    document.getElementById('authorName').value = '';
                    document.getElementById('message').value = '';
                    imageInput.value = '';
                    previewContainer.classList.add('hidden');
                    currentImageBase64 = '';
                    currentOriginalBase64 = '';
                    submitBtn.disabled = false;
                    submitBtn.innerText = '축하메세지 등록하기';
                }
            });
        }

        // 실시간 데이터 불러오기 및 리스트 렌더링
        db.ref('anniversary_cards').on('value', function(snapshot) {
            allCardsData = [];

            let count = 0;
            snapshot.forEach(function(childSnapshot) {
                const data = childSnapshot.val();
                data.id = childSnapshot.key;
                allCardsData.push(data);
                count++;
            });

            // 최신순 정렬
            allCardsData.sort((a, b) => b.timestamp - a.timestamp);
            document.getElementById('totalCount').innerText = count;

            renderCardList();
        });

        // 카드 리스트 화면 출력 함수
        function renderCardList() {
            const cardList = document.getElementById('cardList');
            cardList.innerHTML = '';

            if (allCardsData.length === 0) {
                cardList.innerHTML = '<p class="col-span-2 text-center text-gray-400 py-10 text-base sm:text-sm">아직 등록된 축하 메시지가 없습니다. 첫 주인공이 되어주세요!</p>';
                return;
            }

            const fragment = document.createDocumentFragment();

            allCardsData.forEach((item) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-xs flex flex-col';
                cardDiv.innerHTML = `
                    <div class="relative">
                        <img src="${item.image}" alt="축하카드" decoding="async" class="w-full h-auto object-cover">
                        <button onclick="deleteCard('${item.id}')" class="admin-delete-btn ${isAdminMode ? '' : 'hidden'} absolute top-2.5 right-2.5 px-2.5 py-1 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-lg shadow-md transition cursor-pointer">
                            삭제
                        </button>
                    </div>
                    <div class="p-3.5 flex-1 flex flex-col justify-between space-y-1.5">
                        <div>
                            <span class="text-base sm:text-sm font-bold text-gray-900">[${escapeHtml(item.club)}] ${escapeHtml(item.author)}</span>
                            <p class="text-base sm:text-sm text-gray-700 mt-1 leading-snug break-keep">${escapeHtml(item.message)}</p>
                        </div>
                        <span class="text-xs text-gray-400 text-right">${new Date(item.timestamp).toLocaleString()}</span>
                    </div>
                `;
                fragment.appendChild(cardDiv);
            });

            cardList.appendChild(fragment);
        }

        // 관리자용 개별 이미지 카드 삭제 함수
        function deleteCard(cardId) {
            if (confirm('이 축하 메시지 카드를 정말 삭제하시겠습니까?')) {
                db.ref('anniversary_cards/' + cardId).remove()
                    .then(function() {
                        db.ref('anniversary_originals/' + cardId).remove();
                        alert('삭제되었습니다.');
                    })
                    .catch(function(error) {
                        alert('삭제 중 오류가 발생했습니다: ' + error.message);
                    });
            }
        }

        // HTML Escape 헬퍼
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // 관리자 모드 토글
        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            if (panel.classList.contains('hidden')) {
                const pw = prompt('관리자 비밀번호를 입력하세요:');
                if (pw === '89363341') {
                    isAdminMode = true;
                    panel.classList.remove('hidden');
                    renderCardList();
                } else if (pw !== null) {
                    alert('비밀번호가 틀렸습니다.');
                }
            } else {
                isAdminMode = false;
                panel.classList.add('hidden');
                renderCardList();
            }
        }

        // 1. 엑셀(.xlsx) 다운로드
        function downloadExcel() {
            if (allCardsData.length === 0) {
                alert('다운로드할 데이터가 없습니다.');
                return;
            }
            const excelData = allCardsData.map((item, idx) => ({
                "번호": idx + 1,
                "작성시간": new Date(item.timestamp).toLocaleString(),
                "소속": item.club,
                "이름": item.author,
                "축하메세지": item.message
            }));

            const worksheet = XLSX.utils.json_to_sheet(excelData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "타보까1주년방명록");
            XLSX.writeFile(workbook, "Tabogga_1st_Anniversary_List.xlsx");
        }

        // 2. 완성된 이미지 카드 일괄 다운로드 (ZIP)
        function downloadAllImages() {
            if (allCardsData.length === 0) {
                alert('다운로드할 이미지가 없습니다.');
                return;
            }
            const zip = new JSZip();
            const imgFolder = zip.folder("Tabogga_Anniversary_Cards");

            allCardsData.forEach((item, idx) => {
                const paddedNum = String(idx + 1).padStart(3, '0');
                const cleanClub = item.club.replace(/[/\\?%*:|"<>]/g, '');
                const cleanAuthor = item.author.replace(/[/\\?%*:|"<>]/g, '');
                const fileName = `${paddedNum}_${cleanClub}_${cleanAuthor}.jpg`;
                
                const base64Data = item.image.split(';base64,')[1];
                imgFolder.file(fileName, base64Data, { base64: true });
            });

            zip.generateAsync({ type: "blob" }).then(function(content) {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = "Tabogga_Anniversary_Cards.zip";
                link.click();
            });
        }

        // 3. 원본 사진 일괄 다운로드 (ZIP - 별도 저장된 원본 데이터 불러오기)
        function downloadAllOriginals() {
            if (allCardsData.length === 0) {
                alert('다운로드할 원본 사진이 없습니다.');
                return;
            }

            db.ref('anniversary_originals').once('value').then(function(snapshot) {
                const originalsMap = snapshot.val() || {};
                const zip = new JSZip();
                const imgFolder = zip.folder("Tabogga_Original_Photos");
                let addedCount = 0;

                allCardsData.forEach((item, idx) => {
                    const origData = (originalsMap[item.id] && originalsMap[item.id].originalImage) || item.originalImage;
                    if (!origData) return;

                    const paddedNum = String(idx + 1).padStart(3, '0');
                    const cleanClub = item.club.replace(/[/\\?%*:|"<>]/g, '');
                    const cleanAuthor = item.author.replace(/[/\\?%*:|"<>]/g, '');
                    const fileName = `${paddedNum}_${cleanClub}_${cleanAuthor}_original.jpg`;
                    
                    const base64Data = origData.split(';base64,')[1];
                    if (base64Data) {
                        imgFolder.file(fileName, base64Data, { base64: true });
                        addedCount++;
                    }
                });

                if (addedCount === 0) {
                    alert('저장된 원본 사진이 없습니다.');
                    return;
                }

                zip.generateAsync({ type: "blob" }).then(function(content) {
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(content);
                    link.download = "Tabogga_Original_Photos.zip";
                    link.click();
                });
            });
        }
    </script>
</body>
</html>
