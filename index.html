<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0d24">
<meta name="color-scheme" content="dark">
<title>매스 블록 어드벤처</title>
<style>
:root{--bg:#0a0d24;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.1);--sub:#9aa0c8;--ac:#7c5cff;--ac2:#4f8cff;--mint:#2de2b0;--gold:#ffcf5a;--pb:84px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:#f4f5ff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;font-weight:700}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
svg{display:block}
.hidden{display:none!important}
#bg{position:fixed;inset:0;background:radial-gradient(620px 440px at 90% -8%,rgba(124,92,255,.38),transparent 70%),radial-gradient(520px 420px at -10% 108%,rgba(45,226,176,.16),transparent 70%),var(--bg)}
.screen{position:fixed;inset:0;overflow-y:auto;display:flex;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.col{width:100%;max-width:460px;display:flex;flex-direction:column;min-height:100%}
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px;gap:10px}
.coin{display:flex;align-items:center;gap:8px;height:40px;padding:0 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:16px;font-weight:800}
.icon{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.icon svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.brand{margin:clamp(6px,2.6vh,26px) 0 clamp(12px,3vh,28px)}
.mark{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 10px 26px rgba(99,102,255,.45);margin-bottom:14px}
h1{margin:0;font-size:clamp(30px,9.4vw,42px);line-height:1.12;letter-spacing:-1.2px;font-weight:900}
h1 em{font-style:normal;background:linear-gradient(90deg,#b9a9ff,#6fb4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:10px 0 0;color:var(--sub);font-size:15px;font-weight:600}
.lbl{font-size:13px;color:var(--sub);margin:0 2px 10px;font-weight:700;letter-spacing:.03em}
.sec{margin-bottom:clamp(14px,2.6vh,24px)}
.seg6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.gb{aspect-ratio:1/1.1;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:22px;font-weight:800;color:var(--sub);transition:.15s}
.gb.on{color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;box-shadow:0 8px 22px rgba(99,102,255,.45)}
#gdesc{margin:12px 2px 0;font-size:14px;color:var(--sub);font-weight:600;min-height:20px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc{text-align:left;padding:15px 14px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);display:flex;flex-direction:column;gap:5px;transition:.15s}
.mc .em{font-size:30px;line-height:1;margin-bottom:4px}
.mc b{font-size:18px;font-weight:800}
.mc span{font-size:13px;color:var(--sub);font-weight:600;line-height:1.35}
.mc.on{border-color:var(--ac);background:rgba(124,92,255,.17)}
.grow{flex:1;min-height:10px}
.cta{display:block;width:100%;height:64px;border-radius:20px;font-size:20px;font-weight:900;color:#fff;background:linear-gradient(135deg,#8b6cff,#4f8cff);box-shadow:0 12px 30px rgba(88,101,255,.45);letter-spacing:.02em;transition:transform .12s}
.cta:active{transform:scale(.97)}
.ghost{display:block;width:100%;height:54px;border-radius:17px;font-size:16px;font-weight:700;background:var(--card);border:1px solid var(--line);margin-top:10px}
.ghost:active{background:rgba(255,255,255,.12)}
.nav2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.nav2 .ghost{margin:0;position:relative}
.badge{position:absolute;top:-6px;right:-4px;min-width:22px;height:22px;border-radius:99px;background:#ff5a7a;font-size:12px;display:grid;place-items:center;padding:0 6px;font-weight:800}
.kbd{margin:14px 0 0;text-align:center;font-size:12px;color:var(--sub);font-weight:600}
.bestl{margin:10px 0 0;text-align:center;font-size:13px;color:var(--sub);font-weight:600}
.ttl{font-size:20px;font-weight:900}
.skins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.sk{border-radius:20px;background:var(--card);border:1.5px solid var(--line);padding:16px 10px 12px;text-align:center}
.sk.eq{border-color:var(--mint);background:rgba(45,226,176,.1)}
.sk .e{font-size:54px;line-height:1.1}
.sk b{display:block;font-size:16px;margin:6px 0 10px}
.sb{height:40px;width:100%;border-radius:12px;font-size:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.sb.g{background:rgba(255,255,255,.1)}
.sb:disabled{opacity:.6}
.nl{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.nr{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px}
.nr span{display:block;font-size:13px;color:var(--sub);margin-top:2px;font-weight:600}
.nr em{font-style:normal;font-size:12px;background:rgba(124,92,255,.25);border-radius:99px;padding:3px 10px;flex:none}
.empty{text-align:center;color:var(--sub);padding:30px 0;font-size:15px}
/* game */
#game{position:fixed;inset:0;display:flex;flex-direction:column;background:#070a1e}
#gbar{height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0 18px;display:flex;align-items:center;justify-content:space-between;flex:none}
#gTitle{font-size:14px;color:var(--sub);font-weight:700}
#gbar .icon{width:38px;height:38px;border-radius:12px}
#stage{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) auto}
#cvw{grid-column:1/3;grid-row:1;position:relative;min-height:0}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:16px;touch-action:none;background:#000;display:block}
#padL,#padR{display:none;gap:10px;align-items:center;padding:10px 0 max(14px,env(safe-area-inset-bottom))}
#padL{grid-column:1;grid-row:2;padding-left:14px;padding-right:5px}
#padR{grid-column:2;grid-row:2;padding-left:5px;padding-right:14px}
.padon #padL,.padon #padR{display:flex}
.pb{width:var(--pb);height:var(--pb);border-radius:26px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;flex:none;transition:transform .08s,background .08s}
.pb svg{width:36px;height:36px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pb small{font-size:12px;font-weight:700;color:rgba(255,255,255,.75);line-height:1}
.pb.on{transform:scale(.94);background:rgba(255,255,255,.26)}
.pb.up{background:linear-gradient(135deg,#8b6cff,#4f8cff);border-color:transparent;box-shadow:0 8px 24px rgba(88,101,255,.4)}
.pb.up.on{filter:brightness(1.2)}
.m-run .pb.dn{display:none}
.m-run .pb.up{width:auto;flex:1}
#padR{justify-content:flex-end}
@media (orientation:landscape) and (max-height:520px){
 :root{--pb:68px}
 #stage{grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr)}
 #cvw{grid-column:2;grid-row:1}
 #padL{grid-column:1;grid-row:1;align-self:end;padding:10px 6px 14px 16px}
 #padR{grid-column:3;grid-row:1;align-self:end;padding:10px 16px 14px 6px}
 .m-run .pb.up{width:var(--pb);flex:none}
}
/* overlays */
.ov{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,7,24,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:20}
.ov.c{align-items:center;padding:18px}
.sheet{width:100%;max-width:460px;background:#161b44;border:1px solid var(--line);border-radius:28px 28px 0 0;padding:22px 20px max(20px,env(safe-area-inset-bottom));animation:up .25s ease}
.sheet.card{border-radius:28px}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet h2{margin:0 0 6px;font-size:22px;font-weight:900}
.sw{display:flex;justify-content:space-between;align-items:center;width:100%;height:54px;font-size:16px;border-bottom:1px solid var(--line);text-align:left}
.sw i{width:50px;height:30px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;transition:.2s;flex:none}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on i{background:var(--mint)}
.sw.on i::after{transform:translateX(20px)}
.sheet .cta{margin-top:18px}
.rt{text-align:center;font-size:26px;font-weight:900}
.stars{text-align:center;font-size:46px;letter-spacing:6px;margin:8px 0 4px}
.stars span{display:inline-block;animation:star .5s both}
@keyframes star{from{transform:scale(0) rotate(-90deg)}}
.new{text-align:center;color:var(--gold);font-weight:900;font-size:15px}
.rows{margin:12px 0 4px}
.rows div{display:flex;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--line);font-size:16px}
.rows span{color:var(--sub);font-weight:600}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:rgba(20,24,64,.95);border:1px solid var(--line);color:#fff;padding:11px 20px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:.3s;z-index:50;white-space:nowrap;max-width:92vw}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:360px){.mc span{display:none}}
</style>
</head>
<body>
<div id="bg"></div>

<div id="menu" class="screen"><div class="col">
  <div class="top">
    <div class="coin">🪙 <span id="coinNum">0</span></div>
    <button class="icon" id="btnSet" aria-label="설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <div class="brand">
    <div class="mark">+</div>
    <h1>매스 블록<br><em>어드벤처</em></h1>
    <p>달리고, 점프하고, 수학 마스터!</p>
  </div>
  <div class="sec"><div class="lbl">학년</div><div class="seg6" id="gradeBtns"></div><p id="gdesc"></p></div>
  <div class="sec"><div class="lbl">모드</div>
    <div class="modes">
      <button class="mc" data-mode="run"><span class="em">🏃</span><b>런 앤 점프</b><span>벽돌을 머리로 쾅!</span></button>
      <button class="mc" data-mode="drop"><span class="em">🧱</span><b>넘버 드롭</b><span>블록을 맞춰 보스 격파!</span></button>
    </div>
  </div>
  <div class="grow"></div>
  <button class="cta" id="btnStart">시작하기</button>
  <p class="bestl" id="best"></p>
  <div class="nav2">
    <button class="ghost" id="btnShop">🛍 스킨 상점</button>
    <button class="ghost" id="btnNotes">📒 오답 노트<span class="badge hidden" id="wBadge">0</span></button>
  </div>
  <p class="kbd" id="kbd">← → 이동 · ↑ 점프/변환 · ↓ 빠른 낙하 · Space 점프/즉시 낙하 · P 일시정지</p>
</div></div>

<div id="shop" class="screen hidden"><div class="col">
  <div class="top"><button class="icon" data-back aria-label="뒤로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><div class="ttl">스킨 상점</div><div class="coin">🪙 <span id="coinNum2">0</span></div></div>
  <div class="skins" id="skinList"></div>
</div></div>

<div id="notes" class="screen hidden"><div class="col">
  <div class="top"><button class="icon" data-back aria-label="뒤로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><div class="ttl">오답 노트</div><div class="coin"><span id="wCount">0</span>문제</div></div>
  <div class="nl" id="noteList"></div>
  <div class="grow"></div>
  <button class="cta" id="btnDungeon" style="margin-top:18px">복습 던전 입장 (코인 ×2)</button>
  <button class="ghost" id="btnClear">오답 노트 비우기</button>
</div></div>

<div id="game" class="hidden m-run">
  <div id="gbar"><span id="gTitle"></span><button class="icon" id="gPause" aria-label="일시정지"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button></div>
  <div id="stage">
    <div id="cvw"><canvas id="cv"></canvas></div>
    <div id="padL">
      <button class="pb" data-k="left" aria-label="왼쪽"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="pb" data-k="right" aria-label="오른쪽"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div id="padR">
      <button class="pb dn" data-k="down" aria-label="내리기"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg><small>드롭</small></button>
      <button class="pb up" data-k="up" aria-label="점프"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg><small id="lblUp">점프</small></button>
    </div>
  </div>
</div>

<div id="sheet" class="ov hidden"><div class="sheet">
  <h2>설정</h2>
  <button class="sw" data-t="sfx"><span>효과음</span><i></i></button>
  <button class="sw" data-t="bgm"><span>배경음</span><i></i></button>
  <button class="sw" data-t="voice"><span>음성 읽어주기</span><i></i></button>
  <button class="sw" data-t="pad"><span>터치 패드</span><i></i></button>
  <button class="cta" id="sheetClose">닫기</button>
</div></div>

<div id="pause" class="ov hidden"><div class="sheet">
  <h2>일시정지</h2>
  <button class="sw" data-t="sfx"><span>효과음</span><i></i></button>
  <button class="sw" data-t="bgm"><span>배경음</span><i></i></button>
  <button class="sw" data-t="voice"><span>음성 읽어주기</span><i></i></button>
  <button class="cta" id="pResume">계속하기</button>
  <button class="ghost" id="pQuit">메인으로</button>
</div></div>

<div id="result" class="ov c hidden"><div class="sheet card" id="resBox"></div></div>
<div id="toast"></div>

<script>
'use strict';
//#GEN_START
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r2=v=>Math.round(v*1000)/1000;
const fmt=v=>String(r2(v));
const KD=['영','일','이','삼','사','오','육','칠','팔','구'];
function koInt(n){n=Math.floor(n);if(n<=0)return'영';let s='';const man=Math.floor(n/10000);n%=10000;if(man)s+=(man>1?koInt(man):'일')+'만';for(const[v,w]of[[1000,'천'],[100,'백'],[10,'십']]){const d=Math.floor(n/v);n%=v;if(d)s+=(d>1?KD[d]:'')+w;}if(n)s+=KD[n];return s;}
function koNum(str){str=String(str);if(str.indexOf('.')<0)return koInt(+str);const p=str.split('.');return koInt(+p[0])+' 점 '+p[1].split('').map(d=>KD[+d]).join(' ');}
const OPS={'+':' 더하기 ','−':' 빼기 ','×':' 곱하기 ','÷':' 나누기 ','=':' 은 '};
function sp(e){return String(e).replace(/(\d+)\/(\d+)|(\d+(?:\.\d+)?)%|(\d+(?:\.\d+)?)|([+−×÷=])/g,(m,fn,fd,pc,nm,op)=>{if(fd!==undefined)return koInt(+fd)+' 분의 '+koInt(+fn);if(pc!==undefined)return koNum(pc)+' 퍼센트';if(nm!==undefined)return koNum(nm);return OPS[op];});}
function eqSpeech(e){const i=e.indexOf(' = ');if(i<0)return sp(e);const L=sp(e.slice(0,i)).trim(),R=sp(e.slice(i+3)).trim();const c=L.charCodeAt(L.length-1);const b=c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28!==0;return L+(b?'은 ':'는 ')+R;}
const PRAISE=['최고예요!','정말 잘했어요!','멋져요!','대단해요!','와, 천재예요!'];

function numCh(ans,o){o=o||{};const u=o.unit||1,min=o.min===undefined?0:o.min,max=o.max===undefined?1e9:o.max,f=o.fmt||fmt;
 const ok=v=>v>=min-1e-9&&v<=max+1e-9;
 const pri=shuffle((o.cands||[]).filter(ok)),rest=shuffle([1,2,3,-1,-2,-3,10,-10].map(d=>ans+d*u).filter(ok));
 const seen=new Set([r2(ans)]),wrong=[];
 for(const v of pri.concat(rest)){const k=r2(v);if(seen.has(k))continue;seen.add(k);wrong.push(v);if(wrong.length>=3)break;}
 for(let d=4;wrong.length<3&&d<60;d++){for(const v of [ans+d*u,ans-d*u]){const k=r2(v);if(wrong.length<3&&ok(v)&&!seen.has(k)){seen.add(k);wrong.push(v);}}}
 return shuffle([ans].concat(wrong).map(v=>({label:f(v),val:r2(v),correct:r2(v)===r2(ans)})));}
function fracCh(n,d){return numCh(n,{min:1,max:d,fmt:v=>v+'/'+d}).map(c=>({label:c.label,val:r2(c.val/d),correct:c.correct}));}
function decCh(s,max){return numCh(s,{min:0,max:max||20,fmt:v=>(v/10).toFixed(1)}).map(c=>({label:c.label,val:r2(c.val/10),correct:c.correct}));}
function S1(prompt,eq,ans,ch,vis,x){return Object.assign({kind:'single',prompt:prompt,eq:eq,ans:r2(ans),bricks:ch,vis:vis||{t:'none'}},x||{});}
function sumBricks(vals,f){return vals.map(v=>({label:'+'+f(v),val:v,add:v,correct:false}));}
function divisors(n){const r=[];for(let i=1;i<=n;i++)if(n%i===0)r.push(i);return r;}

function gen1(special){
 if(special){const T=rnd(8,15);return{kind:'sum',prompt:T+' 만들기!',target:T,vis:{t:'ten',dyn:true},bricks:sumBricks(shuffle([5,3,2,1]),String),g:1,eq:''};}
 const t=pick(['pair','pair','add','sub']);
 if(t==='pair'){const a=rnd(1,9),b=10-a;return S1(a+' + ? = 10',a+' + '+b+' = 10',b,numCh(b,{min:0,max:10}),{t:'ten',a:a,b:0},{g:1});}
 if(t==='add'){const a=rnd(3,12),b=rnd(2,Math.min(9,20-a)),s=a+b;return S1(a+' + '+b+' = ?',a+' + '+b+' = '+s,s,numCh(s,{min:0,max:20}),{t:'ten',a:a,b:b},{g:1});}

const COL=['#ff6b6b','#ffa94d','#ffe066','#51cf66','#339af0','#845ef7','#ff8fab'];
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function txt(s,x,y,size,color,align,weight,stroke){ctx.font=(weight||'900')+' '+size+'px '+FONT;ctx.textAlign=align||'center';ctx.textBaseline='middle';if(stroke){ctx.lineWidth=stroke[1];ctx.strokeStyle=stroke[0];ctx.lineJoin='round';ctx.strokeText(s,x,y);}ctx.fillStyle=color;ctx.fillText(s,x,y);}
function fit(s,maxW,size,min){while(size>min){ctx.font='900 '+size+'px '+FONT;if(ctx.measureText(s).width<=maxW)break;size-=2;}return size;}
function label(s,cx,cy,size,color,maxW,stroke){const m=/^(\d+)\/(\d+)$/.exec(s);
 if(m){const fs=size*.8;txt(m[1],cx,cy-fs*.6,fs,color,'center','900',stroke);ctx.strokeStyle=color;ctx.lineWidth=Math.max(2,size*.08);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx-fs*.6,cy);ctx.lineTo(cx+fs*.6,cy);ctx.stroke();txt(m[2],cx,cy+fs*.66,fs,color,'center','900',stroke);}
 else{const fs=maxW?fit(s,maxW,size,10):size;txt(s,cx,cy,fs,color,'center','900',stroke);}}
function drawPie(cx,cy,r,n,d,col){
 for(let i=0;i<d;i++){const a0=-Math.PI/2+i/d*Math.PI*2,a1=-Math.PI/2+(i+1)/d*Math.PI*2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a0,a1);ctx.closePath();ctx.fillStyle=i<n?col:'#fff4d6';ctx.fill();ctx.strokeStyle='#8a5a2b';ctx.lineWidth=d>12?1:2;ctx.stroke();
  if(i<n&&d<=12){const am=(a0+a1)/2;ctx.beginPath();ctx.arc(cx+Math.cos(am)*r*.6,cy+Math.sin(am)*r*.6,r*.1,0,7);ctx.fillStyle='#b71c1c';ctx.fill();}}
 ctx.beginPath();ctx.arc(cx,cy,r+2,0,7);ctx.strokeStyle='#d9962b';ctx.lineWidth=4;ctx.stroke();}
function drawVisual(v,x,y,w,h){
 if(!v||v.t==='none')return;
 if(v.dyn){v=Object.assign({},v);const s=G.sum||0;if(v.t==='ten')v.a=Math.min(20,s);else if(v.t==='gauge')v.a=Math.round(s*10);else if(v.t==='b10')v.n=[s];}
 switch(v.t){
 case 'ten':{const a=v.a||0,b=v.b||0,tot=a+b,f=tot>10?2:1,c=Math.min((w-(f-1)*10)/(5*f),(h-20)/2,26),tw=f*5*c+(f-1)*10,x0=x+(w-tw)/2,y0=y+4;
  for(let q=0;q<f;q++){const fx=x0+q*(5*c+10);rr(fx,y0,5*c,2*c,6);ctx.fillStyle='#2b49a8';ctx.fill();
   for(let i=0;i<10;i++){const idx=q*10+i,cx=fx+(i%5)*c+c/2,cy=y0+Math.floor(i/5)*c+c/2;ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;ctx.strokeRect(fx+(i%5)*c+1,y0+Math.floor(i/5)*c+1,c-2,c-2);
    if(idx<tot){ctx.beginPath();ctx.arc(cx,cy,c*.36,0,7);ctx.fillStyle=idx<a?'#ffd54f':'#ff6b9d';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();}}}
  txt(v.cap||'10칸 구슬 상자',x+w/2,y+h-9,13,'#334');break;}
 case 'arr':{const R=v.r,C=v.c,s=Math.min(w/C,(h-18)/R,24),x0=x+(w-C*s)/2,y0=y+2+(h-18-R*s)/2;
  for(let i=0;i<R;i++)for(let j=0;j<C;j++){ctx.beginPath();ctx.arc(x0+j*s+s/2,y0+i*s+s/2,s*.36,0,7);ctx.fillStyle=['#ff6b6b','#ffa94d','#51cf66','#339af0','#845ef7'][i%5];ctx.fill();}
  txt(v.cap||(C+'개씩 '+R+'줄'),x+w/2,y+h-9,13,'#334');break;}
 case 'b10':{const arr=v.n,cnt=arr.length,aw=w/cnt;
  arr.forEach((n,i)=>{const t=Math.floor(n/10),o=n%10,tw=Math.max(1,t*12+(o?58:0)),sc=Math.min(1,(aw-10)/tw,(h-24)/44);
   ctx.save();ctx.translate(x+aw*i+(aw-tw*sc)/2,y+6);ctx.scale(sc,sc);
   for(let j=0;j<t;j++){rr(j*12,0,9,40,2);ctx.fillStyle='#3b82f6';ctx.fill();ctx.strokeStyle='#1e3a8a';ctx.lineWidth=1;ctx.stroke();for(let q=1;q<10;q++){ctx.beginPath();ctx.moveTo(j*12,q*4);ctx.lineTo(j*12+9,q*4);ctx.stroke();}}
   for(let j=0;j<o;j++){rr(t*12+(t?6:0)+(j%5)*11,Math.floor(j/5)*13,9,9,2);ctx.fillStyle='#f59e0b';ctx.fill();ctx.strokeStyle='#92400e';ctx.lineWidth=1;ctx.stroke();}
   ctx.restore();txt(String(n),x+aw*i+aw/2,y+h-9,14,'#334');
   if(cnt>1&&i<cnt-1)txt('+',x+aw*(i+1),y+h/2-4,22,'#334');});
  if(v.cap)txt(v.cap,x+w/2,y+8,12,'#775');break;}
 case 'pie':{const P=v.p,n=P.length,r=Math.max(10,Math.min(h/2-18,w/(2*n)-10,42));
  P.forEach((q,i)=>{const cx=x+w*(i+.5)/n,cy=y+r+4;drawPie(cx,cy,r,q.n,q.d,i?'#ff8fab':'#ff7043');label(q.d===20?(q.n*5)+'%':q.n+'/'+q.d,cx,cy+r+16,15,'#334');if(i<n-1)txt('+',x+w*(i+1)/n,cy,22,'#334');});break;}
 case 'gauge':{const a=clamp(v.a||0,0,10),b=clamp(v.b||0,0,10-a),cw=Math.min(w/10,22),tw=cw*10,x0=x+(w-tw)/2,y0=y+26;
  rr(x0-4,y0-4,tw+8,34,8);ctx.fillStyle='#dbeafe';ctx.fill();ctx.strokeStyle='#3b82f6';ctx.lineWidth=3;ctx.stroke();
  for(let i=0;i<10;i++){ctx.fillStyle=i<a?'#38bdf8':i<a+b?'#fb923c':'rgba(255,255,255,.75)';ctx.fillRect(x0+i*cw+1,y0,cw-2,26);}
  txt('0',x0,y0+46,12,'#334');txt('1.0',x0+tw,y0+46,12,'#334');txt((a/10).toFixed(1)+(b?' + '+(b/10).toFixed(1):''),x+w/2,y+9,15,'#334');
  txt('10칸 눈금 물통',x+w/2,y+h-8,12,'#556');break;}
 }}
function visOfBlock(b,g){const v=b.val;
 if(g===1)return{t:'ten',a:v,b:0};
 if(g===2)return{t:'b10',n:[v]};
 if(b.label.indexOf('/')>0){const p=b.label.split('/');return{t:'pie',p:[{n:+p[0],d:+p[1]}]};}
 if(g===4&&v<=1)return{t:'gauge',a:Math.round(v*10),b:0};
 if(g===6&&v<=1)return{t:'pie',p:[{n:Math.round(v*20),d:20}]};
 if(g===5)return{t:'arr',r:Math.min(9,Math.max(1,Math.round(v))),c:1,cap:'숫자 '+b.label};
 return{t:'none'};}
function burst(x,y,n,col,spd){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*(spd||6)+1;G.parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:.6+Math.random()*.6,c:col||pick(COL),r:3+Math.random()*4});}}
function updParts(dt){const k=dt*60;G.parts=G.parts.filter(p=>{p.life-=dt;p.x+=p.vx*k;p.y+=p.vy*k;p.vy+=.25*k;return p.life>0;});G.floats=G.floats.filter(f=>{f.life-=dt;f.y-=36*dt;return f.life>0;});}
function drawParts(){G.parts.forEach(p=>{ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle=p.c;ctx.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r);});ctx.globalAlpha=1;G.floats.forEach(f=>{ctx.globalAlpha=clamp(f.life*2,0,1);txt(f.text,f.x,f.y,f.size||26,f.c||'#fff',null,'900',['rgba(0,0,0,.55)',5]);});ctx.globalAlpha=1;}

function drawCountdown(){const n=Math.ceil(G.cd-.4),s=n>0?String(n):'GO!';const f=(G.cd-.4)%1;ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2,H/2);const sc=n>0?1+(f<0?0:f)*.3:1.2;ctx.scale(sc,sc);txt(s,0,0,n>0?150:110,n>0?'#fff':'#ffe066',null,'900',['#3b2a9a',12]);ctx.restore();}

/* ===================== 모드 2: 넘버 드롭 디펜스 (로직) ===================== */
const BOSSES=[['👾','알쏭달쏭 몬스터'],['🐲','곱셈 드래곤'],['🦑','분수 크라켄'],['🤖','계산 로봇']];
function calc(op,x,y){switch(op){case '+':return x+y;case '−':return Math.abs(x-y);case '×':return x*y;case '÷':{const hi=Math.max(x,y),lo=Math.min(x,y);return lo?hi/lo:NaN;}}return NaN;}
function pairOp(a,b,gl){if(gl.eq)return(Math.abs(a.val-b.val)<1e-6&&a.label!==b.label)?'=':null;
 const ops=a.op===b.op?[a.op]:[a.op,b.op];for(const op of ops){if(Math.abs(calc(op,a.val,b.val)-gl.target)<1e-6)return op;}return null;}
function makeGoal(g,k){
 const ints=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push({label:String(i),val:i});return r;};
 const frs=d=>{const r=[];for(let i=1;i<d;i++)r.push({label:i+'/'+d,val:r2(i/d)});return r;};
 const decs=()=>{const r=[];for(let i=1;i<=9;i++)r.push({label:(i/10).toFixed(1),val:i/10});return r;};
 if(g===1){const t=[10,12,8][k%3];return{text:'합해서 '+t+' 만들기',spoken:'합해서 '+koInt(t)+' 만들기',ops:['+'],pool:ints(1,9),target:t};}
 if(g===2){const t=[12,18,24][k%3];return{text:'더하거나 곱해서 '+t+' 만들기',spoken:'더하거나 곱해서 '+koInt(t)+' 만들기',ops:['+','×'],pool:ints(2,9),target:t};}
 if(g===3){if(k%2===0){const d=[4,6,8][Math.floor(k/2)%3];return{text:'합해서 1 만들기 (분모 '+d+')',spoken:'합해서 일 만들기',ops:['+'],pool:frs(d),target:1};}
  const t=[3,2,4][k%3];return{text:'나누어서 몫이 '+t+' 되게',spoken:'나누어서 몫이 '+koInt(t)+' 되게',ops:['÷'],pool:ints(2,16),target:t};}
 if(g===4){if(k===0)return{text:'합해서 1.0 만들기',spoken:'합해서 일 점 영 만들기',ops:['+'],pool:decs(),target:1};
  if(k===1)return{text:'합해서 1 만들기 (분모 5)',spoken:'합해서 일 만들기',ops:['+'],pool:frs(5),target:1};
  return{text:'더하거나 빼서 0.5 만들기',spoken:'더하거나 빼서 영 점 오 만들기',ops:['+','−'],pool:decs(),target:.5};}
 if(g===5){const t=[12,24,36][k%3];return{text:'더하거나 곱해서 '+t+' 만들기',spoken:'더하거나 곱해서 '+koInt(t)+' 만들기',ops:['+','×'],pool:ints(2,12),target:t};}
 const pool=[];FAM.forEach(F=>['f','d','p'].forEach(x=>pool.push({label:F[x],val:F.v})));
 return{text:'같은 크기끼리 붙이기!',spoken:'같은 크기끼리 붙여요',ops:['='],pool:pool,eq:true,target:0};}
function genBlock(){
 const gl=G.goal;let item=null;
 if(Math.random()<.6){const ex=[];G.grid.forEach(r=>r.forEach(c=>{if(c&&!c.flash)ex.push(c);}));
  if(ex.length){const e=pick(ex),cands=gl.pool.filter(p=>gl.eq?(Math.abs(p.val-e.val)<1e-6&&p.label!==e.label):gl.ops.some(op=>Math.abs(calc(op,p.val,e.val)-gl.target)<1e-6));if(cands.length)item=pick(cands);}}
 if(!item)item=pick(gl.pool);
 return{label:item.label,val:item.val,op:pick(gl.ops),opts:[item].concat(shuffle(gl.pool.filter(p=>p!==item)).slice(0,2)),oi:0};}
function startDrop(grade){
 G={mode:'drop',grade:grade,dungeon:false,score:0,combo:0,fever:false,feverT:0,defeated:0,pairsTotal:0,coinsGot:0,grid:Array.from({length:ROWS},()=>Array(COLS).fill(null)),cur:null,next:null,phase:'countdown',cd:3.4,lastCd:4,timer:0,clearT:0,pairs:[],chain:0,parts:[],floats:[],shake:0,bossHit:0,t:0,rep:0,paused:false,over:false,speed:.85,bannerT:0,bannerText:'',goalFlash:0};
 setupBoss();G.next=genBlock();}
function setupBoss(){G.bossMax=100+25*G.defeated;G.bossHp=G.bossMax;G.goal=makeGoal(G.grade,G.defeated);G.goalFlash=2;}
function spawn(){const blk=G.next;G.next=genBlock();if(G.grid[0][2]){finish(false);return;}G.cur={c:2,r:0,blk:blk};G.timer=0;G.phase='fall';G.speed=Math.max(.26,.85-.1*G.defeated-.012*Math.min(20,G.pairsTotal));}
const canDown=()=>G.cur.r+1<ROWS&&!G.grid[G.cur.r+1][G.cur.c];
function toggleBlk(){const b=G.cur.blk,gl=G.goal;
 if(gl.ops.length>1){b.op=gl.ops[(gl.ops.indexOf(b.op)+1)%gl.ops.length];}
 else{b.oi=(b.oi+1)%b.opts.length;const o=b.opts[b.oi];b.label=o.label;b.val=o.val;}
 Snd.tone(760,.07,'square',.08,300);b.pop=1;}
function lockBlk(){const c=G.cur;G.grid[c.r][c.c]=c.blk;c.blk.pop=1;G.cur=null;Snd.land();afterLock(false);}
function findPairs(){const used={},res=[],gl=G.goal;
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const a=G.grid[r][c];if(!a||used[r+','+c])continue;
  for(const d of [[0,1],[1,0]]){const nr=r+d[0],nc=c+d[1];if(nr>=ROWS||nc>=COLS)continue;const b=G.grid[nr][nc];if(!b||used[nr+','+nc])continue;
   const op=pairOp(a,b,gl);if(op){used[r+','+c]=used[nr+','+nc]=1;let x=a,y=b;if((op==='−'||op==='÷')&&y.val>x.val){x=b;y=a;}
    res.push({a:a,b:b,ar:r,ac:c,br:nr,bc:nc,op:op,eq:op==='='?a.label+' = '+b.label:x.label+' '+op+' '+y.label+' = '+fmt(calc(op,x.val,y.val))});break;}}}
 return res;}
function afterLock(isChain){
 const pairs=findPairs();
 if(pairs.length){G.pairs=pairs;G.phase='clear';G.clearT=.45;pairs.forEach(p=>{p.a.flash=true;p.b.flash=true;});
  if(!isChain){G.chain=0;G.combo++;if(G.combo>=3&&!G.fever){G.fever=true;G.feverT=10;Snd.fever();G.floats.push({x:W/2,y:260,text:'🔥 FEVER! 점수 2배',c:'#ffe066',size:34,life:2});}}
  speak(eqSpeech(pairs[0].eq)+' '+pick(PRAISE));Snd.ok();}
 else{if(!isChain)G.combo=0;G.chain=0;if(G.bossHp<=0)bossDefeated();else spawn();}}
function gravity(){for(let c=0;c<COLS;c++){let w=ROWS-1;for(let r=ROWS-1;r>=0;r--){if(G.grid[r][c]){if(r!==w){G.grid[w][c]=G.grid[r][c];G.grid[r][c]=null;}w--;}}}}
function clearDone(){
 const n=G.pairs.length;G.chain++;const mul=G.fever?2:1,dmg=Math.round(25*n*(1+.5*(G.chain-1)));
 G.bossHp-=dmg;G.score+=100*n*G.chain*mul;addCoins(n*mul);G.pairsTotal+=n;
 G.pairs.forEach(p=>{[[p.ar,p.ac],[p.br,p.bc]].forEach(q=>{G.grid[q[0]][q[1]]=null;burst(BX+q[1]*CELL+CELL/2,BY+q[0]*CELL+CELL/2,16,null,7);});});
 G.floats.push({x:BX+150,y:BY+200,text:(G.chain>1?G.chain+'연쇄! ':'')+'-'+dmg,c:'#ff8fab',size:34,life:1.3});
 Snd.boom();Snd.boss();G.bossHit=.5;G.shake=.4;gravity();G.pairs=[];afterLock(true);}
function bossDefeated(){
 G.defeated++;addCoins(10);G.score+=500;Snd.win();speak('보스를 물리쳤어요! 대단해요!');
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(G.grid[r][c]){burst(BX+c*CELL+CELL/2,BY+r*CELL+CELL/2,8,null,7);G.grid[r][c]=null;}
 for(let i=0;i<50;i++)G.parts.push({x:165+(Math.random()-.5)*200,y:140+(Math.random()-.5)*100,vx:(Math.random()-.5)*10,vy:-Math.random()*6,life:1.5,c:pick(COL),r:6});
 if(G.defeated>=3){const g0=G;G.phase='end';setTimeout(()=>{if(G===g0)finish(true);},1200);return;}

 if(fall){ctx.shadowColor='rgba(255,255,255,.8)';ctx.shadowBlur=14;}
 const g=ctx.createLinearGradient(0,0,0,cs);g.addColorStop(0,'hsl('+hue+',85%,66%)');g.addColorStop(1,'hsl('+hue+',72%,46%)');
 rr(2,2,cs-4,cs-4,cs*.22);ctx.fillStyle=g;ctx.fill();ctx.shadowBlur=0;ctx.lineWidth=2;ctx.strokeStyle='hsl('+hue+',65%,30%)';ctx.stroke();
 ctx.fillStyle='rgba(255,255,255,.28)';rr(6,5,cs-12,cs*.14,4);ctx.fill();
 label(b.label,cs/2,cs/2+2,cs*.5,'#fff',cs-14,['hsl('+hue+',70%,26%)',4]);
 if(G.goal.ops.length>1&&!G.goal.eq){const r=cs*.18;ctx.beginPath();ctx.arc(cs*.2,cs*.2,r,0,7);ctx.fillStyle='#161b44';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();txt(b.op,cs*.2,cs*.2+1,r*1.4,'#ffe066');}
 if(b.flash){ctx.globalAlpha=.4+Math.sin(T*30)*.4;rr(2,2,cs-4,cs-4,cs*.22);ctx.fillStyle='#fff';ctx.fill();ctx.globalAlpha=1;}
 ctx.restore();}
function bgDrop(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#181c55');g.addColorStop(1,'#0b0d2c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 for(let i=0;i<46;i++){const x=(i*173)%W,y=(i*97+T*(8+i%5*4))%H;ctx.fillStyle='rgba(255,255,255,'+(.15+(i%4)*.1)+')';ctx.fillRect(x,y,2+i%2,2+i%2);}}
function pn(x,y,w,h,fill){rr(x,y,w,h,18);ctx.fillStyle=fill||'rgba(255,255,255,.07)';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='rgba(255,255,255,.16)';ctx.stroke();}
function drawDrop(){
 ctx.save();ctx.setTransform(CS,0,0,CS,0,0);bgDrop();
 ctx.save();if(G.shake>0)ctx.translate((Math.random()-.5)*G.shake*12,(Math.random()-.5)*G.shake*12);
 const bw=CELL*COLS,bh=CELL*ROWS;
 rr(BX-6,BY-6,bw+12,bh+12,18);ctx.fillStyle='rgba(6,6,30,.72)';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=G.fever?'#ffcf5a':'rgba(124,92,255,.75)';ctx.stroke();
 ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;for(let i=1;i<COLS;i++){ctx.beginPath();ctx.moveTo(BX+i*CELL,BY);ctx.lineTo(BX+i*CELL,BY+bh);ctx.stroke();}for(let i=1;i<ROWS;i++){ctx.beginPath();ctx.moveTo(BX,BY+i*CELL);ctx.lineTo(BX+bw,BY+i*CELL);ctx.stroke();}
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(G.grid[r][c])drawBlk(BX+c*CELL,BY+r*CELL,G.grid[r][c],false);
 if(G.cur&&G.phase==='fall'){const cur=G.cur;let gr=cur.r;while(gr+1<ROWS&&!G.grid[gr+1][cur.c])gr++;
  ctx.setLineDash([6,5]);ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=2;rr(BX+cur.c*CELL+4,BY+gr*CELL+4,CELL-8,CELL-8,9);ctx.stroke();ctx.setLineDash([]);
  const iv=keys.down?.045:G.speed,fy=cur.r+(canDown()?clamp(G.timer/iv,0,1):0);drawBlk(BX+cur.c*CELL,BY+fy*CELL,cur.blk,true);}
 ctx.restore();
 // 상단: 보스 / 목표 / 다음 블록
 const bs=BOSSES[G.defeated%4];
 pn(8,8,128,134);txt('보스 '+Math.min(3,G.defeated+1)+' / 3',72,26,13,'#9aa0c8','center','800');
 ctx.save();ctx.translate(72+(G.bossHit>0?(Math.random()-.5)*10:0),64+Math.sin(T*2.5)*4);ctx.fillStyle='#fff';ctx.font='58px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';if(G.bossHit>0)ctx.filter='brightness(2)';ctx.fillText(bs[0],0,0);ctx.restore();
 rr(20,100,104,10,5);ctx.fillStyle='rgba(0,0,0,.45)';ctx.fill();const hp=clamp(G.bossHp/G.bossMax,0,1);
 if(hp>0){rr(20,100,Math.max(10,104*hp),10,5);const hg=ctx.createLinearGradient(20,0,124,0);hg.addColorStop(0,'#ff5e7a');hg.addColorStop(1,'#ffa94d');ctx.fillStyle=hg;ctx.fill();}
 txt('HP '+Math.max(0,Math.ceil(G.bossHp)),72,124,13,'#fff','center','800');
 pn(144,8,224,134,'rgba(124,92,255,.22)');
 if(G.goalFlash>0){ctx.globalAlpha=.3+Math.sin(T*14)*.25;rr(144,8,224,134,18);ctx.fillStyle='#fff';ctx.fill();ctx.globalAlpha=1;}
 txt('목표',256,26,13,'#b9b3ff','center','800');
 const gf=wrapFit(G.goal.text,200,28,15,3),gl=gf.fs*1.22,gy=78-(gf.lines.length-1)*gl/2;
 gf.lines.forEach((l,i)=>txt(l,256,gy+i*gl,gf.fs,'#fff','center','900'));
 txt(G.goal.ops.length>1?'▲ 눌러서 연산 바꾸기':'▲ 눌러서 숫자 바꾸기',256,126,12,'#9aa0c8','center','700');
 pn(376,8,96,134);txt('다음',424,26,13,'#9aa0c8','center','800');
 if(G.next){const cs=Math.min(CELL,64);drawBlk(424-cs/2,84-cs/2,G.next,false,cs);}
 // 상태 줄
 txt('⭐ '+G.score,18,162,17,'#fff','left','800');txt('🪙 '+S.coins,140,162,17,'#ffe066','left','800');
 if(G.fever){const pl=1+Math.sin(T*10)*.05;ctx.save();ctx.translate(W-18,162);ctx.scale(pl,pl);txt('🔥 FEVER ×2 · '+Math.ceil(G.feverT)+'초',0,0,16,'#ffd54f','right','900');ctx.restore();}
 else txt('연속 성공 '+G.combo+' / 3',W-18,162,14,'#9ff5e0','right','800');
 drawParts();
 if(G.phase==='banner')banner(G.bannerText,'새 목표: '+G.goal.text);
 if(G.phase==='countdown')drawCountdown();
 if(G.fever){ctx.strokeStyle='rgba(255,213,79,'+(.45+Math.sin(T*8)*.25)+')';ctx.lineWidth=6;ctx.strokeRect(3,3,W-6,H-6);}
 ctx.restore();}

/* ===================== 종료 / 결과 ===================== */
function finish(win){
 if(!G||G.fover)return;const g0=G;G.fover=true;G.over=true;Snd.stopBgm();for(const k in keys)keys[k]=false;
 if(win)Snd.win();else Snd.lose();
 setTimeout(()=>{if(G===g0)showResult(win);},900);}
function showResult(win){
 const g=G;if(!g)return;let st=0;
 if(g.mode==='run'){const ra=g.correct/g.rounds.length;st=ra>=.9?3:ra>=.6?2:ra>=.3?1:0;if(!win&&st>1)st=1;}
 else st=win?3:clamp(g.defeated,0,2)+(g.score>=300&&g.defeated===0?1:0);
 if(win&&st<1)st=1;
 const key=g.dungeon?'dungeon':g.mode+'_g'+g.grade,prev=S.best[key]||0,isNew=g.score>prev;if(isNew)S.best[key]=g.score;persist();
 let rows='<div><span>점수</span><b>'+g.score+'점</b></div><div><span>모은 코인</span><b>🪙 +'+g.coinsGot+'</b></div>';
 rows+=g.mode==='run'?'<div><span>한 번에 맞힌 문제</span><b>'+g.correct+' / '+g.rounds.length+'</b></div>':'<div><span>물리친 보스</span><b>'+g.defeated+' / 3</b></div>';
 $('#resBox').innerHTML='<div class="rt">'+(win?'클리어!':'조금만 더 힘내요')+'</div><div class="stars">'+[0,1,2].map(i=>'<span style="animation-delay:'+(.15+i*.2)+'s">'+(i<st?'⭐':'☆')+'</span>').join('')+'</div>'+(isNew&&g.score>0?'<div class="new">✨ 신기록!</div>':'')+'<div class="rows">'+rows+'</div>'
  +'<button class="cta" id="rAgain" style="margin-top:16px">다시 하기</button>'+(S.wrong.length?'<button class="ghost" id="rDun">오답 복습 던전 ('+S.wrong.length+')</button>':'')+'<button class="ghost" id="rMenu">메인으로</button>';
 $('#result').classList.remove('hidden');
 $('#rAgain').onclick=()=>{Snd.click();$('#result').classList.add('hidden');startGame(lastCfg.mode,lastCfg.grade,lastCfg.dungeon&&S.wrong.length>0);};
 const rd=$('#rDun');if(rd)rd.onclick=()=>{$('#result').classList.add('hidden');startGame('run',0,true);};
 $('#rMenu').onclick=()=>{Snd.click();quitToMenu();};
 speak(win?'우와! 정말 잘했어요!':'괜찮아요! 다시 도전해봐요!');}

/* ===================== 메인 루프 ===================== */
let last=0;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;T=ts/1000;
 if(G){if(!G.paused&&!G.over){G.t+=dt;if(G.mode==='run')updRun(dt);else updDrop(dt);}
  else if(!G.paused){updParts(dt);}
  if(G){if(G.mode==='run')drawRun();else drawDrop();}}
 just={};}
requestAnimationFrame(loop);
renderMenu();screenTo('menu');
if('speechSynthesis' in window){try{speechSynthesis.getVoices();}catch(e){}}
</script>
