<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1446">
<title>매스 블록 어드벤처 🧮</title>
<style>
:root{--ink:#241a55;--gold:#ffd54f;--pink:#ff6b9d;--mint:#4ff0b7;--sky:#5cc8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#150f3d;color:#fff;font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
#bg{position:fixed;inset:0;overflow:hidden;background:radial-gradient(1100px 700px at 15% 0%,#4b2fb3 0,transparent 60%),radial-gradient(900px 600px at 95% 100%,#0e7fb8 0,transparent 55%),linear-gradient(160deg,#1a1446,#2a1b6b 55%,#0f3460)}
#bg span{position:absolute;bottom:-80px;font-weight:900;opacity:.12;animation:rise linear infinite;color:#fff}
@keyframes rise{to{transform:translateY(-130vh) rotate(40deg)}}
.screen{position:fixed;inset:0;overflow-y:auto;padding:14px 14px 40px;display:flex;justify-content:center;-webkit-overflow-scrolling:touch}
.hidden{display:none!important}
.wrap{width:100%;max-width:900px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 14px;font-size:18px;font-weight:700;backdrop-filter:blur(6px)}
.tg{border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:6px 12px;font-size:16px;font-weight:700}
.tg.off{opacity:.45;filter:grayscale(1)}
.logo{text-align:center;margin:6px 0 4px}
.logo .bl{display:inline-flex;gap:6px;margin-bottom:6px}
.logo .bl i{font-style:normal;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:28px;font-weight:900;color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2),0 6px 14px rgba(0,0,0,.35);animation:bob 1.6s ease-in-out infinite}
.logo .bl i:nth-child(1){background:#ff6b6b}.logo .bl i:nth-child(2){background:#ffa94d;animation-delay:.15s}.logo .bl i:nth-child(3){background:#51cf66;animation-delay:.3s}.logo .bl i:nth-child(4){background:#339af0;animation-delay:.45s}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
h1{margin:0;font-size:clamp(30px,6vw,52px);font-weight:900;letter-spacing:-1px;background:linear-gradient(90deg,#ffe066,#ff9ec4,#7ee8fa);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.sub{opacity:.85;font-size:clamp(14px,2.4vw,18px);margin:4px 0 0}
.panel{background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.18);border-radius:22px;padding:14px 16px;margin:12px 0;backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.panel h3{margin:0 0 10px;font-size:20px;color:#ffe066}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.gb{border:none;border-radius:16px;padding:10px 4px;color:#fff;background:linear-gradient(#5b4bd0,#3b2fa6);box-shadow:0 5px 0 #231a73;font-size:clamp(16px,3.2vw,22px);font-weight:900;transition:transform .12s}
.gb small{display:block;font-size:20px;line-height:1.1}
.gb.on{background:linear-gradient(#ffd54f,#ff9f1a);color:#4a2b00;box-shadow:0 5px 0 #b36200;transform:translateY(-3px) scale(1.04)}
.gb:active{transform:translateY(2px);box-shadow:0 1px 0 #231a73}
#gdesc{margin:10px 2px 0;font-size:16px;opacity:.92;min-height:22px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mc{border:3px solid rgba(255,255,255,.2);border-radius:20px;padding:12px;background:rgba(255,255,255,.07);color:#fff;text-align:left;transition:.15s}
.mc b{display:block;font-size:clamp(18px,3.4vw,24px);margin-bottom:4px}
.mc span{font-size:clamp(13px,2.3vw,16px);opacity:.88;line-height:1.35;display:block}
.mc .em{font-size:38px;display:block;margin-bottom:2px}
.mc.on{border-color:#ffe066;background:linear-gradient(135deg,rgba(255,224,102,.28),rgba(255,107,157,.22));transform:scale(1.02);box-shadow:0 0 28px rgba(255,224,102,.35)}
.big{display:block;width:100%;border:none;border-radius:24px;padding:16px;font-size:clamp(24px,5vw,34px);font-weight:900;color:#4a2b00;background:linear-gradient(#ffe066,#ffa81a);box-shadow:0 8px 0 #b36200,0 14px 30px rgba(0,0,0,.35);margin:14px 0 10px;animation:pulse 1.6s ease-in-out infinite}
.big:active{transform:translateY(5px);box-shadow:0 3px 0 #b36200}
@keyframes pulse{50%{transform:scale(1.025)}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mid{border:none;border-radius:20px;padding:14px;font-size:clamp(17px,3.4vw,22px);font-weight:900;color:#fff;position:relative}
.mid.shop{background:linear-gradient(#ff7eb3,#e63e86);box-shadow:0 6px 0 #9c1f5a}
.mid.dun{background:linear-gradient(#7c6cff,#4b37d6);box-shadow:0 6px 0 #2a1f93}
.mid:active{transform:translateY(4px);box-shadow:none}
.badge{position:absolute;top:-8px;right:-4px;background:#ff3b3b;border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-size:15px;padding:0 6px;border:2px solid #fff}
#best{text-align:center;margin:12px 0 0;opacity:.9;font-size:16px}
.back{border:none;border-radius:999px;padding:8px 18px;font-size:18px;font-weight:900;background:#fff;color:var(--ink);box-shadow:0 4px 0 #b8b2e8}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.sk{background:rgba(255,255,255,.1);border:3px solid rgba(255,255,255,.2);border-radius:22px;padding:14px;text-align:center}
.sk.eq{border-color:#4ff0b7;box-shadow:0 0 24px rgba(79,240,183,.4)}
.sk .e{font-size:64px;line-height:1.1;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.sk b{display:block;font-size:20px;margin:4px 0 8px}
.sk button{border:none;border-radius:14px;padding:9px 14px;font-size:17px;font-weight:900;color:#4a2b00;background:linear-gradient(#ffe066,#ffa81a);box-shadow:0 4px 0 #b36200}
.sk button.g{background:linear-gradient(#6df2b8,#1fbf85);color:#043d27;box-shadow:0 4px 0 #0e7a54}
.sk button:disabled{opacity:.5}
.nl{display:flex;flex-direction:column;gap:8px}
.nr{background:rgba(255,255,255,.1);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:18px}
.nr em{font-style:normal;background:#ffe066;color:#4a2b00;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:900}
.nr span{opacity:.8;font-size:15px}
#game{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d0a2e}
#gbar{width:100%;max-width:1000px;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;gap:6px;flex:none}
#gbar .l,#gbar .r{display:flex;gap:6px}
.sm{border:none;border-radius:12px;height:34px;min-width:40px;padding:0 12px;font-size:17px;font-weight:900;background:rgba(255,255,255,.16);color:#fff}
.sm.off{opacity:.45}
#cv{display:block;border-radius:14px;box-shadow:0 8px 40px rgba(0,0,0,.55);background:#000;touch-action:none}
#pad{display:none;width:100%;max-width:720px;height:116px;align-items:center;justify-content:space-between;padding:6px 18px;flex:none}
#pad.show{display:flex}
#pad .grp{display:flex;gap:14px}
.pb{width:92px;height:92px;border-radius:26px;border:none;font-size:34px;line-height:1;color:#fff;background:linear-gradient(#7b6cff,#4a3bd6);box-shadow:0 7px 0 #2a1f93,0 12px 18px rgba(0,0,0,.4);font-weight:900;touch-action:none}
.pb small{display:block;font-size:12px;font-weight:700;opacity:.9;margin-top:2px}
.pb.mdl{width:78px;height:78px;background:linear-gradient(#ff7eb3,#e63e86);box-shadow:0 7px 0 #9c1f5a,0 12px 18px rgba(0,0,0,.4)}
.pb.on{transform:translateY(6px);box-shadow:0 1px 0 #2a1f93}
.ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,6,40,.72);backdrop-filter:blur(5px);z-index:20;padding:14px}
.box{background:linear-gradient(160deg,#3b2a9a,#241a66);border:3px solid rgba(255,255,255,.3);border-radius:28px;padding:22px 26px;text-align:center;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.box h2{margin:0 0 10px;font-size:32px}
.box .btn{display:block;width:100%;margin:10px 0 0;border:none;border-radius:18px;padding:13px;font-size:22px;font-weight:900;color:#4a2b00;background:linear-gradient(#ffe066,#ffa81a);box-shadow:0 5px 0 #b36200}
.box .btn.s{background:#fff;color:var(--ink);box-shadow:0 5px 0 #b8b2e8}
.stars{font-size:52px;letter-spacing:6px;margin:4px 0 8px}
.stars span{display:inline-block;animation:star .6s both}
@keyframes star{from{transform:scale(0) rotate(-90deg)}}
.rows{background:rgba(255,255,255,.1);border-radius:16px;padding:10px 14px;margin:10px 0;font-size:19px}
.rows div{display:flex;justify-content:space-between;padding:3px 0}
.new{color:#ffe066;font-weight:900;animation:pulse 1s infinite}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(30px);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:999px;font-size:18px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:50;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:640px){.grid6{grid-template-columns:repeat(3,1fr)}.modes{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="bg"></div>

<div id="menu" class="screen"><div class="wrap">
  <div class="top">
    <div class="chip">🪙 <b id="coinNum">0</b></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="tg" id="tSfx">🔊 효과음</button>
      <button class="tg" id="tBgm">🎵 배경음</button>
      <button class="tg" id="tVoice">🗣 음성</button>
      <button class="tg" id="tPad">🎮 터치패드</button>
    </div>
  </div>
  <div class="logo">
    <div class="bl"><i>＋</i><i>－</i><i>×</i><i>÷</i></div>
    <h1>매스 블록 어드벤처</h1>
    <p class="sub">달리고, 점프하고, 블록을 터뜨리며 수학 마스터가 되자!</p>
  </div>
  <div class="panel"><h3>① 학년을 골라요</h3><div class="grid6" id="gradeBtns"></div><p id="gdesc"></p></div>
  <div class="panel"><h3>② 게임 모드를 골라요</h3>
    <div class="modes">
      <button class="mc" data-mode="run"><span class="em">🏃‍♂️</span><b>런 앤 점프 매스</b><span>달리고 점프해서 머리로 정답 벽돌을 쾅! 슬라임은 밟으면 코인 획득. 틀려도 수직선 힌트가 도와줘요.</span></button>
      <button class="mc" data-mode="drop"><span class="em">🧱</span><b>넘버 드롭 디펜스</b><span>떨어지는 숫자 블록으로 목표를 만들어 보스 몬스터를 물리쳐요. ▲ 버튼으로 연산·숫자를 바꿔요.</span></button>
    </div>
  </div>
  <button class="big" id="btnStart">▶ 게임 시작!</button>
  <div class="row2">
    <button class="mid shop" id="btnShop">🛍 캐릭터 스킨 상점</button>
    <button class="mid dun" id="btnNotes">📒 오답 노트 · 복습 던전<span class="badge hidden" id="wBadge">0</span></button>
  </div>
  <p id="best"></p>
  <p style="text-align:center;opacity:.6;font-size:14px;margin-top:18px">PC: ← → 이동 · ↑ 점프/변환 · ↓ 빠른 낙하 · Space 점프/즉시 낙하 · P 일시정지</p>
</div></div>

<div id="shop" class="screen hidden"><div class="wrap">
  <div class="top"><button class="back" data-back>← 메인</button><div class="chip">🪙 <b id="coinNum2">0</b></div></div>
  <div class="logo"><h1 style="font-size:clamp(26px,5vw,40px)">🛍 캐릭터 스킨 상점</h1><p class="sub">코인으로 멋진 캐릭터를 모아요!</p></div>
  <div class="skins" id="skinList"></div>
</div></div>

<div id="notes" class="screen hidden"><div class="wrap">
  <div class="top"><button class="back" data-back>← 메인</button><div class="chip">📒 <b id="wCount">0</b>문제</div></div>
  <div class="logo"><h1 style="font-size:clamp(26px,5vw,40px)">📒 오답 노트</h1><p class="sub">헷갈렸던 문제를 다시 풀면 코인이 2배!</p></div>
  <button class="big" id="btnDungeon">🔥 복습 보너스 던전 입장</button>
  <div class="nl" id="noteList"></div>
  <button class="back" id="btnClear" style="margin:16px auto;display:block">🗑 오답 노트 비우기</button>
</div></div>

<div id="game" class="hidden">
  <div id="gbar">
    <div class="l"><button class="sm" id="gQuit">← 메인</button></div>
    <div class="r"><button class="sm" id="gSfx">🔊</button><button class="sm" id="gBgm">🎵</button><button class="sm" id="gVoice">🗣</button><button class="sm" id="gPause">⏸</button></div>
  </div>
  <canvas id="cv"></canvas>
  <div id="pad">
    <div class="grp"><button class="pb" data-k="left">◀</button><button class="pb" data-k="right">▶</button></div>
    <button class="pb mdl" data-k="action">⏬<small id="lblAct">액션</small></button>
    <div class="grp"><button class="pb" data-k="up">▲<small id="lblUp">점프</small></button><button class="pb" data-k="down">▼<small id="lblDown">낙하</small></button></div>
  </div>
</div>

<div id="pause" class="ov hidden"><div class="box"><h2>⏸ 잠깐 쉬어요</h2>
  <button class="btn" id="pResume">▶ 계속하기</button><button class="btn s" id="pQuit">🏠 메인으로</button></div></div>
<div id="result" class="ov hidden"><div class="box" id="resBox"></div></div>
<div id="toast"></div>

<script>
'use strict';
//#GEN_START
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r2=v=>Math.round(v*1000)/1000;
const fmt=v=>String(r2(v));
const KD=['영','일','이','삼','사','오','육','칠','팔','구'];
function koInt(n){n=Math.floor(n);if(n<=0)return'영';let s='';const man=Math.floor(n/10000);n%=10000;if(man)s+=(man>1?koInt(man):'일')+'만';for(const[v,w]of[[1000,'천'],[100,'백'],[10,'십']]){const d=Math.floor(n/v);n%=v;if(d)s+=(d>1?KD[d]:'')+w;}if(n)s+=KD[n];return s;}
function koNum(str){str=String(str);if(str.indexOf('.')<0)return koInt(+str);const p=str.split('.');return koInt(+p[0])+' 점 '+p[1].split('').map(d=>KD[+d]).join(' ');}
const OPS={'+':' 더하기 ','−':' 빼기 ','×':' 곱하기 ','÷':' 나누기 ','=':' 은 '};
function sp(e){return String(e).replace(/(\d+)\/(\d+)|(\d+(?:\.\d+)?)%|(\d+(?:\.\d+)?)|([+−×÷=])/g,(m,fn,fd,pc,nm,op)=>{if(fd!==undefined)return koInt(+fd)+' 분의 '+koInt(+fn);if(pc!==undefined)return koNum(pc)+' 퍼센트';if(nm!==undefined)return koNum(nm);return OPS[op];});}
function eqSpeech(e){const i=e.indexOf(' = ');if(i<0)return sp(e);const L=sp(e.slice(0,i)).trim(),R=sp(e.slice(i+3)).trim();const c=L.charCodeAt(L.length-1);const b=c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28!==0;return L+(b?'은 ':'는 ')+R;}
const PRAISE=['최고예요!','정말 잘했어요!','멋져요!','대단해요!','와, 천재예요!'];

function numCh(ans,o){o=o||{};const u=o.unit||1,min=o.min===undefined?0:o.min,max=o.max===undefined?1e9:o.max,f=o.fmt||fmt;
 const ok=v=>v>=min-1e-9&&v<=max+1e-9;
 const pri=shuffle((o.cands||[]).filter(ok)),rest=shuffle([1,2,3,-1,-2,-3,10,-10].map(d=>ans+d*u).filter(ok));
 const seen=new Set([r2(ans)]),wrong=[];
 for(const v of pri.concat(rest)){const k=r2(v);if(seen.has(k))continue;seen.add(k);wrong.push(v);if(wrong.length>=3)break;}
 for(let d=4;wrong.length<3&&d<60;d++){for(const v of [ans+d*u,ans-d*u]){const k=r2(v);if(wrong.length<3&&ok(v)&&!seen.has(k)){seen.add(k);wrong.push(v);}}}
 return shuffle([ans].concat(wrong).map(v=>({label:f(v),val:r2(v),correct:r2(v)===r2(ans)})));}
function fracCh(n,d){return numCh(n,{min:1,max:d,fmt:v=>v+'/'+d}).map(c=>({label:c.label,val:r2(c.val/d),correct:c.correct}));}
function decCh(s,max){return numCh(s,{min:0,max:max||20,fmt:v=>(v/10).toFixed(1)}).map(c=>({label:c.label,val:r2(c.val/10),correct:c.correct}));}
function S1(prompt,eq,ans,ch,vis,x){return Object.assign({kind:'single',prompt:prompt,eq:eq,ans:r2(ans),bricks:ch,vis:vis||{t:'none'}},x||{});}
function sumBricks(vals,f){return vals.map(v=>({label:'+'+f(v),val:v,add:v,correct:false}));}
function divisors(n){const r=[];for(let i=1;i<=n;i++)if(n%i===0)r.push(i);return r;}

function gen1(special){
 if(special){const T=rnd(8,15);return{kind:'sum',prompt:T+' 만들기!',target:T,vis:{t:'ten',dyn:true},bricks:sumBricks(shuffle([5,3,2,1]),String),g:1,eq:''};}
 const t=pick(['pair','pair','add','sub']);
 if(t==='pair'){const a=rnd(1,9),b=10-a;return S1(a+' + ? = 10',a+' + '+b+' = 10',b,numCh(b,{min:0,max:10}),{t:'ten',a:a,b:0},{g:1});}
 if(t==='add'){const a=rnd(3,12),b=rnd(2,Math.min(9,20-a)),s=a+b;return S1(a+' + '+b+' = ?',a+' + '+b+' = '+s,s,numCh(s,{min:0,max:20}),{t:'ten',a:a,b:b},{g:1});}
 const a=rnd(6,18),b=rnd(1,Math.min(9,a-1)),s=a-b;return S1(a+' − '+b+' = ?',a+' − '+b+' = '+s,s,numCh(s,{min:0,max:20}),{t:'ten',a:a,b:0,cap:'빼는 수: '+b},{g:1});
}
function gen2(special){
 if(special){const T=rnd(13,45);return{kind:'sum',prompt:T+' 만들기!',target:T,vis:{t:'b10',dyn:true},bricks:sumBricks([10,5,1],String),g:2,eq:''};}
 const t=pick(['add','sub','mul','mul','mulb']);
 if(t==='add'){let a,b,k=0;do{a=rnd(12,68);b=rnd(12,99-a);k++;}while((a%10+b%10<10)&&k<300);const s=a+b;
  return S1(a+' + '+b+' = ?',a+' + '+b+' = '+s,s,numCh(s,{min:0,cands:[s+10,s-10,s+1,s-1]}),{t:'b10',n:[a,b]},{g:2});}
 if(t==='sub'){let a,b,k=0;do{a=rnd(32,95);b=rnd(11,a-10);k++;}while((a%10>=b%10)&&k<300);const s=a-b;
  return S1(a+' − '+b+' = ?',a+' − '+b+' = '+s,s,numCh(s,{min:0,cands:[s+10,s-10,s+1,s-1]}),{t:'b10',n:[a],cap:'빼는 수: '+b},{g:2});}

function startRun(grade,dungeon){

 G={mode:'run',grade:dungeon?0:grade,dungeon:!!dungeon,rounds:rounds,round:-1,score:0,hearts:3,combo:0,fever:false,correct:0,coinsGot:0,t:0,paused:false,over:false,state:'countdown',cd:3.4,lastCd:4,parts:[],floats:[],hint:null,bricks:[],slimes:[],sum:0,hits:[],wrongInRound:0,wrongRec:false,shake:0,winT:0,cur:null,

function loadRound(){

 const r=G.rounds[G.round];G.cur=r;G.wrongInRound=0;G.wrongRec=false;G.sum=0;G.hits=[];G.hint=null;if(G.state==='win')G.state='play';

function updRun(dt){

 if(G.state==='countdown'){G.cd-=dt;const n=Math.ceil(G.cd-.4);if(n!==G.lastCd){G.lastCd=n;if(n>0)Snd.tone(440,.12,'square',.1);else Snd.tone(880,.3,'square',.12);}if(G.cd<=0)G.state='play';return;}
 if(G.state==='win'){G.winT-=dt;if(G.winT<=0)loadRound();}
 let ax=0;if(keys.left)ax-=1;if(keys.right)ax+=1;
 p.vx+=(ax*4.8-p.vx)*Math.min(1,.25*k);p.x=clamp(p.x+p.vx*k,24,W-24);
 if(p.onGround&&(keys.up||keys.action)){p.vy=-15.2;p.onGround=false;p.sq=-.3;Snd.jump();}

  if(p.x+14>b.x&&p.x-14<b.x+b.w&&prevTop>=b.y+b.h-6&&p.y-48<b.y+b.h){p.y=b.y+b.h+48;p.vy=2;hitBrick(b);break;}}}

  s.x+=s.dir*s.speed*k;if(s.x<40){s.x=40;s.dir=1;}if(s.x>W-40){s.x=W-40;s.dir=-1;}

   else if(p.inv<=0){G.hearts--;p.inv=1.6;p.vy=-8;p.onGround=false;p.vx=(p.x<s.x?-1:1)*7;Snd.hurt();G.shake=.5;G.combo=0;G.fever=false;burst(p.x,p.y-20,10,'#ff6b6b');if(G.hearts<=0)finish(false);}}});}
function hitBrick(b){
 if(G.state!=='play')return;const r=G.cur;b.cool=.35;b.bump=1;Snd.bump();burst(b.x+b.w/2,b.y+b.h,7,'#ffd166',4);

function calc(op,x,y){switch(op){case '+':return x+y;case '−':return Math.abs(x-y);case '×':return x*y;case '÷':{const hi=Math.max(x,y),lo=Math.min(x,y);return lo?hi/lo:NaN;}}return NaN;}

 const ops=a.op===b.op?[a.op]:[a.op,b.op];for(const op of ops){if(Math.abs(calc(op,a.val,b.val)-gl.target)<1e-6)return op;}return null;}
function makeGoal(g,k){
 const ints=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push({label:String(i),val:i});return r;};

 if(g===1){const t=[10,12,8][k%3];return{text:'합해서 '+t+' 만들기',spoken:'합해서 '+koInt(t)+' 만들기',ops:['+'],pool:ints(1,9),target:t};}
 if(g===2){const t=[12,18,24][k%3];return{text:'더하거나 곱해서 '+t+' 만들기',spoken:'더하거나 곱해서 '+koInt(t)+' 만들기',ops:['+','×'],pool:ints(2,9),target:t};}
 if(g===3){if(k%2===0){const d=[4,6,8][Math.floor(k/2)%3];return{text:'합해서 1 만들기 (분모 '+d+')',spoken:'합해서 일 만들기',ops:['+'],pool:frs(d),target:1};}
  const t=[3,2,4][k%3];return{text:'나누어서 몫이 '+t+' 되게',spoken:'나누어서 몫이 '+koInt(t)+' 되게',ops:['÷'],pool:ints(2,16),target:t};}
 if(g===4){if(k===0)return{text:'합해서 1.0 만들기',spoken:'합해서 일 점 영 만들기',ops:['+'],pool:decs(),target:1};
  if(k===1)return{text:'합해서 1 만들기 (분모 5)',spoken:'합해서 일 만들기',ops:['+'],pool:frs(5),target:1};
  return{text:'더하거나 빼서 0.5 만들기',spoken:'더하거나 빼서 영 점 오 만들기',ops:['+','−'],pool:decs(),target:.5};}
 if(g===5){const t=[12,24,36][k%3];return{text:'더하거나 곱해서 '+t+' 만들기',spoken:'더하거나 곱해서 '+koInt(t)+' 만들기',ops:['+','×'],pool:ints(2,12),target:t};}

 return{text:'같은 크기끼리 붙이기!',spoken:'같은 크기끼리 붙여요',ops:['='],pool:pool,eq:true,target:0};}
function genBlock(){

 ctx.restore();}
function bgDrop(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1b1464');g.addColorStop(1,'#0f0c29');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 for(let i=0;i<50;i++){const x=(i*173)%W,y=(i*97+T*(8+i%5*4))%H;ctx.fillStyle='rgba(255,255,255,'+(.2+(i%4)*.12)+')';ctx.fillRect(x,y,2+i%2,2+i%2);}
 ctx.strokeStyle='rgba(124,108,255,.16)';ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}}
function drawPanel(x,y,w,h,fillA){rr(x,y,w,h,18);ctx.fillStyle=fillA||'rgba(255,255,255,.1)';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.25)';ctx.stroke();}
function drawDrop(){
 ctx.save();ctx.setTransform(CS,0,0,CS,0,0);bgDrop();
 ctx.save();if(G.shake>0)ctx.translate((Math.random()-.5)*G.shake*12,(Math.random()-.5)*G.shake*12);
 rr(BX-8,BY-8,COLS*CELL+16,ROWS*CELL+16,16);ctx.fillStyle='rgba(8,6,36,.82)';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=G.fever?'#ffd54f':'#7c6cff';ctx.stroke();
 ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;for(let i=1;i<COLS;i++){ctx.beginPath();ctx.moveTo(BX+i*CELL,BY);ctx.lineTo(BX+i*CELL,BY+ROWS*CELL);ctx.stroke();}for(let i=1;i<ROWS;i++){ctx.beginPath();ctx.moveTo(BX,BY+i*CELL);ctx.lineTo(BX+COLS*CELL,BY+i*CELL);ctx.stroke();}
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(G.grid[r][c])drawBlk(BX+c*CELL,BY+r*CELL,G.grid[r][c],false);
 if(G.cur&&G.phase==='fall'){const cur=G.cur;let gr=cur.r;while(gr+1<ROWS&&!G.grid[gr+1][cur.c])gr++;
  ctx.setLineDash([6,5]);ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;rr(BX+cur.c*CELL+4,BY+gr*CELL+4,CELL-8,CELL-8,9);ctx.stroke();ctx.setLineDash([]);
  const iv=keys.down?.045:G.speed,fy=cur.r+(canDown()?clamp(G.timer/iv,0,1):0);drawBlk(BX+cur.c*CELL,BY+fy*CELL,cur.blk,true);}
 ctx.restore();
 // 왼쪽: 보스 / 목표
 const bs=BOSSES[G.defeated%4];drawPanel(20,20,290,250,'rgba(255,255,255,.08)');
 txt('보스 '+Math.min(3,G.defeated+1)+' / 3 · '+bs[1],165,40,18,'#ffe066');
 ctx.save();ctx.translate(165+(G.bossHit>0?(Math.random()-.5)*14:0),130+Math.sin(T*2.5)*6);ctx.font='110px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';if(G.bossHit>0)ctx.filter='brightness(2)';ctx.fillText(bs[0],0,0);ctx.restore();
 rr(40,214,250,22,11);ctx.fillStyle='rgba(0,0,0,.45)';ctx.fill();const hp=clamp(G.bossHp/G.bossMax,0,1);if(hp>0){rr(40,214,Math.max(22,250*hp),22,11);const hg=ctx.createLinearGradient(40,0,290,0);hg.addColorStop(0,'#ff5e7a');hg.addColorStop(1,'#ffa94d');ctx.fillStyle=hg;ctx.fill();}
 txt('HP '+Math.max(0,Math.ceil(G.bossHp)),165,226,15,'#fff');
 drawPanel(20,284,290,128,'rgba(124,108,255,.28)');
 if(G.goalFlash>0){ctx.globalAlpha=.4+Math.sin(T*14)*.3;rr(20,284,290,128,18);ctx.fillStyle='#fff';ctx.fill();ctx.globalAlpha=1;}
 txt('🎯 목표',165,304,18,'#ffe066');
 const words=G.goal.text.split(' '),mid=Math.ceil(words.length/2),lines=G.goal.text.length>10?[words.slice(0,mid).join(' '),words.slice(mid).join(' ')]:[G.goal.text];
 lines.forEach((l,i)=>{const fs=fit(l,264,lines.length>1?30:34,16);txt(l,165,(lines.length>1?340+i*34:358),fs,'#fff',null,'900',['#2a1f93',5]);});
 if(G.goal.ops.length>1)txt('▲ 연산 기호를 바꿔요 ('+G.goal.ops.join(' ')+')',165,396,14,'#cdd6ff','center','700');else txt('▲ 숫자를 바꿔요 (3가지)',165,396,14,'#cdd6ff','center','700');
 drawPanel(20,424,290,100,'rgba(255,255,255,.08)');
 txt('⭐ '+G.score,40,446,22,'#fff','left');txt('🪙 '+S.coins,200,446,22,'#ffe066','left');
 if(G.fever){const pl=1+Math.sin(T*10)*.05;ctx.save();ctx.translate(165,486);ctx.scale(pl,pl);txt('🔥 FEVER ×2 · '+Math.ceil(G.feverT)+'초',0,0,24,'#ffd54f',null,'900',['#a33b00',4]);ctx.restore();}
 else{txt('연속 성공 '+G.combo+' / 3',165,486,18,'#9ff5e0');for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(120+i*45,508,8,0,7);ctx.fillStyle=i<G.combo?'#ffd54f':'rgba(255,255,255,.2)';ctx.fill();}}
 // 오른쪽
 drawPanel(650,20,290,110,'rgba(255,255,255,.08)');txt('다음 블록',700,40,16,'#cdd6ff');
 if(G.next){ctx.save();ctx.translate(680,56);drawBlk(0,0,G.next,false);ctx.restore();}
 const cb=G.cur?G.cur.blk:null;
 txt('지금 블록 '+(cb?(G.goal.ops.length>1&&!G.goal.eq?'연산 '+cb.op:''):''),840,40,16,'#cdd6ff');
 if(cb){ctx.save();ctx.translate(815,56);drawBlk(0,0,cb,false);ctx.restore();}
 rr(650,144,290,170,18);ctx.fillStyle='#eaf4ff';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#7c6cff';ctx.stroke();
 txt('시각 교구',795,160,15,'#7a5af8');
 if(cb){const v=visOfBlock(cb,G.grade);if(v.t==='none'){txt('블록끼리 붙여서',795,226,20,'#241a55');txt('목표를 만들어요!',795,256,20,'#241a55');}else drawVisual(v,656,168,278,142);}
 drawPanel(650,328,290,196,'rgba(255,255,255,.08)');
 txt('조작 방법',795,348,17,'#ffe066');
 ['◀ ▶  이동','▲  '+(G.goal.ops.length>1?'연산 기호 변환':'숫자 변환'),'▼  빠르게 내리기','Space  즉시 떨어뜨리기','P  일시정지'].forEach((l,i)=>txt(l,670,378+i*28,17,'#fff','left','700'));
 drawParts();
 if(G.phase==='banner')banner(G.bannerText,'새 목표: '+G.goal.text);
 if(G.phase==='countdown')drawCountdown();
 if(G.fever){ctx.strokeStyle='rgba(255,213,79,'+(.45+Math.sin(T*8)*.25)+')';ctx.lineWidth=8;ctx.strokeRect(4,4,W-8,H-8);}
 ctx.restore();}

/* ===================== 종료 / 결과 ===================== */
function finish(win){
 if(!G||G.fover)return;const g0=G;G.fover=true;G.over=true;Snd.stopBgm();for(const k in keys)keys[k]=false;
 if(win)Snd.win();else Snd.lose();
 setTimeout(()=>{if(G===g0)showResult(win);},900);}
function showResult(win){
 const g=G;if(!g)return;let st=0,total;
 if(g.mode==='run'){total=g.rounds.length;const ra=g.correct/total;st=ra>=.9?3:ra>=.6?2:ra>=.3?1:0;if(!win&&st>1)st=1;}
 else st=win?3:clamp(g.defeated,0,2)+(g.score>=300&&g.defeated===0?1:0);
 const key=g.dungeon?'dungeon':g.mode+'_g'+g.grade,prev=S.best[key]||0,isNew=g.score>prev;if(isNew)S.best[key]=g.score;persist();
 let rows='<div><span>⭐ 점수</span><b>'+g.score+'점</b></div><div><span>🪙 이번에 모은 코인</span><b>+'+g.coinsGot+'</b></div>';
 rows+=g.mode==='run'?'<div><span>✅ 한 번에 맞힌 문제</span><b>'+g.correct+' / '+g.rounds.length+'</b></div>':'<div><span>👾 물리친 보스</span><b>'+g.defeated+' / 3</b></div>';
 rows+='<div><span>🏆 최고 점수</span><b>'+Math.max(prev,g.score)+'점</b></div>';
 $('#resBox').innerHTML='<h2>'+(win?'🎉 클리어!':'💪 조금만 더 힘내요!')+'</h2><div class="stars">'+[0,1,2].map(i=>'<span style="animation-delay:'+(.2+i*.25)+'s">'+(i<st?'⭐':'☆')+'</span>').join('')+'</div>'+(isNew&&g.score>0?'<div class="new">✨ 신기록!</div>':'')+'<div class="rows">'+rows+'</div>'
  +'<button class="btn" id="rAgain">🔄 다시 하기</button>'+(S.wrong.length?'<button class="btn s" id="rDun">📒 오답 복습 던전 ('+S.wrong.length+')</button>':'')+'<button class="btn s" id="rMenu">🏠 메인으로</button>';
 $('#result').classList.remove('hidden');
 $('#rAgain').onclick=()=>{Snd.click();$('#result').classList.add('hidden');startGame(lastCfg.mode,lastCfg.grade,lastCfg.dungeon&&S.wrong.length>0);};
 const rd=$('#rDun');if(rd)rd.onclick=()=>{$('#result').classList.add('hidden');startGame('run',0,true);};
 $('#rMenu').onclick=()=>{Snd.click();quitToMenu();};
 speak(win?'우와! 정말 잘했어요!':'괜찮아요! 다시 도전해봐요!');}

/* ===================== 메인 루프 ===================== */
let last=0;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;T=ts/1000;
 if(G){if(!G.paused&&!G.over){G.t+=dt;if(G.mode==='run')updRun(dt);else updDrop(dt);}
  else if(!G.paused){updParts(dt);}
  if(G){if(G.mode==='run')drawRun();else drawDrop();}}
 just={};}
requestAnimationFrame(loop);
renderMenu();screenTo('menu');
if('speechSynthesis' in window){try{speechSynthesis.getVoices();}catch(e){}}
</script>
